<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef1ff">
<title>HanMap — карты китайских иероглифов</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#eef1ff; --bg2:#fff3f3; --card:#ffffff; --ink:#20243a; --mut:#7a809c;
  --red:#e03131; --blue:#4263eb; --line:#8ea2ff; --sh:0 12px 32px rgba(50,60,130,.14);
  --grad:linear-gradient(135deg,#ff6b6b,#e03131); --grad2:linear-gradient(135deg,#4263eb,#7048e8);
}
body.dark{--bg1:#0e1220;--bg2:#141a2e;--card:#1b2036;--ink:#eef1ff;--mut:#9aa3c7;--line:#5b74d8;--sh:0 12px 32px rgba(0,0,0,.5)}
body{font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);min-height:100vh;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.5}
body::before{width:420px;height:420px;background:#ffc9c9;top:-120px;right:-120px}
body::after{width:380px;height:380px;background:#bac8ff;bottom:-120px;left:-120px}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.logo small{font-size:12px;color:var(--mut);font-weight:600}
.stats{margin-left:auto;display:flex;gap:8px}
.chip{background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--mut)}
.icon-btn{width:44px;height:44px;border-radius:16px;border:none;background:var(--card);box-shadow:var(--sh);font-size:18px;cursor:pointer;transition:.2s;color:var(--ink)}
.icon-btn:hover{transform:translateY(-2px)} .icon-btn:active{transform:scale(.92)}
.tagline{color:var(--mut);font-size:13px;margin:-6px 0 14px 4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:200px;display:flex;align-items:center;background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:0 14px}
.search input{flex:1;border:none;outline:none;background:transparent;padding:14px 8px;font-size:15px;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:18px;border:none;background:var(--card);
  box-shadow:var(--sh);font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;transition:.2s;user-select:none}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.94)}
.btn.grad{background:var(--grad);color:#fff} .btn.grad2{background:var(--grad2);color:#fff}
.btn.active{outline:3px solid var(--blue)}
.navrow{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 10px}
.nav-btn{width:48px;height:48px;border-radius:50%;border:none;background:var(--grad2);color:#fff;font-size:20px;cursor:pointer;box-shadow:var(--sh);transition:.2s}
.nav-btn:active{transform:scale(.9)}
#posLabel{font-weight:700;color:var(--mut);font-size:13px;min-width:70px;text-align:center}
#map{position:relative;display:flex;align-items:center;gap:34px;padding:10px 4px}
#lines{position:absolute;inset:0;pointer-events:none;z-index:0}
.ln{transition:stroke-dashoffset .7s ease}
.main-node{z-index:1;background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:22px 26px;text-align:center;cursor:pointer;flex:none;transition:.2s}
.main-node:active{transform:scale(.96)}
.main-node .py{color:var(--blue);font-weight:700;font-size:18px}
.main-node .hz{color:var(--red);font-size:clamp(64px,16vw,104px);font-weight:800;line-height:1.15}
.main-node .ru{color:var(--mut);font-size:14px;font-weight:600}
#words{z-index:1;flex:1;display:flex;flex-direction:column;gap:12px}
.word{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:10px 16px;text-align:center;cursor:pointer;transition:.2s;animation:pop .5s both}
.word:hover{transform:translateY(-2px)} .word:active{transform:scale(.96)}
.word .py{color:var(--mut);font-size:12px;font-weight:600}
.word .hz{font-size:clamp(24px,6vw,32px);font-weight:800;letter-spacing:2px}
.word .ru{color:var(--mut);font-size:12px;font-weight:600}
.c-red{color:var(--red)} .c-blue{color:var(--blue)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.94)}}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 8px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px 0 8px}
.modal{position:fixed;inset:0;background:rgba(10,12,30,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal-card{width:min(94vw,430px);max-height:88vh;overflow:auto;background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:20px}
.modal-card.wide{width:min(94vw,680px)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h3{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.tile{background:var(--card);border:2px solid transparent;border-radius:16px;box-shadow:var(--sh);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:.15s;color:var(--ink)}
.tile:hover{border-color:var(--blue);transform:translateY(-2px)}
.t-hz{font-size:30px;font-weight:800;color:var(--red)} .t-py{font-size:11px;color:var(--mut);font-weight:600}
.empty{color:var(--mut);text-align:center;padding:30px;font-weight:700}
.canvas-wrap{position:relative;width:min(78vw,320px);margin:0 auto}
#guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);opacity:.16;font-weight:800;pointer-events:none;user-select:none}
#guide.hidden{display:none}
#pad{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.q-ru{font-size:20px;font-weight:800;text-align:center;margin:6px 0 16px}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-opt{background:var(--card);border:2px solid transparent;border-radius:18px;box-shadow:var(--sh);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:28px;font-weight:800;color:var(--ink);transition:.15s}
.q-opt small{font-size:11px;color:var(--mut);font-weight:600}
.q-opt.ok{border-color:#2f9e44;background:rgba(47,158,68,.15)}
.q-opt.bad{border-color:var(--red);background:rgba(224,49,49,.12)}
.q-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg1);
  padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:var(--sh)}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🀄 HanMap <small>карты иероглифов</small></div>
    <div class="stats"><span class="chip" id="statHz"></span><span class="chip" id="statWord"></span></div>
    <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
  </header>
  <div class="tagline">Учи иероглифы по картам‑связкам • HSK 1–2 • озвучка zh‑CN</div>

  <div class="toolbar">
    <div class="search"><span>🔍</span><input id="q" placeholder="Поиск: иероглиф, pinyin, перевод…"></div>
    <button class="btn grad" id="gridBtn">📚 База</button>
    <button class="btn" id="favBtn">❤️ <span id="favCount">0</span></button>
    <button class="btn grad2" id="randBtn">🎲</button>
  </div>

  <div class="navrow">
    <button class="nav-btn" id="prevBtn">←</button>
    <span id="posLabel"></span>
    <button class="nav-btn" id="nextBtn">→</button>
  </div>

  <section id="map">
    <svg id="lines"></svg>
    <div class="main-node" id="mainNode" title="Озвучить">
      <div class="py" id="mainPy"></div><div class="hz" id="mainHz"></div><div class="ru" id="mainRu"></div>
    </div>
    <div id="words"></div>
  </section>

  <div class="actions">
    <button class="btn" id="speakBtn">🔊 Озвучить</button>
    <button class="btn grad2" id="writeBtn">✍️ Пропись</button>
    <button class="btn" id="likeBtn">🤍 В избранное</button>
    <button class="btn grad" id="quizBtn">🧠 Тест</button>
  </div>
  <footer>HanMap • сделано для изучения ханьцзы • стрелки ← → для навигации</footer>
</div>

<!-- База -->
<div class="modal" id="gridModal"><div class="modal-card wide">
  <div class="modal-head"><h3>📚 База иероглифов</h3><button class="icon-btn" data-close>✕</button></div>
  <div class="grid" id="grid"></div>
</div></div>

<!-- Пропись -->
<div class="modal" id="writeModal"><div class="modal-card">
  <div class="modal-head"><h3 id="writeTitle">✍️ Пропись</h3><button class="icon-btn" data-close>✕</button></div>
  <div class="canvas-wrap" id="canvasWrap"><div id="guide"></div><canvas id="pad"></canvas></div>
  <div class="actions">
    <button class="btn" id="clearBtn">🧽 Очистить</button>
    <button class="btn grad2" id="guideBtn">👁 Образец</button>
  </div>
</div></div>

<!-- Тест -->
<div class="modal" id="quizModal"><div class="modal-card">
  <div class="modal-head"><h3>🧠 Выбери иероглиф</h3><button class="icon-btn" data-close>✕</button></div>
  <div class="q-ru" id="qRu"></div>
  <div class="q-opts" id="qOpts"></div>
  <div class="q-foot"><span class="chip" id="qScore"></span><button class="btn grad2" id="qNext" hidden>Дальше →</button></div>
</div></div>

<div id="toast"></div>

["饭","fàn","еда; рис",[["吃饭","chī fàn","кушать"],["米饭","mǐ fàn","отварной рис"],["饭店","fàn diàn","ресторан"]]],
["朋","péng","друг",[["朋友","péng you","друг"]]],
["友","yǒu","друг",[["朋友","péng you","друг"],["友好","yǒu hǎo","дружелюбный"],["友谊","yǒu yì","дружба"]]],
["老","lǎo","старый",[["老师","lǎo shī","учитель"],["老人","lǎo rén","пожилой человек"],["老婆","lǎo po","жена"],["老虎","lǎo hǔ","тигр"]]],
["师","shī","учитель; мастер",[["老师","lǎo shī","учитель"],["工程师","gōng chéng shī","инженер"],["厨师","chú shī","повар"]]],
["医","yī","врачебный",[["医生","yī shēng","врач"],["医院","yī yuàn","больница"],["中医","zhōng yī","китайская медицина"]]],
["病","bìng","болезнь",[["病人","bìng rén","пациент"],["生病","shēng bìng","заболеть"],["看病","kàn bìng","идти к врачу"]]],
["睡","shuì","спать",[["睡觉","shuì jiào","спать"],["午睡","wǔ shuì","дневной сон"]]],
["买","mǎi","покупать",[["买东西","mǎi dōng xi","делать покупки"],["购买","gòu mǎi","приобретать"],["买菜","mǎi cài","покупать овощи"]]],
["高","gāo","высокий",[["高兴","gāo xìng","счастливый"],["高大","gāo dà","высокий"],["高手","gāo shǒu","мастер"]]]
];
/* ============ ЛОГИКА ============ */
const $=s=>document.querySelector(s);
const ALLW=DB.flatMap(d=>d[3].map(w=>({hz:w[0],py:w[1],ru:w[2]})));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let favs=new Set(load('hanfav',[])), favOnly=false, order=[], pos=0;

$('#statHz').textContent=DB.length+' иероглифов';
$('#statWord').textContent=ALLW.length+' слов';

function buildOrder(){order=favOnly?DB.map((_,i)=>i).filter(i=>favs.has(DB[i][0])):DB.map((_,i)=>i);if(pos>=order.length)pos=0;}
function render(){
  const d=DB[order[pos]];
  $('#mainPy').textContent=d[1];$('#mainHz').textContent=d[0];$('#mainRu').textContent=d[2];
  $('#words').innerHTML=d[3].map((w,i)=>`<div class="word" data-i="${i}" style="animation-delay:${i*70}ms">
    <div class="py">${w[1]}</div>
    <div class="hz">${[...w[0]].map(c=>`<span class="${c===d[0]?'c-red':'c-blue'}">${c}</span>`).join('')}</div>
    <div class="ru">${w[2]}</div></div>`).join('');
  $('#likeBtn').innerHTML=favs.has(d[0])?'❤️ В избранном':'🤍 В избранное';
  $('#posLabel').textContent=(pos+1)+' / '+order.length;
  requestAnimationFrame(drawLines);
}
function drawLines(){
  const map=$('#map'),svg=$('#lines'),mn=$('#mainNode');
  const W=map.clientWidth,H=map.clientHeight;
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const col=getComputedStyle(document.body).getPropertyValue('--line').trim()||'#8ea2ff';
  let html=`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="${col}"/></marker></defs>`;
  const m0=map.getBoundingClientRect(),mr=mn.getBoundingClientRect();
  const x1=mr.right-m0.left+2,y1=mr.top+mr.height/2-m0.top;
  document.querySelectorAll('#words .word').forEach((el,i)=>{
    const r=el.getBoundingClientRect(),x2=r.left-m0.left-10,y2=r.top+r.height/2-m0.top;
    const dx=Math.max(30,(x2-x1)*.45);
    html+=`<path class="ln" style="animation-delay:${i*80}ms" d="M${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="2" marker-end="url(#ar)"/>`;
  });
  svg.innerHTML=html;
  svg.querySelectorAll('.ln').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;requestAnimationFrame(()=>p.style.strokeDashoffset=0);});
}
function go(n){const L=order.length;pos=(pos+n+L)%L;render();}
function speak(t){if(!('speechSynthesis'in window))return toast('Озвучка недоступна');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u);}
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),1700);}

/* навигация */
$('#prevBtn').onclick=()=>go(-1); $('#nextBtn').onclick=()=>go(1);
$('#randBtn').onclick=()=>{pos=Math.floor(Math.random()*order.length);render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
$('#mainNode').onclick=()=>speak(DB[order[pos]][0]);
$('#speakBtn').onclick=()=>speak(DB[order[pos]][0]);
$('#words').addEventListener('click',e=>{const el=e.target.closest('.word');if(!el)return;const w=DB[order[pos]][3][+el.dataset.i];speak(w[0]);toast(w[0]+' — '+w[2]);});

/* избранное */
const updFav=()=>$('#favCount').textContent=favs.size;
$('#likeBtn').onclick=()=>{const hz=DB[order[pos]][0];favs.has(hz)?favs.delete(hz):favs.add(hz);save('hanfav',[...favs]);updFav();render();};
$('#favBtn').onclick=()=>{if(!favOnly&&favs.size===0)return toast('Пока пусто — отметь 🤍');favOnly=!favOnly;$('#favBtn').classList.toggle('active',favOnly);buildOrder();render();};

/* база + поиск */
function buildGrid(q=''){q=norm(q.trim());
  $('#grid').innerHTML=DB.map((d,i)=>({d,i})).filter(({d})=>!q||d[0].includes(q)||norm(d[1]).includes(q)||norm(d[2]).includes(q)||d[3].some(w=>w[0].includes(q)||norm(w[2]).includes(q)))
  .map(({d,i})=>`<button class="tile" data-i="${i}"><span class="t-hz">${d[0]}</span><span class="t-py">${d[1]}</span></button>`).join('')||'<div class="empty">Ничего не найдено 🔍</div>';
}
$('#grid').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;selectChar(+t.dataset.i);});
function selectChar(i){if(!order.includes(i)){favOnly=false;$('#favBtn').classList.remove('active');buildOrder();}pos=order.indexOf(i);render();closeModals();}
$('#gridBtn').onclick=()=>{buildGrid($('#q').value);openM('#gridModal');};
$('#q').addEventListener('input',e=>{buildGrid(e.target.value);openM('#gridModal');});

/* модалки */
function openM(s){$(s).classList.add('open');}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals();}));

/* пропись */
const pad=$('#pad'),ctx=pad.getContext('2d');let drawing=false,last=null;
$('#writeBtn').onclick=()=>{const d=DB[order[pos]];$('#writeTitle').textContent='✍️ Пропись: '+d[0]+' ('+d[1]+')';$('#guide').textContent=d[0];openM('#writeModal');setTimeout(padSize,60);};
function padSize(){const s=$('#canvasWrap').clientWidth,dpr=devicePixelRatio||1;
  pad.width=s*dpr;pad.height=s*dpr;pad.style.width=s+'px';pad.style.height=s+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);$('#guide').style.fontSize=s*.78+'px';grid(s);}
function grid(s){ctx.clearRect(0,0,s,s);ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--red');ctx.lineWidth=2;ctx.setLineDash([]);ctx.strokeRect(1,1,s-2,s-2);
  ctx.setLineDash([6,6]);ctx.lineWidth=1;ctx.globalAlpha=.45;
  [[s/2,0,s/2,s],[0,s/2,s,s/2],[0,0,s,s],[s,0,0,s]].forEach(l=>{ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.stroke();});
  ctx.globalAlpha=1;ctx.setLineDash([]);}
const pt=e=>{const r=pad.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
pad.addEventListener('pointerdown',e=>{drawing=true;last=pt(e);pad.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],4,0,7);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--ink');ctx.fill();});
pad.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--ink');ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;});
['pointerup','pointerleave'].forEach(ev=>pad.addEventListener(ev,()=>drawing=false));
$('#clearBtn').onclick=()=>padSize();
$('#guideBtn').onclick=()=>$('#guide').classList.toggle('hidden');

/* тест */
let qScore=0,qStreak=0,qCur=null;
$('#quizBtn').onclick=()=>{openM('#quizModal');newQ();};
function newQ(){qCur=ALLW[Math.floor(Math.random()*ALLW.length)];
  const opts=shuffle([qCur,...shuffle(ALLW.filter(w=>w.hz!==qCur.hz)).slice(0,3)]);
  $('#qRu').textContent='«'+qCur.ru+'»';
  $('#qOpts').innerHTML=opts.map(o=>`<button class="q-opt" data-h="${o.hz}">${o.hz}<small>${o.py}</small></button>`).join('');
  $('#qNext').hidden=true;updScore();}
$('#qOpts').addEventListener('click',e=>{const b=e.target.closest('.q-opt');if(!b||!$('#qNext').hidden)return;
  const ok=b.dataset.h===qCur.hz;
  document.querySelectorAll('.q-opt').forEach(x=>{if(x.dataset.h===qCur.hz)x.classList.add('ok');});
  if(ok){qScore++;qStreak++;speak(qCur.hz);}else{qStreak=0;b.classList.add('bad');}
  updScore();$('#qNext').hidden=false;});
$('#qNext').onclick=newQ;
function updScore(){$('#qScore').textContent='✅ '+qScore+' · 🔥 '+qStreak;}

/* тема */
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');save('hantheme',d?1:0);$('#themeBtn').textContent=d?'☀️':'🌙';drawLines();};
if(load('hantheme',0)){document.body.classList.add('dark');$('#themeBtn').textContent='☀️';}

window.addEventListener('resize',()=>{drawLines();if($('#writeModal').classList.contains('open'))padSize();});
buildOrder();updFav();render();setTimeout(drawLines,300);
</script>
</body>
</html>
