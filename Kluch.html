<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Собери иероглиф · Ключи</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI','Noto Sans CJK','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:radial-gradient(circle at 30% 10%,#4a6ef5,#1e2a6e 45%,#0d1330 100%);color:#fff;display:flex;justify-content:center;padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.game{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;gap:6px;min-height:0}

/* Задание */
.task-card{width:100%;background:linear-gradient(160deg,#fff,#d9e8ff);border-radius:18px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 #0c142b,0 8px 20px rgba(0,0,0,.55);border:3px solid #ffd966;flex:0 0 auto;position:relative;cursor:pointer}
.task-pinyin{font-size:clamp(30px,9vh,64px);line-height:1;font-weight:900;color:#0b1530;text-shadow:0 4px 0 #b3c7ff;letter-spacing:1px}
.task-translation{background:#0b1530;color:#ffe680;font-size:clamp(13px,3vh,20px);font-weight:800;padding:2px 20px;border-radius:60px;box-shadow:0 3px 0 #00000088;margin-top:2px;white-space:nowrap}
.task-speaker{position:absolute;top:8px;right:12px;font-size:20px;opacity:.6}

/* Счёт */
.score-bar{width:100%;background:rgba(255,255,255,.12);border-radius:12px;padding:2px 14px;border:2px solid #7ee081;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 0 #0c142b;flex:0 0 auto}
.score-label{font-size:10px;color:#7ee081;letter-spacing:1px;font-weight:800}
.score-value{font-size:20px;line-height:1.1;font-weight:800;text-shadow:0 2px 0 #1f5f2a}

/* Зона сборки */
.build-area{width:100%;background:rgba(0,0,0,.28);border-radius:20px;padding:6px;display:flex;align-items:center;justify-content:center;gap:4px;border:2px solid rgba(255,255,255,.18);box-shadow:inset 0 4px 12px rgba(0,0,0,.45),0 4px 0 #0c142b;flex:0 0 auto}
.base-slot,.key-slot{flex:1 1 0;max-width:100px;aspect-ratio:1/1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;container-type:size}
.base-slot{background:linear-gradient(160deg,#fff,#d9e8ff);border:3px solid #ffd966;box-shadow:0 4px 0 #0c142b,0 0 16px #ffd96666}
.base-char{font-size:75cqmin;line-height:1;color:#0b1530;font-weight:600;text-shadow:0 2px 0 #b3c7ff}
.base-label,.slot-label{font-size:8px;font-weight:800;text-transform:uppercase;margin-top:2px}
.base-label{color:#2b4a8a}
.slot-label{color:#ffe680}
.plus-sign{font-size:clamp(20px,4vh,28px);color:#ffd966;font-weight:700}
.key-slot{background:rgba(255,255,255,.1);border:3px dashed rgba(255,255,255,.4);transition:all .15s}
.key-slot.filled{background:linear-gradient(160deg,#fff,#d9e8ff);border:3px solid #ffb347;box-shadow:0 4px 0 #0c142b,0 0 20px #ffb347}
.key-slot .slot-char{font-size:70cqmin;color:rgba(255,255,255,.3);font-weight:600;line-height:1}
.key-slot.filled .slot-char{color:#0b1530;text-shadow:0 2px 0 #b3c7ff}

.result-slot{flex:1.15 1 0;max-width:115px;aspect-ratio:1/1;border-radius:18px;background:linear-gradient(160deg,#1a2a4a,#0d1330);border:3px solid #4a6ef5;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #0c142b,inset 0 0 16px #4a6ef544;transition:all .2s;container-type:size}
.result-slot.correct{border-color:#4caf50;box-shadow:0 4px 0 #0c142b,0 0 28px #4caf50;background:linear-gradient(160deg,#1f5f2a,#0d3314)}
.result-slot.wrong{border-color:#f44336;box-shadow:0 4px 0 #0c142b,0 0 28px #f44336;background:linear-gradient(160deg,#6b0f1a,#330d12);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.result-char{font-size:80cqmin;font-weight:700;color:#fff;text-shadow:0 3px 0 #4a6ef5;line-height:1}
.result-slot.correct .result-char{text-shadow:0 3px 0 #4caf50}
.result-slot.wrong .result-char{text-shadow:0 3px 0 #f44336}
.result-label{font-size:8px;color:#aac7ff;font-weight:800;margin-top:1px;text-transform:uppercase}

/* Сообщение */
.message{width:100%;min-height:28px;background:rgba(255,255,255,.14);border-radius:40px;padding:4px 12px;font-size:clamp(11px,2.5vh,14px);font-weight:700;color:#fff8d6;text-align:center;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 5px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);flex:0 0 auto}

/* Сетка ключей */
.keys-wrap{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.keys-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;max-height:400px;margin:auto}

/* Карточки ключей */
.key-btn{background:linear-gradient(145deg,#fff,#e2ecff);border-radius:16px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 #0a1122,0 8px 16px rgba(0,0,0,.45);border:3px solid #ffb347;transition:transform .06s,box-shadow .1s,border-color .12s,background .12s;user-select:none;position:relative;container-type:size}
.key-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0a1122,0 4px 8px rgba(0,0,0,.4)}
.key-btn.selected{border-color:#4a6ef5;box-shadow:0 5px 0 #0a1122,0 0 20px #4a6ef5;background:linear-gradient(145deg,#d9e8ff,#b8d0ff)}
.key-btn.correct{border-color:#4caf50;background:linear-gradient(145deg,#d4ffd4,#a8e6a8);box-shadow:0 5px 0 #1f5f2a,0 0 24px #4caf50}
.key-btn.wrong{border-color:#f44336;background:linear-gradient(145deg,#ffd4d4,#ffaaaa);box-shadow:0 5px 0 #6b0f1a,0 0 24px #f44336}
.key-btn.disabled{opacity:.35;pointer-events:none}

/* Размеры шрифтов привязаны к размеру самой карточки (cqi = container inline size) */
.key-symbol{font-size:60cqi;line-height:1;color:#101c3a;font-weight:600;text-shadow:0 2px 0 #b3c7ff;margin-top:5cqi}
.key-pinyin{font-size:14cqi;color:#1e40af;font-weight:800;font-style:italic;line-height:1.1;margin-top:2cqi}
.key-desc{font-size:12cqi;font-weight:700;color:#2b4a8a;background:#ffecb3;padding:0 6cqi;border-radius:30px;margin-top:2cqi;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

/* Кнопки */
.actions{width:100%;display:flex;gap:8px;flex:0 0 auto}
.btn{border:none;color:#fff;font-weight:800;padding:10px 4px;border-radius:40px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:transform .06s,box-shadow .1s;font-size:clamp(13px,2.8vh,16px);display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(4px)}
.check-btn{flex:1;background:linear-gradient(180deg,#4caf50,#2e7d32);box-shadow:0 5px 0 #1f5f2a,0 8px 18px rgba(0,0,0,.4);text-shadow:0 2px 0 #1f5f2a}
.check-btn:active{box-shadow:0 1px 0 #1f5f2a,0 4px 10px rgba(0,0,0,.4)}
.check-btn:disabled{opacity:.5;pointer-events:none;box-shadow:0 3px 0 #1f5f2a}
.reset-btn{flex:.4;background:linear-gradient(180deg,#ff7b54,#e63946);box-shadow:0 5px 0 #6b0f1a,0 8px 18px rgba(0,0,0,.4);text-shadow:0 2px 0 #6b0f1a;font-size:20px}
.reset-btn:active{box-shadow:0 1px 0 #6b0f1a,0 4px 10px rgba(0,0,0,.4)}

@media (max-height:600px){
  .score-bar{display:none}
  .keys-grid{max-height:300px}
}
</style>

    {char:'跳',pinyin:'tiào',translation:'прыгать',base:'足',key:'兆'},
    {char:'路',pinyin:'lù',translation:'дорога',base:'足',key:'各'},
    {char:'饭',pinyin:'fàn',translation:'еда',base:'饣',key:'反'},
    {char:'饮',pinyin:'yǐn',translation:'пить',base:'饣',key:'欠'},
    {char:'饱',pinyin:'bǎo',translation:'сытый',base:'饣',key:'包'},
    {char:'轮',pinyin:'lún',translation:'колесо',base:'车',key:'仑'},
    {char:'转',pinyin:'zhuǎn',translation:'поворот',base:'车',key:'专'},
    {char:'较',pinyin:'jiào',translation:'сравнивать',base:'车',key:'交'},
    {char:'骑',pinyin:'qí',translation:'ехать',base:'马',key:'奇'},
    {char:'驰',pinyin:'chí',translation:'мчаться',base:'马',key:'也'},
    {char:'收',pinyin:'shōu',translation:'собирать',base:'丩',key:'攵'},
    {char:'放',pinyin:'fàng',translation:'класть',base:'方',key:'攵'},
    {char:'政',pinyin:'zhèng',translation:'политика',base:'正',key:'攵'},
    {char:'族',pinyin:'zú',translation:'род',base:'方',key:'矢'},
    {char:'的',pinyin:'de',translation:'притяж.',base:'白',key:'勺'},
    {char:'百',pinyin:'bǎi',translation:'сто',base:'一',key:'白'},
    {char:'站',pinyin:'zhàn',translation:'стоять',base:'立',key:'占'},
    {char:'峰',pinyin:'fēng',translation:'пик',base:'山',key:'夆'},
    {char:'期',pinyin:'qī',translation:'период',base:'其',key:'月'},
    {char:'朗',pinyin:'lǎng',translation:'ясный',base:'良',key:'月'},
    {char:'看',pinyin:'kàn',translation:'смотреть',base:'手',key:'目'},
  ];

  var score=0;
  var currentGoal=null;
  var selectedKey=null;
  var roundActive=true;
  var cardsOnTable=[];
  var ALL_KEYS=Object.keys(KEY_DATA);

  var taskCardEl=document.getElementById('taskCard');
  var taskPinyinEl=document.getElementById('taskPinyin');
  var taskTranslationEl=document.getElementById('taskTranslation');
  var scoreValueEl=document.getElementById('scoreValue');
  var baseCharEl=document.getElementById('baseChar');
  var keySlotChar=document.getElementById('keySlotChar');
  var keySlot=document.getElementById('keySlot');
  var resultSlot=document.getElementById('resultSlot');
  var resultChar=document.getElementById('resultChar');
  var messageEl=document.getElementById('message');
  var keysGrid=document.getElementById('keysGrid');
  var checkBtn=document.getElementById('checkBtn');
  var resetBtn=document.getElementById('resetBtn');

  var zhVoice=null;
  function initVoices() {
    if(!('speechSynthesis' in window)) return;
    var voices=speechSynthesis.getVoices();
    zhVoice=voices.find(function(v){return v.lang==='zh-CN'||v.lang.startsWith('zh');})||null;
  }
  if('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged=initVoices;
    initVoices();
  }
  function speak(text) {
    if(!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang='zh-CN';u.rate=0.75;u.pitch=1;
      if(zhVoice) u.voice=zhVoice;
      speechSynthesis.speak(u);
    } catch(e){}
  }
  function playDing() {
    try {
      var ctx=new(window.AudioContext||window.webkitAudioContext)();
      var o=ctx.createOscillator();var g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.setValueAtTime(880,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1320,ctx.currentTime+0.15);
      g.gain.setValueAtTime(0.12,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
      o.start(ctx.currentTime);o.stop(ctx.currentTime+0.4);
    } catch(e){}
  }
  function playBuzz() {
    try {
      var ctx=new(window.AudioContext||window.webkitAudioContext)();
      var o=ctx.createOscillator();var g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sawtooth';
      o.frequency.setValueAtTime(180,ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(90,ctx.currentTime+0.3);
      g.gain.setValueAtTime(0.08,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
      o.start(ctx.currentTime);o.stop(ctx.currentTime+0.35);
    } catch(e){}
  }

  function shuffle(arr) {
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i];a[i]=a[j];a[j]=t;
    }
    return a;
  }
  function getPinyin(c){return KEY_DATA[c]?KEY_DATA[c][0]:'?';}
  function getDesc(c){return KEY_DATA[c]?KEY_DATA[c][1]:'?';}

  function generateRound() {
    var goal=HIEROGLYPHS[Math.floor(Math.random()*HIEROGLYPHS.length)];
    currentGoal=goal;
    var correctKey=goal.key;
    var wrongPool=ALL_KEYS.filter(function(k){return k!==correctKey&&k!==goal.base;});
    var selectedWrong=shuffle(wrongPool).slice(0,5);
    var cards=[correctKey].concat(selectedWrong);
    cardsOnTable=shuffle(cards);
    selectedKey=null;
    roundActive=true;
    taskPinyinEl.textContent=goal.pinyin;
    taskTranslationEl.textContent=goal.translation;
    baseCharEl.textContent=goal.base;
    updateSlot();
    updateResultSlot(null);
    updateMessage('Тапни 🔊. Выбери ключ к «'+goal.base+'»','neutral');
    updateScore();
    renderCards();
    updateCheckBtn();
  }

  function renderCards() {
    keysGrid.innerHTML='';
    cardsOnTable.forEach(function(keyChar){
      var btn=document.createElement('div');
      btn.className='key-btn';
      btn.dataset.key=keyChar;
      btn.innerHTML='<div class="key-symbol">'+keyChar+'</div>'+
        '<div class="key-pinyin">'+getPinyin(keyChar)+'</div>'+
        '<div class="key-desc">'+getDesc(keyChar)+'</div>';
      btn.addEventListener('click',function(){onCardClick(keyChar);});
      keysGrid.appendChild(btn);
    });
  }

  function onCardClick(keyChar) {
    if(!roundActive) {
      updateMessage('⏸ Раунд завершён. Нажми «⟲»','warning');
      return;
    }
    if(selectedKey===keyChar) {
      selectedKey=null;
      updateSlot();
      updateResultSlot(null);
      updateCardSelection();
      updateCheckBtn();
      updateMessage('Выбери ключ к «'+currentGoal.base+'»','neutral');
      return;
    }
    selectedKey=keyChar;
    updateSlot();
    updateResultSlot(null);
    updateCardSelection();
    updateCheckBtn();
    updateMessage('Нажми «ПРОВЕРИТЬ»','neutral');
  }

  function updateSlot() {
    if(selectedKey) {
      keySlotChar.textContent=selectedKey;
      keySlot.classList.add('filled');
    } else {
      keySlotChar.textContent='?';
      keySlot.classList.remove('filled');
    }
  }
  function updateResultSlot(result) {
    if(!result) {
      resultChar.textContent='?';
      resultSlot.classList.remove('correct','wrong');
      return;
    }
    resultChar.textContent=result.char;
    resultSlot.classList.remove('correct','wrong');
    resultSlot.classList.add(result.correct?'correct':'wrong');
  }
  function updateCardSelection() {
    keysGrid.querySelectorAll('.key-btn').forEach(function(btn){
      btn.classList.toggle('selected',btn.dataset.key===selectedKey);
    });
  }
  function updateMessage(text,type) {
    messageEl.textContent=text;
    if(type==='correct') messageEl.style.background='rgba(76, 175, 80, 0.45)';
    else if(type==='wrong') messageEl.style.background='rgba(244, 67, 54, 0.45)';
    else if(type==='warning') messageEl.style.background='rgba(255, 180, 50, 0.4)';
    else messageEl.style.background='rgba(255,255,255,0.14)';
  }
  function updateScore(){scoreValueEl.textContent=score;}
  function updateCheckBtn(){checkBtn.disabled=(selectedKey===null||!roundActive);}

  function checkAnswer() {
    if(!roundActive||selectedKey===null) return;
    var goal=currentGoal;
    var isCorrect=(selectedKey===goal.key);
    if(isCorrect) {
      roundActive=false;
      score+=100;
      updateScore();
      updateResultSlot({char:goal.char,correct:true});
      updateMessage('✅ '+goal.char+' ('+goal.pinyin+') — '+goal.translation+'! +100','correct');
      playDing();
      setTimeout(function(){speak(goal.char);},150);
      keysGrid.querySelectorAll('.key-btn').forEach(function(btn){
        if(btn.dataset.key===goal.key) btn.classList.add('correct');
        else btn.classList.add('disabled');
      });
      if(navigator.vibrate) navigator.vibrate(50);
      updateCheckBtn();
      setTimeout(function(){generateRound();},2000);
    } else {
      roundActive=false;
      updateResultSlot({char:'✗',correct:false});
      var formed=HIEROGLYPHS.find(function(h){return h.base===goal.base&&h.key===selectedKey;});
      if(formed) {
        updateMessage('❌ Получился «'+formed.char+'» ('+formed.pinyin+'). Нужен «'+goal.char+'» ('+goal.pinyin+', '+goal.translation+')','wrong');
      } else {
        updateMessage('❌ Не тот ключ. Нужен «'+goal.char+'» ('+goal.pinyin+', '+goal.translation+')','wrong');
      }
      playBuzz();
      keysGrid.querySelectorAll('.key-btn').forEach(function(btn){
        if(btn.dataset.key===goal.key) btn.classList.add('correct');
        else if(btn.dataset.key===selectedKey) btn.classList.add('wrong');
        else btn.classList.add('disabled');
      });
      if(navigator.vibrate) navigator.vibrate([60, 40, 60]);
      updateCheckBtn();
      setTimeout(function(){generateRound();},2600);
    }
  }

  function fullReset() {
    score=0;
    updateScore();
    generateRound();
    if(navigator.vibrate) navigator.vibrate(25);
  }

  function init() {
    checkBtn.addEventListener('click',checkAnswer);
    resetBtn.addEventListener('click',fullReset);
    taskCardEl.addEventListener('click',function(){
      if(currentGoal) {
        speak(currentGoal.char);
        playDing();
      }
    });
    generateRound();
  }
  init();
})();
</script>
</body>
</html>
