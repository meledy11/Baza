<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#eef1ff">
  <title>HanMap 600 — карты иероглифов с чертами</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg1: #eef1ff;
      --bg2: #fff3f3;
      --card: #ffffff;
      --ink: #20243a;
      --mut: #7a809c;
      --red: #e03131;
      --blue: #4263eb;
      --line: #8ea2ff;
      --sh: 0 12px 32px rgba(50, 60, 130, .14);
      --grad: linear-gradient(135deg, #ff6b6b, #e03131);
      --grad2: linear-gradient(135deg, #4263eb, #7048e8);
    }
    body.dark {
      --bg1: #0e1220;
      --bg2: #141a2e;
      --card: #1b2036;
      --ink: #eef1ff;
      --mut: #9aa3c7;
      --line: #5b74d8;
      --sh: 0 12px 32px rgba(0, 0, 0, .5);
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      opacity: .5;
    }
    body::before {
      width: 420px;
      height: 420px;
      background: #ffc9c9;
      top: -120px;
      right: -120px;
    }
    body::after {
      width: 380px;
      height: 380px;
      background: #bac8ff;
      bottom: -120px;
      left: -120px;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo small {
      font-size: 12px;
      color: var(--mut);
      font-weight: 600;
    }
    .stats {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .chip {
      background: var(--card);
      box-shadow: var(--sh);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--mut);
      white-space: nowrap;
    }
    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      border: none;
      background: var(--card);
      box-shadow: var(--sh);
      font-size: 18px;
      cursor: pointer;
      transition: .2s;
      color: var(--ink);
      flex-shrink: 0;
    }
    .icon-btn:hover {
      transform: translateY(-2px);
    }
    .icon-btn:active {
      transform: scale(.92);
    }
    .tagline {
      color: var(--mut);
      font-size: 13px;
      margin: -6px 0 14px 4px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .search {
      flex: 1;
      min-width: 180px;
      display: flex;
      align-items: center;
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--sh);
      padding: 0 14px;
    }
    .search input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      padding: 14px 8px;
      font-size: 15px;
      color: var(--ink);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: 18px;
      border: none;
      background: var(--card);
      box-shadow: var(--sh);
      font-weight: 700;
      font-size: 14px;
      color: var(--ink);
      cursor: pointer;
      transition: .2s;
      user-select: none;
      flex-shrink: 0;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:active {
      transform: scale(.94);
    }
    .btn.grad {
      background: var(--grad);
      color: #fff;
    }
    .btn.grad2 {
      background: var(--grad2);
      color: #fff;
    }
    .btn.active {
      outline: 3px solid var(--blue);
    }
    .navrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 6px 0 10px;
    }
    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--grad2);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      box-shadow: var(--sh);
      transition: .2s;
    }
    .nav-btn:active {
      transform: scale(.9);
    }
    #posLabel {
      font-weight: 700;
      color: var(--mut);
      font-size: 13px;
      min-width: 70px;
      text-align: center;
    }
    #map {
      position: relative;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 10px 4px;
      min-height: 200px;
    }
    #lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      width: 100%;
      height: 100%;
    }
    .ln {
      transition: stroke-dashoffset .7s ease;
    }
    .main-node {
      z-index: 1;
      background: var(--card);
      border-radius: 26px;
      box-shadow: var(--sh);
      padding: 22px 26px;
      text-align: center;
      cursor: pointer;
      flex: none;
      transition: .2s;
      min-width: 120px;
    }
    .main-node:active {
      transform: scale(.96);
    }
    .main-node .py {
      color: var(--blue);
      font-weight: 700;
      font-size: 18px;
    }
    .main-node .hz {
      color: var(--red);
      font-size: clamp(56px, 14vw, 96px);
      font-weight: 800;
      line-height: 1.15;
    }
    .main-node .ru {
      color: var(--mut);
      font-size: 14px;
      font-weight: 600;
    }
    #words {
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    .word {
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--sh);
      padding: 10px 14px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
      animation: pop .5s both;
    }
    .word:hover {
      transform: translateY(-2px);
    }
    .word:active {
      transform: scale(.96);
    }
    .word .py {
      color: var(--mut);
      font-size: 12px;
      font-weight: 600;
    }
    .word .hz {
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 800;
      letter-spacing: 2px;
    }
    .word .ru {
      color: var(--mut);
      font-size: 12px;
      font-weight: 600;
    }
    .c-red {
      color: var(--red);
    }
    .c-blue {
      color: var(--blue);
    }
    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.94);
      }
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 18px 0 8px;
    }
    footer {
      text-align: center;
      color: var(--mut);
      font-size: 12px;
      padding: 18px 0 8px;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 30, .45);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal.open {
      display: flex;
    }
    .modal-card {
      width: min(94vw, 430px);
      max-height: 88vh;
      overflow: auto;
      background: var(--card);
      border-radius: 26px;
      box-shadow: var(--sh);
      padding: 20px;
    }
    .modal-card.wide {
      width: min(94vw, 680px);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-head h3 {
      font-size: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
    }
    .tile {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 16px;
      box-shadow: var(--sh);
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: .15s;
      color: var(--ink);
      font-family: inherit;
      font-size: inherit;
    }
    .tile:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
    }
    .t-hz {
      font-size: 28px;
      font-weight: 800;
      color: var(--red);
    }
    .t-py {
      font-size: 11px;
      color: var(--mut);
      font-weight: 600;
    }
    .empty {
      color: var(--mut);
      text-align: center;
      padding: 30px;
      font-weight: 700;
    }
    .canvas-wrap {
      position: relative;
      width: min(78vw, 320px);
      margin: 0 auto;
      aspect-ratio: 1/1;
    }
    #guide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red);
      opacity: .16;
      font-weight: 800;
      pointer-events: none;
      user-select: none;
      font-size: 200px;
    }
    #guide.hidden {
      display: none;
    }
    #pad {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: crosshair;
      width: 100%;
      height: 100%;
    }
    .q-ru {
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      margin: 6px 0 16px;
    }
    .q-opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .q-opt {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 18px;
      box-shadow: var(--sh);
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      font-size: 28px;
      font-weight: 800;
      color: var(--ink);
      transition: .15s;
      font-family: inherit;
    }
    .q-opt small {
      font-size: 11px;
      color: var(--mut);
      font-weight: 600;
    }
    .q-opt.ok {
      border-color: #2f9e44;
      background: rgba(47, 158, 68, .15);
    }
    .q-opt.bad {
      border-color: var(--red);
      background: rgba(224, 49, 49, .12);
    }
    .q-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--bg1);
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 99;
      box-shadow: var(--sh);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%);
    }
    @media (max-width: 550px) {
      .wrap {
        padding: 10px;
      }
      .toolbar .btn {
        padding: 10px 14px;
        font-size: 12px;
      }
      .main-node {
        padding: 16px 18px;
        min-width: 80px;
      }
      .main-node .hz {
        font-size: 48px;
      }
      #map {
        gap: 12px;
      }
      .word {
        padding: 6px 10px;
      }
      .word .hz {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🀄 HanMap <small>600</small></div>
      <div class="stats"><span class="chip" id="statHz"></span><span class="chip" id="statWord"></span></div>
      <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
    </header>
    <div class="tagline">Учи иероглифы по картам‑связкам • HSK 1–4 • озвучка zh‑CN</div>

    <div class="toolbar">
      <div class="search"><span>🔍</span><input id="q" placeholder="Поиск: иероглиф, pinyin, перевод…"></div>
      <button class="btn grad" id="gridBtn">📚 База</button>
      <button class="btn" id="favBtn">❤️ <span id="favCount">0</span></button>
      <button class="btn grad2" id="randBtn">🎲</button>
    </div>

    <div class="navrow">
      <button class="nav-btn" id="prevBtn">←</button>
      <span id="posLabel"></span>
      <button class="nav-btn" id="nextBtn">→</button>
    </div>

    <section id="map">
      <svg id="lines"></svg>
      <div class="main-node" id="mainNode" title="Озвучить">
        <div class="py" id="mainPy"></div><div class="hz" id="mainHz"></div><div class="ru" id="mainRu"></div>
      </div>
      <div id="words"></div>
    </section>

    <div class="actions">
      <button class="btn" id="speakBtn">🔊 Озвучить</button>
      <button class="btn grad2" id="writeBtn">✍️ Пропись</button>
      <button class="btn" id="likeBtn">🤍 В избранное</button>
      <button class="btn grad" id="quizBtn">🧠 Тест</button>
    </div>
    <footer>HanMap • 600 иероглифов • стрелки ← → для навигации</footer>
  </div>

  <!-- База -->
  <div class="modal" id="gridModal"><div class="modal-card wide">
      <div class="modal-head"><h3>📚 База иероглифов (600)</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="grid" id="grid"></div>
    </div></div>

  <!-- Пропись -->
  <div class="modal" id="writeModal"><div class="modal-card">
      <div class="modal-head"><h3 id="writeTitle">✍️ Пропись</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="canvas-wrap" id="canvasWrap"><div id="guide"></div><canvas id="pad"></canvas></div>
      <div class="actions">
        <button class="btn" id="clearBtn">🧽 Очистить</button>
        <button class="btn grad2" id="guideBtn">👁 Образец</button>
      </div>
    </div></div>

  <!-- Тест -->
  <div class="modal" id="quizModal"><div class="modal-card">
      <div class="modal-head"><h3>🧠 Выбери иероглиф</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="q-ru" id="qRu"></div>
      <div class="q-opts" id="qOpts"></div>
      <div class="q-foot"><span class="chip" id="qScore"></span><button class="btn grad2" id="qNext" hidden>Дальше →</button></div>
    </div></div>

  <div id="toast"></div>

  <script src="app.js"></script>
  <script>
    // ============================================================
    //  LOGICA HanMap
    // ============================================================

    // Проверяем наличие базы
    if (typeof DB === 'undefined' || DB.length === 0) {
        console.error('❌ HanMap: app.js не загружен!');
        document.getElementById('statHz').textContent = '❌ Ошибка';
        document.getElementById('statWord').textContent = 'Загрузите app.js';
    } else {
        console.log('✅ HanMap: загружено ' + DB.length + ' иероглифов');
    }

    // ============================================================
    //  ПЕРЕМЕННЫЕ
    // ============================================================
    var favs = new Set();
    var order = [];
    var pos = 0;
    var dark = false;

    // Загружаем избранное
    try {
        var saved = JSON.parse(localStorage.getItem('hanmap_favs') || '[]');
        favs = new Set(saved);
    } catch (e) {
        favs = new Set();
    }

    // ============================================================
    //  ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================
    function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = arr[i];
            arr[i] = arr[j];
            arr[j] = temp;
        }
        return arr;
    }

    function buildOrder() {
        if (favs.size > 0) {
            order = [];
            for (var i = 0; i < DB.length; i++) {
                if (favs.has(DB[i][0])) {
                    order.push(i);
                }
            }
        } else {
            order = DB.map(function(_, i) { return i; });
        }
        if (pos >= order.length) pos = 0;
        updateFavCount();
    }

    function updateFavCount() {
        document.getElementById('favCount').textContent = favs.size;
        document.getElementById('favBtn').innerHTML = (favs.size > 0 ? '❤️' : '🤍') + ' <span id="favCount">' + favs.size + '</span>';
        // Пересоздаём span
        var fc = document.getElementById('favCount');
        if (fc) fc.textContent = favs.size;
    }

    // ============================================================
    //  ОТРИСОВКА
    // ============================================================
    function render() {
        if (!DB || DB.length === 0 || order.length === 0) {
            document.getElementById('mainHz').textContent = '⚠️';
            document.getElementById('mainPy').textContent = 'Нет данных';
            document.getElementById('mainRu').textContent = 'Загрузите app.js';
            return;
        }

        var idx = order[pos];
        var d = DB[idx];
        if (!d) return;

        document.getElementById('mainHz').textContent = d[0];
        document.getElementById('mainPy').textContent = d[1];
        document.getElementById('mainRu').textContent = d[2];

        var wordsHtml = '';
        var words = d[3] || [];
        for (var i = 0; i < words.length; i++) {
            var w = words[i];
            var chars = w[0].split('');
            var colored = chars.map(function(c) {
                return '<span class="' + (c === d[0] ? 'c-red' : 'c-blue') + '">' + c + '</span>';
            }).join('');
            wordsHtml += '<div class="word" data-i="' + i + '" style="animation-delay:' + (i * 70) + 'ms">' +
                '<div class="py">' + w[1] + '</div>' +
                '<div class="hz">' + colored + '</div>' +
                '<div class="ru">' + w[2] + '</div>' +
                '</div>';
        }
        document.getElementById('words').innerHTML = wordsHtml;

        document.getElementById('posLabel').textContent = (pos + 1) + ' / ' + order.length;
        document.getElementById('statHz').textContent = DB.length + ' иероглифов';
        document.getElementById('statWord').textContent = DB.reduce(function(sum, item) {
            return sum + (item[3] ? item[3].length : 0);
        }, 0) + ' слов';

        var likeBtn = document.getElementById('likeBtn');
        if (favs.has(d[0])) {
            likeBtn.innerHTML = '❤️ В избранном';
            likeBtn.style.color = '#e03131';
        } else {
            likeBtn.innerHTML = '🤍 В избранное';
            likeBtn.style.color = '';
        }

        drawLines();
    }

    // ============================================================
    //  ЛИНИИ (связи между словами)
    // ============================================================
    function drawLines() {
        var svg = document.getElementById('lines');
        var map = document.getElementById('map');
        var rect = map.getBoundingClientRect();
        var centerX = rect.width / 2;
        var centerY = rect.height / 2;

        var mainNode = document.querySelector('.main-node');
        var words = document.querySelectorAll('.word');
        if (!mainNode || words.length === 0) {
            svg.innerHTML = '';
            return;
        }

        var mainRect = mainNode.getBoundingClientRect();
        var mainCX = mainRect.left - rect.left + mainRect.width / 2;
        var mainCY = mainRect.top - rect.top + mainRect.height / 2;

        var lines = '';
        for (var i = 0; i < words.length; i++) {
            var w = words[i];
            var wRect = w.getBoundingClientRect();
            var wCX = wRect.left - rect.left + wRect.width / 2;
            var wCY = wRect.top - rect.top + wRect.height / 2;

            lines += '<line x1="' + mainCX + '" y1="' + mainCY + 
                     '" x2="' + wCX + '" y2="' + wCY + 
                     '" stroke="var(--line)" stroke-width="2" opacity="0.3" class="ln" ' +
                     'stroke-dasharray="' + getDistance(mainCX, mainCY, wCX, wCY) + '" ' +
                     'stroke-dashoffset="0"/>';
        }

        svg.innerHTML = lines;
    }

    function getDistance(x1, y1, x2, y2) {
        return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
    }

    // ============================================================
    //  НАВИГАЦИЯ
    // ============================================================
    function go(delta) {
        if (order.length === 0) return;
        pos = (pos + delta + order.length) % order.length;
        render();
        if (typeof speak === 'function') speak();
    }

    function goTo(idx) {
        pos = order.indexOf(idx);
        if (pos === -1) pos = 0;
        render();
        if (typeof speak === 'function') speak();
    }

    // ============================================================
    //  ПОИСК
    // ============================================================
    function search(query) {
        if (!query || query.trim() === '') {
            buildOrder();
            render();
            return;
        }
        query = query.toLowerCase().trim();
        var results = [];
        for (var i = 0; i < DB.length; i++) {
            var d = DB[i];
            var match = d[0].includes(query) ||
                       d[1].toLowerCase().includes(query) ||
                       d[2].toLowerCase().includes(query);
            if (!match && d[3]) {
                for (var j = 0; j < d[3].length; j++) {
                    var w = d[3][j];
                    if (w[0].includes(query) || 
                        w[1].toLowerCase().includes(query) || 
                        w[2].toLowerCase().includes(query)) {
                        match = true;
                        break;
                    }
                }
            }
            if (match) results.push(i);
        }
        order = results;
        pos = 0;
        render();
    }

    // ============================================================
    //  ТЕМА
    // ============================================================
    function toggleTheme() {
        dark = !dark;
        document.body.classList.toggle('dark', dark);
        document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
        localStorage.setItem('hanmap_theme', dark ? 'dark' : 'light');
        setTimeout(drawLines, 300);
    }

    // ============================================================
    //  ОЗВУЧКА
    // ============================================================
    function speak() {
        var hz = document.getElementById('mainHz').textContent;
        if (!hz || hz === '⚠️') return;
        if (typeof speechSynthesis !== 'undefined') {
            var utter = new SpeechSynthesisUtterance(hz);
            utter.lang = 'zh-CN';
            utter.rate = 0.8;
            speechSynthesis.speak(utter);
        }
    }

    // ============================================================
    //  ИЗБРАННОЕ
    // ============================================================
    function toggleFavorite() {
        if (order.length === 0) return;
        var idx = order[pos];
        var d = DB[idx];
        var char = d[0];
        if (favs.has(char)) {
            favs.delete(char);
            showToast('❌ Удалено из избранного: ' + char);
        } else {
            favs.add(char);
            showToast('❤️ Добавлено в избранное: ' + char);
        }
        localStorage.setItem('hanmap_favs', JSON.stringify(Array.from(favs)));
        buildOrder();
        updateFavCount();
        render();
    }

    // ============================================================
    //  ТОСТ
    // ============================================================
    function showToast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(function() {
            el.classList.remove('show');
        }, 2000);
    }

    // ============================================================
    //  БАЗА (сетка)
    // ============================================================
    function showGrid() {
        var grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (var i = 0; i < DB.length; i++) {
            var d = DB[i];
            var tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = '<div class="t-hz">' + d[0] + '</div>' +
                            '<div class="t-py">' + d[1] + '</div>' +
                            '<div style="font-size:10px;color:var(--mut)">' + d[2] + '</div>';
            tile.onclick = (function(idx) {
                return function() {
                    document.getElementById('gridModal').classList.remove('open');
                    goTo(idx);
                };
            })(i);
            grid.appendChild(tile);
        }
        document.getElementById('gridModal').classList.add('open');
    }

    // ============================================================
    //  ПРОПИСЬ
    // ============================================================
    var canvas, ctx, drawing = false, lastX, lastY;

    function initWrite() {
        canvas = document.getElementById('pad');
        ctx = canvas.getContext('2d');
        var wrap = document.getElementById('canvasWrap');
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;

        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'var(--red)';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        var guide = document.getElementById('guide');
        var hz = document.getElementById('mainHz').textContent;
        guide.textContent = hz;
        guide.className = '';

        // События
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);

        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            var t = e.touches[0];
            var rect = canvas.getBoundingClientRect();
            startDraw({ clientX: t.clientX, clientY: t.clientY });
        });
        canvas.addEventListener('touchmove', function(e) {
            e.preventDefault();
            var t = e.touches[0];
            draw({ clientX: t.clientX, clientY: t.clientY });
        });
        canvas.addEventListener('touchend', function(e) {
            e.preventDefault();
            endDraw();
        });

        document.getElementById('writeModal').classList.add('open');
        document.getElementById('writeTitle').textContent = '✍️ Пропись: ' + hz;
    }

    function startDraw(e) {
        drawing = true;
        var rect = canvas.getBoundingClientRect();
        lastX = (e.clientX - rect.left) * (canvas.width / rect.width);
        lastY = (e.clientY - rect.top) * (canvas.height / rect.height);
    }

    function draw(e) {
        if (!drawing) return;
        var rect = canvas.getBoundingClientRect();
        var x = (e.clientX - rect.left) * (canvas.width / rect.width);
        var y = (e.clientY - rect.top) * (canvas.height / rect.height);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        lastX = x;
        lastY = y;
    }

    function endDraw() {
        drawing = false;
    }

    function clearWrite() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function toggleGuide() {
        var guide = document.getElementById('guide');
        guide.classList.toggle('hidden');
    }

    // ============================================================
    //  ТЕСТ
    // ============================================================
    var quizData = [];
    var quizIdx = 0;
    var quizScore = 0;

    function startQuiz() {
        var shuffled = DB.slice();
        shuffle(shuffled);
        quizData = shuffled.slice(0, 10);
        quizIdx = 0;
        quizScore = 0;
        document.getElementById('qScore').textContent = '0 / ' + quizData.length;
        document.getElementById('qNext').hidden = true;
        document.getElementById('quizModal').classList.add('open');
        showQuizQuestion();
    }

    function showQuizQuestion() {
        if (quizIdx >= quizData.length) {
            document.getElementById('qRu').textContent = '🎉 Тест завершён!';
            document.getElementById('qOpts').innerHTML = '';
            document.getElementById('qScore').textContent = quizScore + ' / ' + quizData.length;
            document.getElementById('qNext').hidden = false;
            document.getElementById('qNext').textContent = '🔄 Заново';
            return;
        }

        var d = quizData[quizIdx];
        document.getElementById('qRu').textContent = d[2]; // перевод

        // Выбираем 4 варианта
        var opts = [d];
        var others = DB.filter(function(item) { return item[0] !== d[0]; });
        shuffle(others);
        for (var i = 0; i < 3 && i < others.length; i++) {
            opts.push(others[i]);
        }
        shuffle(opts);

        var container = document.getElementById('qOpts');
        container.innerHTML = '';
        for (var i = 0; i < opts.length; i++) {
            var btn = document.createElement('button');
            btn.className = 'q-opt';
            btn.innerHTML = opts[i][0] + '<small>' + opts[i][1] + '</small>';
            btn.onclick = (function(item) {
                return function() {
                    checkQuizAnswer(item);
                };
            })(opts[i]);
            container.appendChild(btn);
        }
        document.getElementById('qScore').textContent = quizScore + ' / ' + quizData.length;
    }

    function checkQuizAnswer(selected) {
        var correct = quizData[quizIdx];
        var btns = document.querySelectorAll('.q-opt');
        for (var i = 0; i < btns.length; i++) {
            btns[i].disabled = true;
            var isCorrect = btns[i].innerHTML.includes(correct[0]);
            if (isCorrect) btns[i].classList.add('ok');
            if (btns[i] === selected && !isCorrect) {
                btns[i].classList.add('bad');
            }
        }
        if (selected[0] === correct[0]) {
            quizScore++;
            showToast('✅ Правильно!');
        } else {
            showToast('❌ Правильно: ' + correct[0] + ' (' + correct[1] + ')');
        }
        document.getElementById('qScore').textContent = quizScore + ' / ' + quizData.length;
        document.getElementById('qNext').hidden = false;
        document.getElementById('qNext').textContent = quizIdx < quizData.length - 1 ? 'Дальше →' : '📊 Результат';
    }

    function nextQuestion() {
        quizIdx++;
        document.getElementById('qNext').hidden = true;
        if (quizIdx >= quizData.length) {
            showQuizQuestion();
        } else {
            showQuizQuestion();
        }
    }

    // ============================================================
    //  ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    function init() {
        // Тема
        var savedTheme = localStorage.getItem('hanmap_theme');
        if (savedTheme === 'dark') {
            dark = true;
            document.body.classList.add('dark');
            document.getElementById('themeBtn').textContent = '☀️';
        }

        // Статистика
        buildOrder();
        render();

        // События
        document.getElementById('prevBtn').addEventListener('click', function() { go(-1); });
        document.getElementById('nextBtn').addEventListener('click', function() { go(1); });
        document.getElementById('mainNode').addEventListener('click', speak);
        document.getElementById('speakBtn').addEventListener('click', speak);
        document.getElementById('likeBtn').addEventListener('click', toggleFavorite);
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);
        document.getElementById('randBtn').addEventListener('click', function() {
            shuffle(order);
            pos = 0;
            render();
            showToast('🎲 Перемешано!');
        });
        document.getElementById('gridBtn').addEventListener('click', showGrid);
        document.getElementById('writeBtn').addEventListener('click', initWrite);
        document.getElementById('clearBtn').addEventListener('click', clearWrite);
        document.getElementById('guideBtn').addEventListener('click', toggleGuide);
        document.getElementById('quizBtn').addEventListener('click', startQuiz);
        document.getElementById('qNext').addEventListener('click', nextQuestion);

        // Поиск
        var searchInput = document.getElementById('q');
        var searchTimeout;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function() {
                search(searchInput.value);
            }, 300);
        });

        // Закрытие модалок
        document.querySelectorAll('[data-close]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                this.closest('.modal').classList.remove('open');
            });
        });

        // Обработка resize для линий
        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(drawLines, 300);
        });

        // Клавиши
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') go(-1);
            if (e.key === 'ArrowRight') go(1);
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.open').forEach(function(m) {
                    m.classList.remove('open');
                });
            }
        });

        console.log('✅ HanMap загружен!');
    }

    // Запуск
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
  </script>
</body>
</html>
