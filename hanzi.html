<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title> Ханзи: Нефрит и Золото</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0f;color:#fff;touch-action:none;}
body{display:flex;flex-direction:column;align-items:center;}

.bg{position:fixed;inset:0;z-index:0;transition:background 1.5s ease;}

.hdr{z-index:10;width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;}
.logo{font-size:1rem;font-weight:800;color:#d4af37;text-shadow:0 2px 4px rgba(0,0,0,.5);letter-spacing:1px;}
.rank{font-size:.55rem;color:#a89f91;letter-spacing:2px;text-transform:uppercase;margin-top:1px;font-weight:600;}
.stats{display:flex;gap:4px;flex-wrap:wrap;}
.stat{background:rgba(20,20,25,.6);border:1px solid rgba(212,175,55,.3);border-radius:5px;padding:3px 8px;font-size:.6rem;display:flex;align-items:center;gap:3px;backdrop-filter:blur(4px);}
.stat b{font-size:.75rem;color:#e8dcc5;}
.c-gold{color:#d4af37!important;} .c-grn{color:#5da399!important;} .c-cyan{color:#7fb5b0!important;} .c-pur{color:#9b72aa!important;}

.pw{z-index:10;width:100%;max-width:600px;padding:0 12px 4px;}
.pt{height:4px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.05);}
.pf{height:100%;background:linear-gradient(90deg,#8b3a3a,#d4af37);transition:width .5s ease-out;box-shadow:0 0 10px rgba(212,175,55,.3);}
.pl{display:flex;justify-content:space-between;font-size:.55rem;color:#8c8276;margin-top:2px;font-weight:600;}

.ba{z-index:5;flex:1;width:100%;max-width:600px;display:flex;align-items:center;justify-content:center;padding:2px;}
#board{
    display:grid;
    background:rgba(10,10,15,.4);
    border-radius:10px;
    padding:6px;
    border:1px solid rgba(212,175,55,.15);
    box-shadow:0 15px 40px rgba(0,0,0,.6), inset 0 0 30px rgba(0,0,0,.4);
}

.c{
    position:relative;
    border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.15);
    box-shadow: inset 1px 1px 2px rgba(255,255,255,.2), inset -1px -1px 2px rgba(0,0,0,.4), 2px 3px 6px rgba(0,0,0,.5);
    transition: transform 0.25s cubic-bezier(.4,1.8,.6,1);
    overflow:hidden;
}
.c::after{
    content:'';position:absolute;top:0;left:0;right:0;height:40%;
    background:linear-gradient(to bottom, rgba(255,255,255,.15), transparent);
    border-radius:8px 8px 50% 50%;
    pointer-events:none;
}

/* ============================================================
   25 ДОРАМНЫХ ПАЛИТР (5 цветов × 5 наборов)
   ============================================================ */

/* Набор 1: Императорский */
.pal-0-0 { background: linear-gradient(145deg, #d9534f, #8b0000); }
.pal-0-1 { background: linear-gradient(145deg, #5cb85c, #2e8b57); }
.pal-0-2 { background: linear-gradient(145deg, #f0ad4e, #daa520); }
.pal-0-3 { background: linear-gradient(145deg, #5bc0de, #4682b4); }
.pal-0-4 { background: linear-gradient(145deg, #9370db, #663399); }

/* Набор 2: Династия Тан */
.pal-1-0 { background: linear-gradient(145deg, #cd5c5c, #a0522d); }
.pal-1-1 { background: linear-gradient(145deg, #40e0d0, #20b2aa); }
.pal-1-2 { background: linear-gradient(145deg, #c0c0c0, #808080); }
.pal-1-3 { background: linear-gradient(145deg, #483d8b, #191970); }
.pal-1-4 { background: linear-gradient(145deg, #cc7722, #8b4513); }

/* Набор 3: Небесный дворец */
.pal-2-0 { background: linear-gradient(145deg, #ffb7b2, #ff6961); }
.pal-2-1 { background: linear-gradient(145deg, #0bda51, #006400); }
.pal-2-2 { background: linear-gradient(145deg, #f5f5dc, #d4c5a9); }
.pal-2-3 { background: linear-gradient(145deg, #0f52ba, #000080); }
.pal-2-4 { background: linear-gradient(145deg, #ff7f50, #ff4500); }

/* Набор 4: Шёлковый путь */
.pal-3-0 { background: linear-gradient(145deg, #e74c3c, #922b21); }
.pal-3-1 { background: linear-gradient(145deg, #1abc9c, #148f77); }
.pal-3-2 { background: linear-gradient(145deg, #f39c12, #b9770e); }
.pal-3-3 { background: linear-gradient(145deg, #3498db, #21618c); }
.pal-3-4 { background: linear-gradient(145deg, #9b59b6, #6c3483); }

/* Набор 5: Лунный свет */
.pal-4-0 { background: linear-gradient(145deg, #ff6b9d, #c44569); }
.pal-4-1 { background: linear-gradient(145deg, #2ecc71, #1e8449); }
.pal-4-2 { background: linear-gradient(145deg, #f1c40f, #b7950b); }
.pal-4-3 { background: linear-gradient(145deg, #5dade2, #2874a6); }
.pal-4-4 { background: linear-gradient(145deg, #af7ac5, #7d3c98); }

/* Эффекты бонусов */
.sp-bomb {
    border: 3px solid #ff4444 !important;
    box-shadow: 0 0 20px rgba(255, 68, 68, 0.6), inset 0 0 15px rgba(255, 0, 0, 0.3) !important;
    animation: bombPulse 1.5s infinite;
}
.sp-bomb::before {
    content: '💥';
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 1.2rem;
    z-index: 5;
    filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.8));
}

.sp-laser {
    border: 3px solid #00ff88 !important;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.6), inset 0 0 15px rgba(0, 255, 136, 0.3) !important;
    animation: laserPulse 1.5s infinite;
}
.sp-laser::before {
    content: '⚡';
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 1.2rem;
    z-index: 5;
    filter: drop-shadow(0 0 5px rgba(0, 255, 136, 0.8));
}

.sp-star {
    border: 3px solid #ffd700 !important;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.3) !important;
    animation: starPulse 1.5s infinite;
}
.sp-star::before {
    content: '⭐';
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 1.2rem;
    z-index: 5;
    filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.8));
}

.sp-rainbow {
    background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000) !important;
    border: 3px solid #fff !important;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.4) !important;
    animation: rainbowSpin 2s linear infinite;
}
.sp-rainbow::before {
    content: '🌈';
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 1.2rem;
    z-index: 5;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8));
}

@keyframes bombPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 68, 68, 0.6), inset 0 0 15px rgba(255, 0, 0, 0.3); }
    50% { box-shadow: 0 0 30px rgba(255, 68, 68, 0.9), inset 0 0 20px rgba(255, 0, 0, 0.5); }
}

@keyframes laserPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.6), inset 0 0 15px rgba(0, 255, 136, 0.3); }
    50% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.9), inset 0 0 20px rgba(0, 255, 136, 0.5); }
}

@keyframes starPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(255, 215, 0, 0.3); }
    50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.9), inset 0 0 20px rgba(255, 215, 0, 0.5); }
}

@keyframes rainbowSpin {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}

.c .hz{font-size:1.4rem;font-weight:900;color:#f0e6d2;text-shadow:0 2px 4px rgba(0,0,0,.6),0 0 10px rgba(212,175,55,.1);z-index:2;line-height:1;}
.c .py{font-size:.45rem;color:rgba(240,230,210,.8);z-index:2;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4);margin-top:1px;}
.c .ru{
    font-size:.45rem;
    font-weight:700;
    color:#f0e6d2;
    background:rgba(0,0,0,.35);
    padding:1px 4px;

    margin-top:1px;
    z-index:3;

    text-align:center;
    word-wrap:break-word;
    overflow-wrap:break-word;
    white-space:normal;

    border:1px solid rgba(212,175,55,.1);
}
.c .emo{position:absolute;bottom:1px;left:2px;font-size:.45rem;opacity:.4;z-index:1;filter:sepia(0.3);}
.c .badge{position:absolute;top:1px;right:2px;font-size:.6rem;z-index:4;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}

.c.sel{transform:scale(1.08);z-index:10;box-shadow:0 0 0 2px #d4af37,0 10px 25px rgba(0,0,0,.5);}
.c.gone{animation:pop 0.3s forwards;}
@keyframes pop{to{transform:scale(0);opacity:0;}}
.c.drop{animation:drop 0.5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes drop{from{transform:translateY(-60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.c.best{animation:pulse 1.5s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.3);}70%{box-shadow:0 0 0 8px rgba(212,175,55,0);}100%{box-shadow:0 0 0 0 rgba(212,175,55,0);}}
.c.shape-hl{animation:shapeFlash .6s ease-out forwards;border:2px solid #fff!important;}
@keyframes shapeFlash{0%{box-shadow:0 0 0 0 rgba(255,255,255,0);transform:scale(1);}50%{box-shadow:0 0 40px 10px rgba(255,255,255,0.6);transform:scale(1.12);filter:brightness(1.5);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);transform:scale(1);}}

.bar{z-index:10;width:100%;max-width:600px;display:flex;gap:4px;justify-content:center;padding:4px 8px;flex-wrap:wrap;}
.btn{padding:6px 10px;border:none;border-radius:6px;font-weight:700;font-size:.6rem;cursor:pointer;color:#e8dcc5;background:rgba(20,20,25,.6);border:1px solid rgba(212,175,55,.2);display:flex;align-items:center;gap:3px;transition:.2s;backdrop-filter:blur(4px);}
.btn:active{transform:scale(.95);}
.btn.buy{border-color:rgba(212,175,55,.6);color:#d4af37;box-shadow:0 0 10px rgba(212,175,55,.1);}
.btn small{font-size:.5rem;opacity:.7;}
.btn.restart{background:rgba(212,175,55,.15);border-color:rgba(212,175,55,.4);color:#d4af37;}

.overlay{position:fixed;inset:0;background:rgba(5,5,10,.95);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.overlay.show{display:flex;}
.modal{background:linear-gradient(135deg,#1a1520,#0f0a15);border:1px solid rgba(212,175,55,.3);border-radius:16px;padding:30px;max-width:340px;width:90%;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.7);}
.modal h2{color:#d4af37;margin-bottom:10px;font-size:1.4rem;letter-spacing:1px;}
.modal p{font-size:.9rem;color:#a89f91;margin-bottom:20px;line-height:1.6;}
.modal button{background:linear-gradient(135deg,#8b3a3a,#5a2020);border:1px solid rgba(212,175,55,.4);padding:12px 30px;border-radius:8px;font-weight:bold;color:#f0e6d2;cursor:pointer;font-size:1rem;letter-spacing:1px;transition:.2s;}
.modal button:hover{box-shadow:0 0 15px rgba(139,58,58,.4);}

.fpts{position:absolute;pointer-events:none;z-index:50;font-weight:bold;color:#d4af37;text-shadow:0 2px 4px rgba(0,0,0,.6);animation:floatUp 1s forwards;}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-40px) scale(1.2);opacity:0;}}

.particle{position:fixed;pointer-events:none;z-index:1000;font-size:1.5rem;will-change:transform,opacity;animation:fly 1.2s ease-out forwards;}
@keyframes fly{0%{transform:translate(0,0) scale(0.5) rotate(0deg);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(1.5) rotate(var(--rot));opacity:0;}}

.shake{animation:shake 0.4s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes shake{10%,90%{transform:translate3d(-1px,0,0);}20%,80%{transform:translate3d(2px,0,0);}30%,50%,70%{transform:translate3d(-4px,0,0);}40%,60%{transform:translate3d(4px,0,0);}}

.jade-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
    gap: 12px;
    margin-bottom: 25px;
    justify-content: center;
}
.jade-card {
    border: 2px solid rgba(212,175,55,.5);
    border-radius: 12px;
    padding: 15px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(30px) scale(0.8);
    animation: jadePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s;
    min-height: 110px;
}
.jade-card:active { transform: scale(0.95); }
.jade-card::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    pointer-events: none;
}
.jade-card .jade-char { 
    font-size: 3.2rem;
    font-weight: 900; 
    color: #fff; 
    text-shadow: 0 4px 8px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.2); 
    margin-bottom: 5px; 
    z-index: 2;
    line-height: 1;
}
.jade-card .jade-py { 
    font-size: 1rem; 
    color: rgba(255,255,255,0.9); 
    font-weight: 700; 
    margin-bottom: 4px; 
    letter-spacing: 1px;
    z-index: 2;
}
.jade-card .jade-ru { 
    font-size: 0.85rem; 
    color: #ffd700; 
    font-weight: bold; 
    text-transform: uppercase; 
    letter-spacing: 0.5px; 
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    z-index: 2;
    text-align: center;
    white-space: normal;
    word-wrap: break-word;
    line-height: 1.2;
    max-width: 100%;
}
.jade-card .jade-emo { 
    font-size: 1.5rem; 
    position: absolute; 
    bottom: 5px; 
    right: 8px; 
    opacity: 0.6; 
    filter: grayscale(0.3);
    z-index: 1;
}

@keyframes jadePop {
    to { opacity: 1; transform: translateY(0) scale(1); }
}
</style>
</head>

<script>
// ============================================================
//  ЗВУКОВОЙ ДВИЖОК
// ============================================================
var audioCtx = null;
function initAudio() {
    if(!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playChime(pitchIndex) {
    if(!audioCtx) return;
    var now = audioCtx.currentTime;
    var scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    var freq = scale[pitchIndex % scale.length];
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.12, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
    osc.start(now);
    osc.stop(now + 2.0);
}

function playSound(type, comboCount) {
    if(!audioCtx) return;
    if(type === 'swap') { playChime(0); }
    else if(type === 'match') {
        var base = Math.min(comboCount, 4);
        playChime(base);
        setTimeout(() => playChime(base + 2), 120);
    } else if(type === 'bad') {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    } else if(type === 'bonus') {
        [0, 2, 4, 5].forEach((n, i) => setTimeout(() => playChime(n), i * 100));
    } else if(type === 'win') {
        [0, 2, 4, 5, 4, 2, 5].forEach((n, i) => setTimeout(() => playChime(n), i * 140));
    }
}

function speakChinese(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        utterance.pitch = 1.1;
        var voices = window.speechSynthesis.getVoices();
        var zhVoice = voices.find(v => v.lang.includes('zh'));
        if (zhVoice) utterance.voice = zhVoice;
        window.speechSynthesis.speak(utterance);
    }
}
if ('speechSynthesis' in window) window.speechSynthesis.getVoices();

// ============================================================
//  КОНФИГУРАЦИЯ И ДАННЫЕ
// ============================================================
var RANKS = ["Новичок","Ученик","Мастер","Эксперт","Гуру","Магистр","Мудрец","Император"];
var NC=6, NR=8, TOT=NC*NR;

// База данных иероглифов (пример для демонстрации)
var DB = [
    ["人","rén","человек",""],["大","dà","большой","📏"],["小","xiǎo","маленький","🔬"],
    ["好","hǎo","хороший","👍"],["水","shu","вода","💧"],["火","hu","огонь","🔥"],
    ["山","shān","гора","️"],["月","yuè","луна",""],["日","rì","солнце",""],
    ["花","huā","цветок","🌸"],["鱼","yú","рыба","🐟"],["鸟","niǎo","птица","🐦"],
    ["马","mǎ","лошадь",""],["龙","lóng","дракон",""],["风","fēng","ветер","🌬️"],
    ["雨","y","дождь","🌧️"],["雪","xuě","снег","️"],["星","xīng","звезда","⭐"],
    ["心","xīn","сердце","💖"],["手","shǒu","рука","✋"],["车","chē","транспорт","🚗"],

var currentPalette = 0;
var currentLevelColors = [];

function getPaletteForLevel(level, circle) {
    // 25 палитр, меняются каждые 5 уровней
    // Формула: (level - 1 + (circle - 1) * 5) % 25
    var paletteIdx = ((level - 1) + (circle - 1) * 5) % 25;
    return Math.floor(paletteIdx / 5); // 0-4 базовых набора
}

function getColorForChar(charIndex, level, circle) {
    var paletteIdx = getPaletteForLevel(level, circle);
    var colorIdx = charIndex % 5; // 0-4 цвета в палитре
    return 'pal-' + paletteIdx + '-' + colorIdx;
}

var state = {
    board: [], score: 0, level: 1, goal: 800, 
    coins: 100, crystals: 5, 
    shufFree: 3, hintFree: 3,
    busy: false, sel: -1, combo: 0,

};

var PRICE_HINT = 50, PRICE_SHUF = 80, PRICE_BOMB = 5;

// ============================================================
//  ПОИСК КОМБИНАЦИЙ
// ============================================================
function findAllCombinations(bd) {
    var results = [], used = {};
    
    for (var r = 0; r < NR; r++) {
        for (var c = 0; c <= NC - 3; c++) {
            var i = r * NC + c;
            var ch = bd[i] ? bd[i].h : null;
            if (!ch) continue;
            var len = 1;
            while (c + len < NC && bd[i + len] && bd[i + len].h === ch) len++;
            if (len >= 3) {
                var ids = [];
                for (var k = 0; k < len; k++) ids.push(i + k);
                var key = ids.join('-');
                if (!used[key]) {
                    used[key] = true;
                    results.push({ ids: ids, len: len, type: len >= 6 ? 'rainbow' : len >= 5 ? 'star' : len === 4 ? 'laser' : 'line', orient: 'h' });
                }
            }
            c += len - 1;
        }
    }
    
    for (var c = 0; c < NC; c++) {
        for (var r = 0; r <= NR - 3; r++) {
            var i = r * NC + c;
            var ch = bd[i] ? bd[i].h : null;
            if (!ch) continue;
            var len = 1;
            while (r + len < NR && bd[i + len * NC] && bd[i + len * NC].h === ch) len++;
            if (len >= 3) {
                var ids = [];
                for (var k = 0; k < len; k++) ids.push(i + k * NC);
                var key = ids.join('-');
                if (!used[key]) {
                    used[key] = true;
                    results.push({ ids: ids, len: len, type: len >= 6 ? 'rainbow' : len >= 5 ? 'star' : len === 4 ? 'laser' : 'line', orient: 'v' });
                }
            }
            r += len - 1;
        }
    }
    
    for (var r = 0; r < NR - 2; r++) {
        for (var c = 0; c < NC - 2; c++) {
            var patterns = [
                { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c, (r+2)*NC+c], t: 'L' },
                { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2], t: 'L' },
                { ids: [r*NC+c, (r+1)*NC+c, (r+2)*NC+c, (r+2)*NC+c+1, (r+2)*NC+c+2], t: 'L' },
                { ids: [r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2, (r+2)*NC+c, (r+2)*NC+c+1], t: 'L' },
                { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c+1, (r+2)*NC+c+1], t: 'T' },
                { ids: [(r+2)*NC+c, (r+2)*NC+c+1, (r+2)*NC+c+2, (r+1)*NC+c+1, r*NC+c+1], t: 'T' },
                { ids: [r*NC+c, (r+1)*NC+c, (r+2)*NC+c, (r+1)*NC+c+1, (r+1)*NC+c+2], t: 'T' },
                { ids: [r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2, (r+1)*NC+c+1, (r+1)*NC+c], t: 'T' }
            ];
            for (var p = 0; p < patterns.length; p++) {
                var ids = patterns[p].ids;
                var ch = bd[ids[0]] ? bd[ids[0]].h : null;
                if (!ch) continue;
                var ok = true;
                for (var j = 0; j < ids.length; j++) {
                    if (!bd[ids[j]] || bd[ids[j]].h !== ch) { ok = false; break; }
                }
                if (ok) {
                    var key = ids.join('-');
                    if (!used[key]) {
                        used[key] = true;
                        results.push({ ids: ids, len: 5, type: patterns[p].t, orient: patterns[p].t });
                    }
                }
            }
        }
    }
    
    for (var r = 0; r < NR - 1; r++) {
        for (var c = 0; c < NC - 1; c++) {
            var ids = [r*NC+c, r*NC+c+1, (r+1)*NC+c, (r+1)*NC+c+1];
            var ch = bd[ids[0]] ? bd[ids[0]].h : null;
            if (!ch) continue;
            var ok = true;
            for (var j = 0; j < ids.length; j++) {
                if (!bd[ids[j]] || bd[ids[j]].h !== ch) { ok = false; break; }
            }
            if (ok) {
                var key = ids.join('-');
                if (!used[key]) {
                    used[key] = true;
                    results.push({ ids: ids, len: 4, type: 'square', orient: 'square' });
                }
            }
        }
    }
    return results;
}

function findMatches() {
    var allShapes = findAllCombinations(state.board);
    var matched = {}, shapes = [];
    for (var i = 0; i < allShapes.length; i++) {
        var shape = allShapes[i], ids = shape.ids;
        for (var j = 0; j < ids.length; j++) {
            matched[ids[j]] = true;
        }
        shapes.push(shape);
    }
    var matchedArr = [];
    for (var key in matched) matchedArr.push(parseInt(key));
    return { matched: matchedArr, shapes: shapes };
}

function hasMatch(idx) {
    var r = Math.floor(idx / NC), c = idx % NC, ch = state.board[idx].h;
    if (!ch) return false;
    if (c >= 2 && state.board[idx-1] && state.board[idx-1].h === ch && state.board[idx-2] && state.board[idx-2].h === ch) return true;
    if (r >= 2 && state.board[idx-NC] && state.board[idx-NC].h === ch && state.board[idx-2*NC] && state.board[idx-2*NC].h === ch) return true;
    return false;
}

function anyMove() {
    for (var i = 0; i < TOT; i++) {
        if (!state.board[i]) continue;
        var ns = getNeighbors(i);
        for (var j = 0; j < ns.length; j++) {
            var ni = ns[j];
            if (!state.board[ni]) continue;
            var temp = state.board[i];
            state.board[i] = state.board[ni];
            state.board[ni] = temp;
            var result = findAllCombinations(state.board);
            var temp2 = state.board[i];
            state.board[i] = state.board[ni];
            state.board[ni] = temp2;
            if (result.length > 0) return [i, ni];
        }
    }
    return null;
}

function getNeighbors(idx) {
    var r = Math.floor(idx / NC), c = idx % NC, res = [];
    if (r > 0) res.push(idx - NC);
    if (r < NR - 1) res.push(idx + NC);
    if (c > 0) res.push(idx - 1);
    if (c < NC - 1) res.push(idx + 1);
    return res;
}

function init() {
    loadProgress();
    updateUI();
    startLevel();
    window.addEventListener('resize', calcSize);
    
    var b = document.getElementById('board');
    b.addEventListener('pointerdown', onDown);
    b.addEventListener('pointermove', onMove);
    b.addEventListener('pointerup', onUp);
    document.body.addEventListener('pointerdown', initAudio, {once:true});
    
    if(state.level === 1 && state.score === 0) G.showTut();
}

function startLevel() {
    state.score = 0;
    state.busy = false;
    state.sel = -1;
    
    var totalLevels = LEVELS.length;
    state.circle = Math.floor((state.level - 1) / totalLevels) + 1;
    var baseGoal = 800 + (state.level * 150);
    var mult = 1 + (state.circle - 1) * 0.35;
    state.goal = Math.floor(baseGoal * mult);
    
    var hue = ((state.level - 1) * 37) % 360;
    var bgStyle = 'radial-gradient(circle at center, hsl('+hue+',30%,12%) 0%, hsl('+hue+',20%,5%) 100%)';
    document.getElementById('bg').style.background = bgStyle;
    
    document.getElementById('uTheme').innerText = "Уровень " + state.level + " (Круг " + state.circle + ")";
    document.getElementById('uCircle').innerText = state.circle;
    
    for(var i=0; i<TOT; i++) {
        var att = 0;
        do { 
            state.board[i] = randChar(); 
            att++;
        } while(hasMatch(i) && att < 50);
    }
    if(!anyMove()) reshuffleBoard(true);
    
    calcSize();
    render();
    updateUI();
}

function randChar() {
    var set = LEVELS[(state.level - 1) % LEVELS.length];
    var idx = Math.floor(Math.random() * set.length);
    var c = set[idx];
    
    // Получаем уникальный цвет для этого иероглифа на этом уровне
    var colorClass = getColorForChar(idx, state.level, state.circle);
    
    return {h:c.h, p:c.p, r:c.r, e:c.e, colorClass:colorClass, charIndex:idx, sp:null};
}

async function resolve(matches, shapes) {
    if(matches.length===0) { state.combo=0; checkWin(); return; }
    state.combo++;
    state.busy = true;
    
    playSound('match', state.combo);
    
    var pts = matches.length * 10 * state.combo;
    var coinsEarned = Math.floor(matches.length / 3);
    var cryEarned = 0;
    
    var shapesCopy = shapes.slice();
    for (var s = 0; s < shapesCopy.length; s++) {
        var shape = shapesCopy[s];
        var type = shape.type;
        if (type !== 'line') {
            var midIdx = shape.ids[Math.floor(shape.ids.length / 2)];
            if (state.board[midIdx] && !state.board[midIdx].sp) {
                var boosterName = 'bomb';
                if (type === 'L' || type === 'square') boosterName = 'bomb';
                else if (type === 'T') boosterName = 'laser';
                else if (type === 'star') boosterName = 'star';
                else if (type === 'rainbow') boosterName = 'rainbow';
                state.board[midIdx].sp = boosterName;
                pts += 80;
                if (type === 'star' || type === 'rainbow') cryEarned++;
                playSound('bonus', 0);
                var cells = document.querySelectorAll('.c');
                for (var k = 0; k < shape.ids.length; k++) {
                    var id = shape.ids[k];
                    if (cells[id]) cells[id].classList.add('shape-hl');
                }
            }
        }
    }
    
    state.score += pts;
    state.coins += coinsEarned;
    state.crystals += cryEarned;
    
    render();
    floatText(pts, matches[0]);
    
    if(state.combo > 2 || matches.length > 4) {
        document.getElementById('board').classList.add('shake');
        setTimeout(()=>document.getElementById('board').classList.remove('shake'), 400);
    }

    spawnParticles(matches);

    await sleep(400);
    
    matches.forEach(i => state.board[i] = null);
    applyGravity();
    render();
    await sleep(350);
    
    var next = findMatches();
    await resolve(next.matched, next.shapes);
}

function spawnParticles(indices) {
    var firstIdx = indices[0];
    var charData = state.board[firstIdx];
    if(!charData) return;
    var emoji = charData.e;
    indices.forEach(idx => {
        var el = document.querySelectorAll('.c')[idx];
        if(!el) return;
        var rect = el.getBoundingClientRect();
        var cx = rect.left + rect.width/2;
        var cy = rect.top + rect.height/2;
        for(var k=0; k<2; k++) {
            createParticle(cx, cy, emoji);
        }
    });
}

function createParticle(x, y, emoji) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.innerText = emoji;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    var angle = Math.random() * Math.PI * 2;
    var dist = 60 + Math.random() * 100;
    var tx = Math.cos(angle) * dist + 'px';
    var ty = (Math.sin(angle) * dist - 40) + 'px';
    var rot = (Math.random() - 0.5) * 720 + 'deg';
    p.style.setProperty('--tx', tx);
    p.style.setProperty('--ty', ty);
    p.style.setProperty('--rot', rot);
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1200);
}

function applyGravity() {
    for(var c=0; c<NC; c++) {
        var w=NR-1;
        for(var r=NR-1; r>=0; r--) {
            var i=r*NC+c;
            if(state.board[i]) {
                if(w!==r) { state.board[w*NC+c]=state.board[i]; state.board[i]=null; }
                w--;
            }
        }
        while(w>=0) { state.board[w*NC+c]=randChar(); w--; }
    }
}

function checkWin() {
    state.busy = false;
    if(state.score >= state.goal) {
        playSound('win', 0);
        showLevelComplete();
    } else if(!anyMove()) {
        reshuffleBoard();
    }
    updateUI();
}

function showLevelComplete() {
    var overlay = document.getElementById('levelCompleteOverlay');
    var grid = document.getElementById('jadeGrid');
    grid.innerHTML = '';
    
    var currentSet = LEVELS[(state.level - 1) % LEVELS.length];
    
    currentSet.forEach(function(char, index) {

        card.style.animationDelay = (index * 0.15) + 's';

            '<div class="jade-ru">' + char.r + '</div>' +

    });

function showToast(msg) {
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#d4af37;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;z-index:999;border:1px solid rgba(212,175,55,.3);animation:toastAnim 2s forwards;';
    el.innerText = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
}

var dragStart = -1, isDrag = false, startX=0, startY=0;

function getIdx(e) {
    var t = e.touches?e.touches[0]:e;
    var el = document.elementFromPoint(t.clientX, t.clientY);
    while(el && el.id!=='board') {
        if(el.dataset.i) return parseInt(el.dataset.i);
        el = el.parentElement;
    }
    return -1;
}

function onDown(e) {
    if(state.busy) return;
    initAudio();
    var i = getIdx(e);
    if(i<0) return;
    dragStart = i;
    startX = e.clientX; startY = e.clientY;
    isDrag = false;
    if(state.sel<0) { state.sel=i; render(); }
    else if(state.sel===i) { state.sel=-1; render(); }
    else if(isNeigh(state.sel, i)) { 
        trySwap(state.sel, i); 
        state.sel=-1; 
    }
    else { state.sel=i; render(); }
}

function onMove(e) { 
    if(dragStart>=0 && !state.busy) {
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if(Math.abs(dx)>20 || Math.abs(dy)>20) isDrag = true;
    }
}

async function onUp(e) { 
    if(isDrag && dragStart>=0 && !state.busy) {
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        var target = -1;
        var r = Math.floor(dragStart/NC), c = dragStart%NC;
        if(Math.abs(dx) > Math.abs(dy)) {
            if(dx>0 && c<NC-1) target = dragStart+1;
            else if(dx<0 && c>0) target = dragStart-1;
        } else {
            if(dy>0 && r<NR-1) target = dragStart+NC;
            else if(dy<0 && r>0) target = dragStart-NC;
        }
        if(target>=0) {
            state.sel = -1;
            await trySwap(dragStart, target);
        }
    }
    dragStart=-1; isDrag=false;
}

function isNeigh(a,b) {
    var ra=Math.floor(a/NC), ca=a%NC, rb=Math.floor(b/NC), cb=b%NC;
    return Math.abs(ra-rb)+Math.abs(ca-cb)===1;
}

async function trySwap(a,b) {
    state.busy=true;
    playSound('swap', 0);
    
    var els = document.querySelectorAll('.c');
    var elA = els[a], elB = els[b];
    var rectA = elA.getBoundingClientRect();
    var rectB = elB.getBoundingClientRect();
    var dx = rectB.left - rectA.left;
    var dy = rectB.top - rectA.top;
    
    elA.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    elB.style.transform = 'translate(' + (-dx) + 'px,' + (-dy) + 'px)';
    elA.style.zIndex = 100; elB.style.zIndex = 100;
    
    await sleep(250);
    
    var t=state.board[a]; state.board[a]=state.board[b]; state.board[b]=t;
    render(); 
    
    var res = findMatches();
    if(res.matched.length>0) {
        await resolve(res.matched, res.shapes);
    } else {
        playSound('bad', 0);
        t=state.board[a]; state.board[a]=state.board[b]; state.board[b]=t;
        render();
        els = document.querySelectorAll('.c');
        elA = els[a]; elB = els[b];
        elA.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        elB.style.transform = 'translate(' + (-dx) + 'px,' + (-dy) + 'px)';
        await sleep(50);
        elA.style.transition = 'transform 0.2s'; elB.style.transition = 'transform 0.2s';
        elA.style.transform = ''; elB.style.transform = '';
        await sleep(200);
        state.busy=false;
    }
}

var G = {
    action: function(type) {
        if(state.busy) return;
        initAudio();
        if(type==='shuffle') {
            if(state.shufFree>0) { state.shufFree--; reshuffleBoard(); playSound('swap', 0); }
            else if(state.coins>=PRICE_SHUF) { 
                if(confirm("Купить перемешивание за "+PRICE_SHUF+" 🪙?")) {
                    state.coins-=PRICE_SHUF; reshuffleBoard(); playSound('bonus', 0);
                }
            } else { showToast("Не хватает монет!"); }
        }
        else if(type==='hint') {
            if(state.hintFree>0) { state.hintFree--; showHint(); playSound('swap', 0); }
            else if(state.coins>=PRICE_HINT) {
                if(confirm("Купить подсказку за "+PRICE_HINT+" 🪙?")) {
                    state.coins-=PRICE_HINT; showHint(); playSound('bonus', 0);
                }
            } else { showToast("Не хватает монет!"); }
        }
        else if(type==='bomb') {
            if(state.crystals>=PRICE_BOMB) {
                if(confirm("Установить бомбу за "+PRICE_BOMB+" 💎?")) {
                    state.crystals-=PRICE_BOMB; placeBomb(); playSound('bonus', 0);
                }
            } else { showToast("Не хватает кристаллов!"); }
        }
        updateUI();
        saveProgress();
    },
    restart: function() {
        if(confirm("🔄 Начать сначала? Весь прогресс будет сброшен!")) {
            state.level = 1;
            state.coins = 100;
            state.crystals = 5;
            state.shufFree = 3;
            state.hintFree = 3;
            state.score = 0;
            state.circle = 1;
            localStorage.removeItem('hanzi_save');
            startLevel();
            showToast("🔄 Игра перезапущена!");
        }
    },
    showTut: ()=>document.getElementById('tov').classList.add('show'),
    closeTut: ()=>{
        document.getElementById('tov').classList.remove('show');
        initAudio();
    },
    nextLevelFromModal: function() {
        document.getElementById('levelCompleteOverlay').classList.remove('show');
        window.speechSynthesis.cancel();
        
        state.level++;
        state.shufFree = Math.min(state.shufFree+1, 5);
        state.hintFree = Math.min(state.hintFree+1, 5);
        state.crystals += 2;
        saveProgress();
        showToast("🎉 Уровень пройден! +2 ");
        setTimeout(startLevel, 500);
    }
};

function showHint() {
    var allShapes = findAllCombinations(state.board);
    var cells = document.querySelectorAll('.c');
    
    for (var i = 0; i < allShapes.length; i++) {
        var shape = allShapes[i];
        if (shape.type !== 'line') {
            for (var k = 0; k < shape.ids.length; k++) {
                var id = shape.ids[k];
                if (cells[id]) {
                    cells[id].classList.add('best');
                    (function(el) {
                        setTimeout(function() { el.classList.remove('best'); }, 2000);
                    })(cells[id]);
                }
            }
            showToast("💡 Нашёл сложную форму!");
            return;
        }
    }
    
    for(var i=0; i<TOT; i++) {
        var ns = [[0,1],[1,0]];
        for(var n=0; n<ns.length; n++) {
            var r=Math.floor(i/NC)+ns[n][0], c=i%NC+ns[n][1];
            if(r<NR && c<NC) {
                var j=r*NC+c;
                var t=state.board[i]; state.board[i]=state.board[j]; state.board[j]=t;
                var res = findAllCombinations(state.board);
                state.board[j]=state.board[i]; state.board[i]=t;
                if(res.length>0) {
                    if(cells[i]) {
                        cells[i].classList.add('best');
                        (function(el) {
                            setTimeout(function() { el.classList.remove('best'); }, 2000);
                        })(cells[i]);
                    }
                    if(cells[j]) {
                        cells[j].classList.add('best');
                        (function(el) {
                            setTimeout(function() { el.classList.remove('best'); }, 2000);
                        })(cells[j]);
                    }
                    showToast("💡 Лучший ход!");
                    return;
                }
            }
        }
    }
}

function placeBomb() {
    var idx = Math.floor(Math.random()*TOT);
    state.board[idx].sp = 'bomb';
    render();
    setTimeout(function() {
        var area = [];
        var r = Math.floor(idx/NC), c = idx%NC;
        for(var dr=-1; dr<=1; dr++) {
            for(var dc=-1; dc<=1; dc++) {
                var ni = (r+dr)*NC + (c+dc);
                if(ni>=0 && ni<TOT) area.push(ni);
            }
        }
        resolve(area, []);
    }, 500);
}

function reshuffleBoard(silent) {
    var items = [];
    for(var i=0; i<TOT; i++) {
        if(state.board[i]) items.push(state.board[i]);
    }
    for(var i=items.length-1; i>0; i--) {
        var j = Math.floor(Math.random()*(i+1));
        var t = items[i]; items[i] = items[j]; items[j] = t;
    }
    var k=0;
    for(var i=0; i<TOT; i++) {
        if(state.board[i]) { state.board[i] = items[k++]; }
    }
    if(!anyMove() && !silent) reshuffleBoard(true);
    if(!silent) { render(); updateUI(); }
}

var cellPx=0;
function calcSize() {
    var ba=document.querySelector('.ba');
    var w=ba.clientWidth-8, h=ba.clientHeight-8;
    var cw=(w-(NC-1)*4)/NC, ch=(h-(NR-1)*4)/NR;
    cellPx=Math.min(cw,ch);
    var b=document.getElementById('board');
    b.style.width=(cellPx*NC+(NC-1)*4+12)+'px';
    b.style.height=(cellPx*NR+(NR-1)*4+12)+'px';
    b.style.gridTemplateColumns='repeat('+NC+','+cellPx+'px)';
    b.style.gridTemplateRows='repeat('+NR+','+cellPx+'px)';
    b.style.gap='4px';
    render();
}

function render() {
    var b=document.getElementById('board');
    b.innerHTML='';
    var fsH=Math.max(18, cellPx * .42);
    var fsP=Math.max(9, cellPx * .14);
    var fsR=Math.max(9, cellPx * .14);
    
    for(var i=0; i<TOT; i++) {
        var d=state.board[i];
        var el=document.createElement('div');
        el.className='c';
        el.dataset.i=i;
        el.style.width=cellPx+'px'; 
        el.style.height=cellPx+'px';
        
        // Применяем уникальный цвет для этого уровня
        if(d && d.colorClass) {
            el.classList.add(d.colorClass);
        }
        
        // Добавляем эффект бонуса если есть
        if(d && d.sp) {
            el.classList.add('sp-' + d.sp);
        }
        
        if(i===state.sel) el.classList.add('sel');
        
        if(d) {
            var badge = '';
            if(d.sp === 'bomb') badge = '';
            else if(d.sp === 'laser') badge = '⚡';
            else if(d.sp === 'star') badge = '⭐';
            else if(d.sp === 'rainbow') badge = '🌈';
            el.innerHTML = '<span class="hz" style="font-size:'+fsH+'px">'+d.h+
                '</span><span class="py" style="font-size:'+fsP+'px">'+d.p+
                '</span><span class="ru" style="font-size:'+fsR+'px">'+d.r+
                '</span><span class="emo">'+d.e+
                '</span>'+(d.sp ? '<span class="badge">'+badge+'</span>' : '');
        }
        b.appendChild(el);
    }
}

function updateUI() {
    document.getElementById('uSc').innerText = state.score;
    document.getElementById('uLv').innerText = state.level;
    document.getElementById('uCoin').innerText = state.coins;
    document.getElementById('uCry').innerText = state.crystals;
    document.getElementById('uGl').innerText = state.goal;
    document.getElementById('pFill').style.width = Math.min(100, state.score/state.goal*100) + '%';
    document.getElementById('uCircle').innerText = state.circle;
    
    var rIdx = Math.min(RANKS.length-1, Math.floor((state.level-1)/5));
    document.getElementById('uRank').innerText = RANKS[rIdx];
    
    var bSh = document.getElementById('bSh');
    var bHi = document.getElementById('bHi');
    
    if(state.shufFree>0) {
        bSh.innerHTML = '🔀<span>'+state.shufFree+'</span><small>Беспл.</small>';
        bSh.classList.remove('buy');
    } else {
        bSh.innerHTML = '🔀<small>'+PRICE_SHUF+'🪙</small>';
        bSh.classList.add('buy');
    }
    
    if(state.hintFree>0) {
        bHi.innerHTML = '💡<span>'+state.hintFree+'</span><small>Беспл.</small>';
        bHi.classList.remove('buy');
    } else {
        bHi.innerHTML = '💡<small>'+PRICE_HINT+'🪙</small>';
        bHi.classList.add('buy');
    }
}

function floatText(txt, idx) {
    var el=document.querySelectorAll('.c')[idx];
    if(!el) return;
    var f=document.createElement('div');
    f.className='fpts'; f.innerText='+'+txt;
    f.style.left=el.offsetLeft+'px'; f.style.top=el.offsetTop+'px';
    f.style.fontSize=(cellPx*.3)+'px';
    document.getElementById('board').appendChild(f);
    setTimeout(function() { f.remove(); }, 1000);
}

function sleep(ms) {
    return new Promise(function(r) { setTimeout(r, ms); });
}

function saveProgress() {
    localStorage.setItem('hanzi_save', JSON.stringify({
        lvl: state.level, 
        coins: state.coins, 
        cry: state.crystals, 
        sf: state.shufFree, 
        hf: state.hintFree
    }));
}

function loadProgress() {
    var s = localStorage.getItem('hanzi_save');
    if(s) {
        try {
            var d = JSON.parse(s);
            state.level = d.lvl || 1;
            state.coins = d.coins || 0;
            state.crystals = d.cry || 0;
            state.shufFree = d.sf || 3;
            state.hintFree = d.hf || 3;
        } catch(e) {}
    }
}

init();

console.log('✅ Hanzi: Нефрит и Золото (25 палитр + эффекты) загружена!');
</script>
