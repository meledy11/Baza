<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🀄 Ханзи: 3D Master</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#050505;color:#fff;touch-action:none;}
body{display:flex;flex-direction:column;align-items:center;}

/* Фоны (Глубокие, атмосферные) */
.bg{position:fixed;inset:0;z-index:0;transition:background 1s ease;}
.bg.t1{background:radial-gradient(circle at top left, #1a1a2e, #000);} /* Космос */
.bg.t2{background:radial-gradient(circle at bottom right, #0f2027, #203a43, #2c5364);} /* Океан */
.bg.t3{background:radial-gradient(circle at center, #2b0a1d, #000);} /* Неон */
.bg.t4{background:radial-gradient(circle at top, #134e5e, #71b280);} /* Лес */
.bg.t5{background:radial-gradient(circle at bottom, #3a1c71, #d76d77, #ffaf7b);} /* Закат */
.bg.t6{background:radial-gradient(circle at center, #232526, #414345);} /* Карбон */
.bg.t7{background:radial-gradient(circle at top right, #1f1c2c, #928dab);} /* Туман */
.bg.t8{background:radial-gradient(circle at bottom left, #0f0c29, #302b63, #24243e);} /* Мистика */

.hdr{z-index:10;width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;}
.logo-box{display:flex;flex-direction:column;}
.logo{font-size:1.1rem;font-weight:900;background:linear-gradient(to right,#ffd700,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 2px 10px rgba(255,215,0,.3);}
.rank{font-size:.6rem;color:#aaa;letter-spacing:1px;text-transform:uppercase;margin-top:2px;text-shadow:0 1px 2px #000;}

.stats{display:flex;gap:6px;}
.stat{background:rgba(255,255,255,.05);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:4px 10px;font-size:.65rem;display:flex;align-items:center;gap:5px;box-shadow:0 4px 6px rgba(0,0,0,.2);}
.stat b{font-size:.85rem;text-shadow:0 0 5px currentColor;}
.c-gold{color:#ffd700;} .c-grn{color:#2ecc71;} .c-cyan{color:#22d3ee;} .c-pur{color:#a855f7;}

.pw{z-index:10;width:100%;max-width:600px;padding:0 12px 6px;}
.pt{height:8px;background:rgba(0,0,0,.3);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.05);}
.pf{height:100%;background:linear-gradient(90deg,#ff6b6b,#ffd700,#2ecc71);box-shadow:0 0 10px rgba(255,215,0,.5);transition:width .4s ease-out;}
.pl{display:flex;justify-content:space-between;font-size:.6rem;color:rgba(255,255,255,.5);margin-top:4px;text-shadow:0 1px 2px #000;}

.ba{z-index:5;flex:1;width:100%;max-width:600px;display:flex;align-items:center;justify-content:center;padding:4px;perspective:1000px;}
#board{
    display:grid;
    background:rgba(0,0,0,.2);
    border-radius:16px;
    padding:6px;
    border:1px solid rgba(255,255,255,.05);
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 20px rgba(0,0,0,.5);
    backdrop-filter:blur(2px);
}

/* === 3D КУБИКИ === */
.c{
    position:relative;
    border-radius:14px; /* Обтекаемая форма */
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.15);
    box-shadow: 
        inset 2px 2px 5px rgba(255,255,255,.3), /* Верхний блик */
        inset -2px -2px 5px rgba(0,0,0,.4),    /* Нижняя тень */
        4px 4px 8px rgba(0,0,0,.4);            /* Тень от объекта */
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
    transform-style:preserve-3d;
}
/* Глянцевый блик сверху */
.c::after{
    content:'';position:absolute;top:0;left:0;right:0;height:45%;
    background:linear-gradient(to bottom, rgba(255,255,255,.4), transparent);
    border-radius:14px 14px 50% 50%;
    pointer-events:none;
    z-index:1;
}

/* Модные цвета (Градиенты) */
/* T1: Neon Cyberpunk */
.t1 .c0{background:linear-gradient(135deg,#ff00cc,#333399);} .t1 .c1{background:linear-gradient(135deg,#00ffff,#0099ff);} .t1 .c2{background:linear-gradient(135deg,#ccff00,#339900);} .t1 .c3{background:linear-gradient(135deg,#ff3300,#990000);} .t1 .c4{background:linear-gradient(135deg,#aa00ff,#550099);} .t1 .c5{background:linear-gradient(135deg,#ffff00,#ff9900);}
/* T2: Deep Ocean */
.t2 .c0{background:linear-gradient(135deg,#00b4db,#0083b0);} .t2 .c1{background:linear-gradient(135deg,#4ca1af,#c4e0e5);} .t2 .c2{background:linear-gradient(135deg,#1c92d2,#f2fcfe);} .t2 .c3{background:linear-gradient(135deg,#005c97,#363795);} .t2 .c4{background:linear-gradient(135deg,#2980b9,#2c3e50);} .t2 .c5{background:linear-gradient(135deg,#757f9a,#d7dde8);}
/* T3: Candy Pop */
.t3 .c0{background:linear-gradient(135deg,#ff9a9e,#fecfef);} .t3 .c1{background:linear-gradient(135deg,#a18cd1,#fbc2eb);} .t3 .c2{background:linear-gradient(135deg,#fad0c4,#ffd1ff);} .t3 .c3{background:linear-gradient(135deg,#ffecd2,#fcb69f);} .t3 .c4{background:linear-gradient(135deg,#84fab0,#8fd3f4);} .t3 .c5{background:linear-gradient(135deg,#cfd9df,#e2ebf0);}
/* T4: Forest Myst */
.t4 .c0{background:linear-gradient(135deg,#11998e,#38ef7d);} .t4 .c1{background:linear-gradient(135deg,#d8b385,#9b6b45);} .t4 .c2{background:linear-gradient(135deg,#56ab2f,#a8e063);} .t4 .c3{background:linear-gradient(135deg,#203a43,#2c5364);} .t4 .c4{background:linear-gradient(135deg,#ece9e6,#ffffff);} .t4 .c5{background:linear-gradient(135deg,#1d976c,#93f9b9);}
/* T5: Sunset Vibes */
.t5 .c0{background:linear-gradient(135deg,#fa709a,#fee140);} .t5 .c1{background:linear-gradient(135deg,#30cfd0,#330867);} .t5 .c2{background:linear-gradient(135deg,#f09819,#edde5d);} .t5 .c3{background:linear-gradient(135deg,#ff512f,#dd2476);} .t5 .c4{background:linear-gradient(135deg,#1a2a6c,#b21f1f,#fdbb2d);} .t5 .c5{background:linear-gradient(135deg,#c33764,#1d2671);}
/* T6: Gold Luxury */
.t6 .c0{background:linear-gradient(135deg,#bf953f,#fcf6ba,#b38728);} .t6 .c1{background:linear-gradient(135deg,#8e9eab,#eef2f3);} .t6 .c2{background:linear-gradient(135deg,#141e30,#243b55);} .t6 .c3{background:linear-gradient(135deg,#cbad6d,#d5c4a1);} .t6 .c4{background:linear-gradient(135deg,#4e54c8,#8f94fb);} .t6 .c5{background:linear-gradient(135deg,#232526,#414345);}
/* T7: Berry Mix */
.t7 .c0{background:linear-gradient(135deg,#8e2de2,#4a00e0);} .t7 .c1{background:linear-gradient(135deg,#ec008c,#fc6767);} .t7 .c2{background:linear-gradient(135deg,#f12711,#f5af19);} .t7 .c3{background:linear-gradient(135deg,#00c6ff,#0072ff);} .t7 .c4{background:linear-gradient(135deg,#11998e,#38ef7d);} .t7 .c5{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);}
/* T8: Midnight Tech */
.t8 .c0{background:linear-gradient(135deg,#000428,#004e92);} .t8 .c1{background:linear-gradient(135deg,#2b5876,#4e4376);} .t8 .c2{background:linear-gradient(135deg,#1f4037,#99f2c8);} .t8 .c3{background:linear-gradient(135deg,#4b6cb7,#182848);} .t8 .c4{background:linear-gradient(135deg,#2c3e50,#fd746c);} .t8 .c5{background:linear-gradient(135deg,#000000,#434343);}

/* Спец-эффекты */
.c.sp-bomb{border:2px solid #ff4444!important;box-shadow:0 0 20px #ff4444, inset 0 0 10px #ff0000;}
.c.sp-laser{border:2px solid #aa88ee!important;box-shadow:0 0 20px #aa88ee, inset 0 0 10px #8800ff;}
.c.sp-star{border:2px solid #88eebb!important;box-shadow:0 0 20px #88eebb, inset 0 0 10px #00ff88;}
.c.sp-rainbow{background:conic-gradient(from 180deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)!important;border:2px solid #fff!important;animation:spin 4s linear infinite;}
@keyframes spin{to{filter:hue-rotate(360deg);}}

/* Текст внутри плитки */
.c .hz{font-size:1.5rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.9), 0 0 10px rgba(255,255,255,.3);z-index:2;line-height:1;transform:translateZ(10px);}
.c .py{font-size:.55rem;color:rgba(255,255,255,.9);margin-top:2px;z-index:2;text-shadow:0 1px 2px #000;font-weight:600;}
.c .ru{
    font-size:.55rem; font-weight:700; color:#fff; 
    background:rgba(0,0,0,.5); padding:2px 6px; border-radius:6px; 
    margin-top:3px; z-index:3; max-width:95%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    box-shadow:0 2px 4px rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.1);
}
.c .emo{position:absolute;bottom:3px;left:3px;font-size:.6rem;opacity:.4;z-index:1;filter:drop-shadow(0 1px 2px #000);}
.c .badge{position:absolute;top:2px;right:3px;font-size:.8rem;z-index:4;filter:drop-shadow(0 0 5px #000);}

/* Анимации */
.c.sel{transform:scale(1.1) translateZ(10px);z-index:10;box-shadow:0 0 0 3px #ffd700, 0 10px 20px rgba(0,0,0,.5);}
.c.anim-swap{transition:transform 0.25s ease-in-out;z-index:20;}
.c.gone{animation:pop 0.35s forwards;}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.2);opacity:.8;}100%{transform:scale(0);opacity:0;}}
.c.drop{animation:drop 0.5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes drop{from{transform:translateY(-80px) scale(0.8);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
.c.best{animation:pulse 1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.6);}70%{box-shadow:0 0 0 15px rgba(46,204,113,0);}100%{box-shadow:0 0 0 0 rgba(46,204,113,0);}}

.bar{z-index:10;width:100%;max-width:600px;display:flex;gap:8px;justify-content:center;padding:10px;}
.btn{padding:10px 14px;border:none;border-radius:14px;font-weight:700;font-size:.7rem;cursor:pointer;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:5px;transition:.2s;backdrop-filter:blur(5px);box-shadow:0 4px 6px rgba(0,0,0,.2);}
.btn:hover{background:rgba(255,255,255,.15);transform:translateY(-2px);}
.btn:active{transform:scale(.95);}
.btn.buy{border-color:rgba(255,215,0,.4);color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.1);}
.btn small{font-size:.55rem;opacity:.8;display:block;line-height:1;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px);}
.overlay.show{display:flex;}
.modal{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:30px;max-width:360px;width:90%;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.8);}
.modal h2{color:#ffd700;margin-bottom:12px;font-size:1.5rem;}
.modal p{font-size:.9rem;color:#ddd;margin-bottom:20px;line-height:1.6;}
.modal button{background:linear-gradient(45deg,#ffd700,#ff6b6b);border:none;padding:12px 30px;border-radius:25px;font-weight:bold;color:#000;cursor:pointer;font-size:1rem;box-shadow:0 5px 15px rgba(255,107,107,.4);transition:.2s;}
.modal button:hover{transform:scale(1.05);}

.fpts{position:absolute;pointer-events:none;z-index:50;font-weight:900;color:#ffd700;text-shadow:0 0 10px #ff6b6b, 0 2px 4px #000;animation:floatUp 1.2s forwards;font-size:1.2rem;}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-60px) scale(1.5);opacity:0;}}
</style>
</head>
<body>

<div class="bg t1" id="bg"></div>

<div class="hdr">
  <div class="logo-box">
    <div class="logo">🀄 Ханзи 3D</div>
    <div class="rank" id="uRank">Новичок</div>
  </div>
  <div class="stats">
    <div class="stat">⭐<b class="c-gold" id="uSc">0</b></div>
    <div class="stat">🎯<b class="c-grn" id="uLv">1</b></div>
    <div class="stat">🪙<b class="c-cyan" id="uCoin">100</b></div>
    <div class="stat">💎<b class="c-pur" id="uCry">5</b></div>
  </div>
</div>

<div class="pw">
  <div class="pt"><div class="pf" id="pFill" style="width:0%"></div></div>
  <div class="pl"><span>Цель: <b id="uGl">500</b></span><span id="uTheme">Тема: Космос</span></div>
</div>

<div class="ba"><div id="board" class="t1"></div></div>

<div class="bar">
  <button class="btn" id="bSh" onclick="G.action('shuffle')">🔀<span id="cSh">3</span><small>Беспл.</small></button>
  <button class="btn" id="bHi" onclick="G.action('hint')">💡<span id="cHi">3</span><small>Беспл.</small></button>
  <button class="btn" id="bBm" onclick="G.action('bomb')">💥<small>5💎</small></button>
  <button class="btn" onclick="G.showTut()">❓</button>
</div>

<div class="overlay" id="tov">
  <div class="modal">
    <h2 id="tTi">Как играть?</h2>
    <p id="tSt">Собирайте 3+ одинаковых иероглифа.<br>4 в ряд = Лазер ⚡<br>L/T форма = Бомба 💥<br>5 в ряд = Звезда ⭐<br><br>Звук включается автоматически.</p>
    <button onclick="G.closeTut()">Играть</button>
  </div>
</div>

<script src="app.js"></script>
<script>
// === ЗВУКОВОЙ ДВИЖОК (Synthesizer) ===
var audioCtx = null;
function initAudio() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
    if(!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    var now = audioCtx.currentTime;
    if(type === 'swap') {
        // Мягкий "вжух"
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now+0.1);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now+0.1);
        osc.start(now); osc.stop(now+0.1);
    } else if(type === 'match') {
        // Приятный "блим"
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(1000, now+0.15);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now+0.3);
        osc.start(now); osc.stop(now+0.3);
    } else if(type === 'bad') {
        // Глухой стук
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now+0.15);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.01, now+0.15);
        osc.start(now); osc.stop(now+0.15);
    } else if(type === 'bonus') {
        // Волшебный звук
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.setValueAtTime(1200, now+0.1);
        osc.frequency.setValueAtTime(1600, now+0.2);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now+0.5);
        osc.start(now); osc.stop(now+0.5);
    } else if(type === 'win') {
        // Победный аккорд
        [400, 500, 600, 800].forEach((f, i) => {
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = f;
            g.gain.setValueAtTime(0.05, now + i*0.1);
            g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.4);
            o.start(now + i*0.1); o.stop(now + i*0.1 + 0.4);
        });
    }
}

// === КОНФИГУРАЦИЯ ===
var RANKS = ["Новичок","Ученик","Мастер","Эксперт","Гуру","Магистр","Мудрец","Император"];
var NC=6, NR=8, TOT=NC*NR;
var DB_FALLBACK = [
    [{h:"人",p:"rén",r:"человек",e:"👤"},{h:"大",p:"dà",r:"большой",e:"📏"},{h:"小",p:"xiǎo",r:"маленький",e:"🔬"},{h:"好",p:"hǎo",r:"хороший",e:"👍"},{h:"水",p:"shuǐ",r:"вода",e:"💧"}],
    [{h:"火",p:"huǒ",r:"огонь",e:"🔥"},{h:"山",p:"shān",r:"гора",e:"⛰️"},{h:"月",p:"yuè",r:"луна",e:"🌙"},{h:"日",p:"rì",r:"солнце",e:"🌞"},{h:"花",p:"huā",r:"цветок",e:"🌸"}],
    [{h:"鱼",p:"yú",r:"рыба",e:"🐟"},{h:"鸟",p:"niǎo",r:"птица",e:"🐦"},{h:"马",p:"mǎ",r:"лошадь",e:"🐴"},{h:"龙",p:"lóng",r:"дракон",e:"🐉"},{h:"风",p:"fēng",r:"ветер",e:"🌬️"}],
    [{h:"雨",p:"yǔ",r:"дождь",e:"🌧️"},{h:"雪",p:"xuě",r:"снег",e:"❄️"},{h:"星",p:"xīng",r:"звезда",e:"⭐"},{h:"心",p:"xīn",r:"сердце",e:"💖"},{h:"手",p:"shǒu",r:"рука",e:"✋"}]
];

var LEVELS = [];
if(typeof DB !== 'undefined' && DB.length > 0) {
    for(var i=0; i<Math.ceil(DB.length/5); i++) {
        var set = [];
        for(var j=0; j<5; j++) {
            var d = DB[(i*5+j)%DB.length];
            set.push({h:d[0], p:d[1], r:d[2], e:d[3]||'🀄'});
        }
        LEVELS.push(set);
    }
} else { LEVELS = DB_FALLBACK; }

var state = {
    board: [], score: 0, level: 1, goal: 500, 
    coins: 100, crystals: 5, 
    shufFree: 3, hintFree: 3,
    busy: false, sel: -1, combo: 0
};

var PRICE_HINT = 50, PRICE_SHUF = 80, PRICE_BOMB = 5;

// === ЛОГИКА ИГРЫ ===
function init() {
    loadProgress();
    updateUI();
    startLevel();
    window.addEventListener('resize', calcSize);
    
    var b = document.getElementById('board');
    b.addEventListener('pointerdown', onDown);
    b.addEventListener('pointermove', onMove);
    b.addEventListener('pointerup', onUp);
    document.body.addEventListener('pointerdown', initAudio, {once:true});
}

function startLevel() {
    state.score = 0;
    state.goal = Math.floor(500 * state.level * 1.2); 
    state.board = [];
    state.busy = false;
    state.sel = -1;
    
    var themeIdx = (state.level - 1) % 8;
    document.getElementById('bg').className = 'bg t' + (themeIdx+1);
    document.getElementById('board').className = 't' + (themeIdx+1);
    var themes = ["Космос","Океан","Неон","Лес","Закат","Карбон","Туман","Мистика"];
    document.getElementById('uTheme').innerText = "Тема: " + themes[themeIdx];
    
    for(var i=0; i<TOT; i++) {
        do { state.board[i] = randChar(); } while(hasMatch(i));
    }
    if(!anyMove()) reshuffleBoard(true);
    
    calcSize();
    render();
    updateUI();
}

function randChar() {
    var set = LEVELS[(state.level-1) % LEVELS.length];
    var c = set[Math.floor(Math.random()*set.length)];
    return {h:c.h, p:c.p, r:c.r, e:c.e, c:set.indexOf(c), sp:null};
}

function hasMatch(idx) {
    var r=Math.floor(idx/NC), c=idx%NC, ch=state.board[idx].h;
    if(c>=2 && state.board[idx-1].h==ch && state.board[idx-2].h==ch) return true;
    if(r>=2 && state.board[idx-NC].h==ch && state.board[idx-2*NC].h==ch) return true;
    return false;
}

function findMatches() {
    var matched = {}, shapes = [];
    // Горизонталь
    for(var r=0;r<NR;r++) for(var c=0;c<NC-2;c++) {
        var i=r*NC+c, ch=state.board[i].h, len=1;
        while(c+len<NC && state.board[i+len].h==ch) len++;
        if(len>=3) {
            var ids=[]; for(var k=0;k<len;k++) ids.push(i+k);
            shapes.push({ids:ids, type:len>=5?'star':len==4?'laser':'line', orient:'h'});
            ids.forEach(x=>matched[x]=true);
            c+=len-1;
        }
    }
    // Вертикаль
    for(var c=0;c<NC;c++) for(var r=0;r<NR-2;r++) {
        var i=r*NC+c, ch=state.board[i].h, len=1;
        while(r+len<NR && state.board[i+len*NC].h==ch) len++;
        if(len>=3) {
            var ids=[]; for(var k=0;k<len;k++) ids.push(i+k*NC);
            shapes.push({ids:ids, type:len>=5?'star':len==4?'laser':'line', orient:'v'});
            ids.forEach(x=>matched[x]=true);
            r+=len-1;
        }
    }
    return {matched:Object.keys(matched).map(Number), shapes:shapes};
}

async function resolve(matches, shapes) {
    if(matches.length===0) { state.combo=0; checkWin(); return; }
    state.combo++;
    state.busy = true;
    
    playSound('match');
    
    var pts = matches.length * 10 * state.combo;
    var coinsEarned = Math.floor(matches.length / 3);
    var cryEarned = 0;
    
    shapes.forEach(s => {
        if(s.type !== 'line') {
            var mid = s.ids[Math.floor(s.ids.length/2)];
            if(state.board[mid]) {
                state.board[mid].sp = s.type;
                pts += 50;
                if(s.type==='star') cryEarned++;
                playSound('bonus');
            }
        }
    });
    
    state.score += pts;
    state.coins += coinsEarned;
    state.crystals += cryEarned;
    
    render();
    floatText(pts, matches[0]);
    await sleep(350);
    
    matches.forEach(i => state.board[i] = null);
    applyGravity();
    render();
    await sleep(350);
    
    var next = findMatches();
    await resolve(next.matched, next.shapes);
}

function applyGravity() {
    for(var c=0;c<NC;c++) {
        var w=NR-1;
        for(var r=NR-1;r>=0;r--) {
            var i=r*NC+c;
            if(state.board[i]) {
                if(w!==r) { state.board[w*NC+c]=state.board[i]; state.board[i]=null; }
                w--;
            }
        }
        while(w>=0) { state.board[w*NC+c]=randChar(); w--; }
    }
}

function checkWin() {
    state.busy = false;
    if(state.score >= state.goal) {
        playSound('win');
        state.level++;
        state.shufFree = Math.min(state.shufFree+1, 5);
        state.hintFree = Math.min(state.hintFree+1, 5);
        state.crystals += 2;
        saveProgress();
        alert("Уровень пройден! +2 💎");
        startLevel();
    } else if(!anyMove()) {
        reshuffleBoard();
    }
    updateUI();
}

// === УПРАВЛЕНИЕ С АНИМАЦИЕЙ ===
var dragStart = -1, isDrag = false, startX=0, startY=0;

function getIdx(e) {
    var t = e.touches?e.touches[0]:e;
    var el = document.elementFromPoint(t.clientX, t.clientY);
    while(el && el.id!=='board') {
        if(el.dataset.i) return parseInt(el.dataset.i);
        el = el.parentElement;
    }
    return -1;
}

function onDown(e) {
    if(state.busy) return;
    initAudio();
    var i = getIdx(e);
    if(i<0) return;
    dragStart = i;
    startX = e.clientX; startY = e.clientY;
    isDrag = false;
    if(state.sel<0) { state.sel=i; render(); }
    else if(state.sel===i) { state.sel=-1; render(); }
    else if(isNeigh(state.sel, i)) { 
        trySwap(state.sel, i); 
        state.sel=-1; 
    }
    else { state.sel=i; render(); }
}

function onMove(e) { 
    if(dragStart>=0 && !state.busy) {
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if(Math.abs(dx)>20 || Math.abs(dy)>20) isDrag = true;
    }
}

async function onUp(e) { 
    if(isDrag && dragStart>=0 && !state.busy) {
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        var target = -1;
        var r = Math.floor(dragStart/NC), c = dragStart%NC;
        
        if(Math.abs(dx) > Math.abs(dy)) {
            if(dx>0 && c<NC-1) target = dragStart+1;
            else if(dx<0 && c>0) target = dragStart-1;
        } else {
            if(dy>0 && r<NR-1) target = dragStart+NC;
            else if(dy<0 && r>0) target = dragStart-NC;
        }
        
        if(target>=0) {
            state.sel = -1;
            await trySwap(dragStart, target);
        }
    }
    dragStart=-1; 
    isDrag=false;
}

function isNeigh(a,b) {
    var ra=Math.floor(a/NC), ca=a%NC, rb=Math.floor(b/NC), cb=b%NC;
    return Math.abs(ra-rb)+Math.abs(ca-cb)===1;
}

async function trySwap(a,b) {
    state.busy=true;
    playSound('swap');
    
    // Визуальная анимация свопа
    var els = document.querySelectorAll('.c');
    var elA = els[a], elB = els[b];
    var rectA = elA.getBoundingClientRect();
    var rectB = elB.getBoundingClientRect();
    var dx = rectB.left - rectA.left;
    var dy = rectB.top - rectA.top;
    
    elA.style.transform = `translate(${dx}px, ${dy}px)`;
    elB.style.transform = `translate(${-dx}px, ${-dy}px)`;
    elA.style.zIndex = 100; elB.style.zIndex = 100;
    
    await sleep(250);
    
    // Логический своп
    var t=state.board[a]; state.board[a]=state.board[b]; state.board[b]=t;
    render(); 
    
    var res = findMatches();
    if(res.matched.length>0) {
        await resolve(res.matched, res.shapes);
    } else {
        playSound('bad');
        // Обратная анимация
        t=state.board[a]; state.board[a]=state.board[b]; state.board[b]=t;
        render();
        els = document.querySelectorAll('.c');
        elA = els[a]; elB = els[b];
        elA.style.transform = `translate(${dx}px, ${dy}px)`;
        elB.style.transform = `translate(${-dx}px, ${-dy}px)`;
        await sleep(50);
        elA.style.transition = 'transform 0.2s'; elB.style.transition = 'transform 0.2s';
        elA.style.transform = ''; elB.style.transform = '';
        await sleep(200);
        state.busy=false;
    }
}

// === МАГАЗИН И КНОПКИ ===
var G = {
    action: function(type) {
        if(state.busy) return;
        initAudio();
        if(type==='shuffle') {
            if(state.shufFree>0) { state.shufFree--; reshuffleBoard(); playSound('swap'); }
            else if(state.coins>=PRICE_SHUF) { 
                if(confirm("Купить перемешивание за "+PRICE_SHUF+" 🪙?")) {
                    state.coins-=PRICE_SHUF; reshuffleBoard(); playSound('bonus');
                }
            } else { alert("Не хватает монет!"); }
        }
        else if(type==='hint') {
            if(state.hintFree>0) { state.hintFree--; showHint(); playSound('swap'); }
            else if(state.coins>=PRICE_HINT) {
                if(confirm("Купить подсказку за "+PRICE_HINT+" 🪙?")) {
                    state.coins-=PRICE_HINT; showHint(); playSound('bonus');
                }
            } else { alert("Не хватает монет!"); }
        }
        else if(type==='bomb') {
            if(state.crystals>=PRICE_BOMB) {
                if(confirm("Установить бомбу за "+PRICE_BOMB+" 💎?")) {
                    state.crystals-=PRICE_BOMB; placeBomb(); playSound('bonus');
                }
            } else { alert("Не хватает кристаллов!"); }
        }
        updateUI();
    },
    showTut: ()=>document.getElementById('tov').classList.add('show'),
    closeTut: ()=>document.getElementById('tov').classList.remove('show')
};

function showHint() {
    for(var i=0;i<TOT;i++) {
        var ns = [[0,1],[1,0]];
        for(var n of ns) {
            var r=Math.floor(i/NC)+n[0], c=i%NC+n[1];
            if(r<NR && c<NC) {
                var j=r*NC+c;
                var t=state.board[i]; state.board[i]=state.board[j]; state.board[j]=t;
                if(findMatches().matched.length>0) {
                    state.board[j]=state.board[i]; state.board[i]=t;
                    var els = document.querySelectorAll('.c');
                    els[i].classList.add('best'); els[j].classList.add('best');
                    setTimeout(()=>{els[i].classList.remove('best');els[j].classList.remove('best');},1500);
                    return;
                }
                state.board[j]=state.board[i]; state.board[i]=t;
            }
        }
    }
}

function placeBomb() {
    var idx = Math.floor(Math.random()*TOT);
    state.board[idx].sp = 'bomb';
    render();
    setTimeout(()=>{
        var area = [];
        for(var r=-1;r<=1;r++) for(var c=-1;c<=1;c++) {
            var ni = (Math.floor(idx/NC)+r)*NC + (idx%NC+c);
            if(ni>=0 && ni<TOT) area.push(ni);
        }
        resolve(area, []);
    }, 500);
}

function reshuffleBoard(silent) {
    var items = state.board.filter(x=>x);
    items.sort(()=>Math.random()-.5);
    var k=0;
    for(var i=0;i<TOT;i++) if(state.board[i]) state.board[i]=items[k++];
    if(!anyMove() && !silent) reshuffleBoard(true);
    if(!silent) { render(); updateUI(); }
}

function anyMove() {
    for(var i=0;i<TOT;i++) {
        var ns=[[0,1],[1,0]];
        for(var n of ns) {
            var r=Math.floor(i/NC)+n[0], c=i%NC+n[1];
            if(r<NR && c<NC) {
                var j=r*NC+c;
                var t=state.board[i]; state.board[i]=state.board[j]; state.board[j]=t;
                var ok=findMatches().matched.length>0;
                state.board[j]=state.board[i]; state.board[i]=t;
                if(ok) return true;
            }
        }
    }
    return false;
}

// === ОТРИСОВКА ===
var cellPx=0;
function calcSize() {
    var ba=document.querySelector('.ba');
    var w=ba.clientWidth-8, h=ba.clientHeight-8;
    var cw=(w-(NC-1)*6)/NC, ch=(h-(NR-1)*6)/NR; // Увеличен отступ для 3D эффекта
    cellPx=Math.min(cw,ch);
    var b=document.getElementById('board');
    b.style.width=(cellPx*NC+(NC-1)*6+12)+'px';
    b.style.height=(cellPx*NR+(NR-1)*6+12)+'px';
    b.style.gridTemplateColumns=`repeat(${NC},${cellPx}px)`;
    b.style.gridTemplateRows=`repeat(${NR},${cellPx}px)`;
    b.style.gap='6px';
    render();
}

function render() {
    var b=document.getElementById('board');
    b.innerHTML='';
    var fsH=Math.max(16,cellPx*.45);
    var fsP=Math.max(9,cellPx*.16);
    var fsR=Math.max(9,cellPx*.15);
    
    for(var i=0;i<TOT;i++) {
        var d=state.board[i];
        var el=document.createElement('div');
        el.className='c c'+(d?d.c:0);
        el.dataset.i=i;
        el.style.width=cellPx+'px'; el.style.height=cellPx+'px';
        if(i===state.sel) el.classList.add('sel');
        
        if(d) {
            if(d.sp) el.classList.add('sp-'+d.sp);
            el.innerHTML=`
                <span class="hz" style="font-size:${fsH}px">${d.h}</span>
                <span class="py" style="font-size:${fsP}px">${d.p}</span>
                <span class="ru" style="font-size:${fsR}px">${d.r}</span>
                <span class="emo">${d.e}</span>
                ${d.sp?'<span class="badge">'+(d.sp=='bomb'?'💥':d.sp=='laser'?'⚡':'⭐')+'</span>':''}
            `;
        }
        b.appendChild(el);
    }
}

function updateUI() {
    document.getElementById('uSc').innerText=state.score;
    document.getElementById('uLv').innerText=state.level;
    document.getElementById('uCoin').innerText=state.coins;
    document.getElementById('uCry').innerText=state.crystals;
    document.getElementById('uGl').innerText=state.goal;
    document.getElementById('pFill').style.width=Math.min(100,state.score/state.goal*100)+'%';
    
    var rIdx = Math.min(RANKS.length-1, Math.floor((state.level-1)/5));
    document.getElementById('uRank').innerText = RANKS[rIdx];
    
    var bSh=document.getElementById('bSh');
    var bHi=document.getElementById('bHi');
    
    if(state.shufFree>0) {
        bSh.innerHTML=`🔀<span>${state.shufFree}</span><small>Беспл.</small>`;
        bSh.classList.remove('buy');
    } else {
        bSh.innerHTML=`🔀<small>${PRICE_SHUF}🪙</small>`;
        bSh.classList.add('buy');
    }
    
    if(state.hintFree>0) {
        bHi.innerHTML=`💡<span>${state.hintFree}</span><small>Беспл.</small>`;
        bHi.classList.remove('buy');
    } else {
        bHi.innerHTML=`💡<small>${PRICE_HINT}🪙</small>`;
        bHi.classList.add('buy');
    }
}

function floatText(txt, idx) {
    var el=document.querySelectorAll('.c')[idx];
    if(!el) return;
    var f=document.createElement('div');
    f.className='fpts'; f.innerText='+'+txt;
    f.style.left=el.offsetLeft+'px'; f.style.top=el.offsetTop+'px';
    f.style.fontSize=(cellPx*.35)+'px';
    document.getElementById('board').appendChild(f);
    setTimeout(()=>f.remove(),1200);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function saveProgress() {
    localStorage.setItem('hanzi_save', JSON.stringify({
        lvl:state.level, coins:state.coins, cry:state.crystals, 
        sf:state.shufFree, hf:state.hintFree
    }));
}
function loadProgress() {
    var s=localStorage.getItem('hanzi_save');
    if(s) {
        var d=JSON.parse(s);
        state.level=d.lvl||1; state.coins=d.coins||0; state.crystals=d.cry||0;
        state.shufFree=d.sf||3; state.hintFree=d.hf||3;
    }
}

init();
</script>
