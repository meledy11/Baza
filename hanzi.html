<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🀄 Ханзи: Нефрит и Золото</title>
<style>
/* ... (базовые стили body, hdr остаются прежними) ... */
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0f;color:#fff;touch-action:none;}
body{display:flex;flex-direction:column;align-items:center;}
.bg{position:fixed;inset:0;z-index:0;transition:background 1.5s ease;}
.hdr{z-index:10;width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;}
.logo{font-size:1rem;font-weight:800;color:#d4af37;text-shadow:0 2px 4px rgba(0,0,0,.5);letter-spacing:1px;}
.rank{font-size:.55rem;color:#a89f91;letter-spacing:2px;text-transform:uppercase;margin-top:1px;font-weight:600;}
.stats{display:flex;gap:4px;flex-wrap:wrap;}
.stat{background:rgba(20,20,25,.6);border:1px solid rgba(212,175,55,.3);border-radius:5px;padding:3px 8px;font-size:.6rem;display:flex;align-items:center;gap:3px;backdrop-filter:blur(4px);}
.stat b{font-size:.75rem;color:#e8dcc5;}
.c-gold{color:#d4af37!important;} .c-grn{color:#5da399!important;} .c-cyan{color:#7fb5b0!important;} .c-pur{color:#9b72aa!important;}
.pw{z-index:10;width:100%;max-width:600px;padding:0 12px 4px;}
.pt{height:4px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;border:1px solid rgba(255,255,255,.05);}
.pf{height:100%;background:linear-gradient(90deg,#8b3a3a,#d4af37);transition:width .5s ease-out;box-shadow:0 0 10px rgba(212,175,55,.3);}
.pl{display:flex;justify-content:space-between;font-size:.55rem;color:#8c8276;margin-top:2px;font-weight:600;}
.ba{z-index:5;flex:1;width:100%;max-width:600px;display:flex;align-items:center;justify-content:center;padding:2px;}
#board{display:grid;background:rgba(10,10,15,.4);border-radius:10px;padding:6px;border:1px solid rgba(212,175,55,.15);box-shadow:0 15px 40px rgba(0,0,0,.6), inset 0 0 30px rgba(0,0,0,.4);}

/* ============================================================
   СТИЛИ КУБИКОВ (ДОРАМНЫЕ МАТЕРИАЛЫ)
   Имитация камня, металла и эмали через сложные градиенты
   ============================================================ */

.c{
    position:relative;
    border-radius:12px; /* Более скругленные, как плитка маджонга */
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    /* Блик сверху для объема */
    box-shadow: 
        inset 1px 1px 2px rgba(255,255,255,0.4), 
        inset -1px -1px 3px rgba(0,0,0,0.5), 
        3px 5px 8px rgba(0,0,0,0.6);
    transition: transform 0.2s cubic-bezier(.4,1.8,.6,1);
    overflow:hidden;
    border: 1px solid rgba(255,255,255,0.1);
}

/* Эффект "стеклянного" блика поверх любого цвета */
.c::after{
    content:'';position:absolute;top:0;left:0;right:0;height:50%;
    background:linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
    border-radius:12px 12px 50% 50%;
    pointer-events:none;
}

/* --- ПАЛИТРА 1: КИНОВАРЬ И НЕФРИТ (Уровни 1, 6, 11...) --- */
/* 1. Киноварь (Красный камень) */
.pal-0-0 { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 50%, #922b21 100%); border-bottom: 2px solid #641e16; }
/* 2. Нефрит (Зеленый полудрагоценный) */
.pal-0-1 { background: linear-gradient(135deg, #58d68d 0%, #2ecc71 50%, #1e8449 100%); border-bottom: 2px solid #145a32; }
/* 3. Императорское золото (Матовое) */
.pal-0-2 { background: linear-gradient(135deg, #f4d03f 0%, #d4ac0d 50%, #9a7d0a 100%); border-bottom: 2px solid #7d6608; }
/* 4. Лазурь (Глубокий синий) */
.pal-0-3 { background: linear-gradient(135deg, #5dade2 0%, #3498db 50%, #21618c 100%); border-bottom: 2px solid #154360; }
/* 5. Аметист (Фиолетовый камень) */
.pal-0-4 { background: linear-gradient(135deg, #af7ac5 0%, #9b59b6 50%, #6c3483 100%); border-bottom: 2px solid #4a235a; }

/* --- ПАЛИТРА 2: ДИНАСТИЯ ТАН (Уровни 2, 7, 12...) --- */
/* 1. Терракота (Обожженная глина) */
.pal-1-0 { background: linear-gradient(135deg, #cd5c5c 0%, #a0522d 50%, #8b4513 100%); border-bottom: 2px solid #5e2f0d; }
/* 2. Бирюза (Минерал) */
.pal-1-1 { background: linear-gradient(135deg, #40e0d0 0%, #20b2aa 50%, #008b8b 100%); border-bottom: 2px solid #005f5f; }
/* 3. Серебро (Окисленный металл) */
.pal-1-2 { background: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 50%, #7f8c8d 100%); border-bottom: 2px solid #566573; color: #2c3e50 !important; }
/* 4. Индиго (Темная краска) */
.pal-1-3 { background: linear-gradient(135deg, #5d6d7e 0%, #34495e 50%, #17202a 100%); border-bottom: 2px solid #0b1014; }
/* 5. Охра (Желтая земля) */
.pal-1-4 { background: linear-gradient(135deg, #f5b041 0%, #d68910 50%, #9c640c 100%); border-bottom: 2px solid #6e4608; }

/* --- ПАЛИТРА 3: НЕБЕСНЫЙ ДВОРЕЦ (Уровни 3, 8, 13...) --- */
/* 1. Розовый кварц */
.pal-2-0 { background: linear-gradient(135deg, #ffb7b2 0%, #ff9a9e 50%, #fecfef 100%); border-bottom: 2px solid #d98880; }
/* 2. Малахит (Полосатый зеленый) */
.pal-2-1 { background: repeating-linear-gradient(45deg, #0bda51, #0bda51 10px, #09ad41 10px, #09ad41 20px); border-bottom: 2px solid #056b28; }
/* 3. Жемчуг (Белый перламутр) */
.pal-2-2 { background: radial-gradient(circle at 30% 30%, #ffffff, #f0f0f0, #dcdcdc); border-bottom: 2px solid #bdc3c7; color: #333 !important; }
/* 4. Сапфир (Королевский синий) */
.pal-2-3 { background: linear-gradient(135deg, #2e86de 0%, #104e8b 50%, #000080 100%); border-bottom: 2px solid #000050; }
/* 5. Коралл (Оранжево-красный) */
.pal-2-4 { background: linear-gradient(135deg, #ff7f50 0%, #ff6347 50%, #cd5c5c 100%); border-bottom: 2px solid #8b3a3a; }

/* --- ПАЛИТРА 4: ШЁЛКОВЫЙ ПУТЬ (Уровни 4, 9, 14...) --- */
/* 1. Гранат (Темно-красный) */
.pal-3-0 { background: linear-gradient(135deg, #c0392b 0%, #922b21 50%, #641e16 100%); border-bottom: 2px solid #3b120c; }
/* 3. Янтарь (Прозрачный оранжевый) */
.pal-3-2 { background: linear-gradient(135deg, #f39c12 0%, #d35400 50%, #a04000 100%); border-bottom: 2px solid #6e2c00; }
/* 4. Лазурит (Синий с золотом - упрощенно синий) */
.pal-3-3 { background: linear-gradient(135deg, #2980b9 0%, #1f618d 50%, #154360 100%); border-bottom: 2px solid #0e2f44; }
/* 5. Обсидиан (Черное стекло) */
.pal-3-4 { background: linear-gradient(135deg, #566573 0%, #2c3e50 50%, #17202a 100%); border-bottom: 2px solid #000; }
/* 2. Изумруд (Насыщенный зеленый) */
.pal-3-1 { background: linear-gradient(135deg, #27ae60 0%, #1e8449 50%, #145a32 100%); border-bottom: 2px solid #0b3b1f; }


/* --- ПАЛИТРА 5: ЛУННЫЙ СВЕТ (Уровни 5, 10, 15...) --- */
/* 1. Сакура (Нежно-розовый) */
.pal-4-0 { background: linear-gradient(135deg, #ffccd5 0%, #ffb7b2 50%, #ff9a9e 100%); border-bottom: 2px solid #d98880; color: #5d4037 !important; }
/* 2. Бамбук (Светло-зеленый) */
.pal-4-1 { background: linear-gradient(135deg, #a9dfbf 0%, #7dcea0 50%, #52be80 100%); border-bottom: 2px solid #27ae60; color: #1b4f72 !important; }
/* 3. Слоновая кость (Желтовато-белый) */
.pal-4-2 { background: linear-gradient(135deg, #fcf3cf 0%, #f9e79f 50%, #f7dc6f 100%); border-bottom: 2px solid #d4ac0d; color: #7d6608 !important; }
/* 4. Грозовое небо (Серо-синий) */
.pal-4-3 { background: linear-gradient(135deg, #85c1e9 0%, #5dade2 50%, #3498db 100%); border-bottom: 2px solid #21618c; }
/* 5. Сумерки (Темно-фиолетовый) */
.pal-4-4 { background: linear-gradient(135deg, #d7bde2 0%, #bb8fce 50%, #9b59b6 100%); border-bottom: 2px solid #6c3483; }


/* ============================================================
   ЭФФЕКТЫ БОНУСОВ (Поверх цвета плитки)
   ============================================================ */

/* 💥 БОМБА: Красное свечение + иконка */
.sp-bomb {
    box-shadow: 0 0 15px 2px rgba(231, 76, 60, 0.8), inset 0 0 10px rgba(255, 0, 0, 0.5) !important;
    animation: pulseRed 1.5s infinite;
}
.sp-bomb::before {
    content: '💣'; position: absolute; top: 2px; right: 2px; font-size: 1.2rem; z-index: 10;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
}

/* ⚡ ЛАЗЕР: Электрический разряд */
.sp-laser {
    box-shadow: 0 0 15px 2px rgba(46, 204, 113, 0.8), inset 0 0 10px rgba(0, 255, 0, 0.5) !important;
    animation: pulseGreen 1.5s infinite;
}
.sp-laser::before {
    content: '⚡'; position: absolute; top: 2px; right: 2px; font-size: 1.2rem; z-index: 10;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
}

/* ⭐ ЗВЕЗДА: Золотое сияние */
.sp-star {
    box-shadow: 0 0 15px 2px rgba(241, 196, 15, 0.8), inset 0 0 10px rgba(255, 215, 0, 0.5) !important;
    animation: pulseGold 1.5s infinite;
}
.sp-star::before {
    content: '⭐'; position: absolute; top: 2px; right: 2px; font-size: 1.2rem; z-index: 10;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
}

/* 🌈 РАДУГА: Вращающийся спектр */
.sp-rainbow {
    background: conic-gradient(from 0deg, #e74c3c, #f39c12, #f1c40f, #2ecc71, #3498db, #9b59b6, #e74c3c) !important;
    box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.6) !important;
    animation: spinRainbow 3s linear infinite;
}
.sp-rainbow::before {
    content: '🌈'; position: absolute; top: 2px; right: 2px; font-size: 1.2rem; z-index: 10;
}

@keyframes pulseRed { 0%, 100% { box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); } 50% { box-shadow: 0 0 25px rgba(231, 76, 60, 1); } }
@keyframes pulseGreen { 0%, 100% { box-shadow: 0 0 10px rgba(46, 204, 113, 0.5); } 50% { box-shadow: 0 0 25px rgba(46, 204, 113, 1); } }
@keyframes pulseGold { 0%, 100% { box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); } 50% { box-shadow: 0 0 25px rgba(241, 196, 15, 1); } }
@keyframes spinRainbow { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }

/* Текст внутри плиток */
.c .hz{font-size:1.6rem;font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.7), 0 0 5px rgba(255,255,255,0.3);z-index:2;line-height:1; margin-bottom: 2px;}
.c .py{font-size:.5rem;color:rgba(255,255,255,.9);z-index:2;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.8);margin-top:0;}
.c .ru{
    font-size:.5rem; font-weight:700; color:#fff;
    background:rgba(0,0,0,.4); padding:2px 6px; border-radius:4px;
    margin-top:2px; z-index:3; max-width:90%; text-align:center;
    border:1px solid rgba(255,255,255,0.1); backdrop-filter: blur(2px);
}
.c .emo{position:absolute;bottom:2px;left:3px;font-size:.6rem;opacity:.6;z-index:1;}

.c.sel{transform:scale(1.1);z-index:10;box-shadow:0 0 0 3px #d4af37, 0 15px 30px rgba(0,0,0,.6);}
.c.gone{animation:pop 0.3s forwards;}
@keyframes pop{to{transform:scale(0);opacity:0;}}
.c.drop{animation:drop 0.4s cubic-bezier(.175,.885,.32,1.275);}
@keyframes drop{from{transform:translateY(-50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.c.best{animation:pulseHint 1s infinite alternate;}
@keyframes pulseHint{from{filter:brightness(1);}to{filter:brightness(1.4);}}

/* Остальные стили интерфейса (бар, модалки) остаются без изменений для краткости, но они есть в полном коде */
.bar{z-index:10;width:100%;max-width:600px;display:flex;gap:4px;justify-content:center;padding:4px 8px;flex-wrap:wrap;}
.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:700;font-size:.7rem;cursor:pointer;color:#e8dcc5;background:rgba(30,30,35,.8);border:1px solid rgba(212,175,55,.3);display:flex;align-items:center;gap:4px;transition:.2s;backdrop-filter:blur(5px);}
.btn:active{transform:scale(.95);}
.btn.restart{background:rgba(212,175,55,.2);border-color:rgba(212,175,55,.5);color:#d4af37;}
.overlay{position:fixed;inset:0;background:rgba(5,5,10,.95);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.overlay.show{display:flex;}
.modal{background:linear-gradient(135deg,#1a1520,#0f0a15);border:1px solid rgba(212,175,55,.3);border-radius:16px;padding:30px;max-width:340px;width:90%;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.7);}
.modal h2{color:#d4af37;margin-bottom:10px;font-size:1.4rem;}
.modal p{font-size:.9rem;color:#a89f91;margin-bottom:20px;}
.modal button{background:linear-gradient(135deg,#8b3a3a,#5a2020);border:1px solid rgba(212,175,55,.4);padding:12px 30px;border-radius:8px;font-weight:bold;color:#f0e6d2;cursor:pointer;font-size:1rem;}

.jade-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-bottom: 20px; }
.jade-card { 
    border-radius: 10px; padding: 10px; display: flex; flex-direction: column; align-items: center; 
    opacity: 0; animation: jadePop 0.5s forwards; border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
.jade-card .jade-char { font-size: 2.5rem; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.jade-card .jade-py { font-size: 0.8rem; color: rgba(255,255,255,0.8); }
.jade-card .jade-ru { font-size: 0.7rem; color: #ffd700; font-weight: bold; }
@keyframes jadePop { to { opacity: 1; transform: translateY(0); } from { transform: translateY(20px); } }

</style>
</head>
<body>
<!-- HTML структура осталась прежней -->
<div class="bg" id="bg"></div>
<div class="hdr">
  <div><div class="logo">🀄 Ханзи</div><div class="rank" id="uRank">Новичок</div></div>
  <div class="stats">
    <div class="stat">⭐<b class="c-gold" id="uSc">0</b></div>
    <div class="stat"><b class="c-grn" id="uLv">1</b></div>
    <div class="stat">🪙<b class="c-cyan" id="uCoin">100</b></div>
    <div class="stat">💎<b class="c-pur" id="uCry">5</b></div>
    <div class="stat">🔄<b class="c-gold" id="uCircle">1</b></div>
  </div>
</div>
<div class="pw">
  <div class="pt"><div class="pf" id="pFill" style="width:0%"></div></div>
  <div class="pl"><span>Цель: <b id="uGl">800</b></span><span id="uTheme">Уровень 1</span></div>
</div>
<div class="ba"><div id="board"></div></div>
<div class="bar">
  <button class="btn" onclick="G.action('shuffle')">🔀 Перемешать</button>
  <button class="btn" onclick="G.action('hint')">💡 Подсказка</button>
  <button class="btn" onclick="G.action('bomb')">💥 Бомба (5💎)</button>
  <button class="btn restart" onclick="G.restart()"> Заново</button>
</div>

<div class="overlay" id="levelCompleteOverlay">
  <div class="modal">
    <h2>🏮 Уровень пройден!</h2>
    <div class="jade-grid" id="jadeGrid"></div>
    <button onclick="G.nextLevelFromModal()">Далее ➜</button>
  </div>
</div>

<script>
// === КОНФИГУРАЦИЯ ===
var NC=6, NR=8, TOT=NC*NR;
var DB = [
    ["人","rén","человек"],["大","dà","большой"],["小","xiǎo","маленький"],
    ["好","hǎo","хороший"],["水","shuǐ","вода"],["火","huǒ","огонь"],
    ["山","shān","гора"],["月","yuè","луна"],["日","rì","солнце"],
    ["花","huā","цветок"],["鱼","yú","рыба"],["鸟","niǎo","птица"],
    ["马","mǎ","лошадь"],["龙","lóng","дракон"],["风","fēng","ветер"],
    ["雨","yǔ","дождь"],["雪","xuě","снег"],["星","xīng","звезда"],
    ["心","xīn","сердце"],["手","shǒu","рука"],["车","chē","транспорт"],
    ["站","zhàn","станция"],["路","lù","дорога"],["网","wǎng","сеть"],
    ["思","sī","мысль"]
];
var LEVELS = [];
for(var i=0; i<Math.ceil(DB.length/5); i++) {
    var set = [];
    for(var j=0; j<5; j++) set.push({h:DB[(i*5+j)%DB.length][0], p:DB[(i*5+j)%DB.length][1], r:DB[(i*5+j)%DB.length][2]});
    LEVELS.push(set);
}

// === ЛОГИКА ЦВЕТОВ (ИСПРАВЛЕННАЯ) ===
// Формула: ((level - 1) % 25) дает число от 0 до 24.
// Делим на 5, чтобы получить индекс набора палитры (0-4).
function getPaletteSet(level) {
    return Math.floor((level - 1) % 25 / 5);
}

var state = { board:[], score:0, level:1, goal:800, coins:100, crystals:5, busy:false, sel:-1, combo:0, circle:1 };

function init() {
    startLevel();
    window.addEventListener('resize', calcSize);
    document.getElementById('board').addEventListener('pointerdown', onDown);
}

function startLevel() {
    state.score = 0; state.busy = false; state.sel = -1;
    state.circle = Math.floor((state.level - 1) / LEVELS.length) + 1;
    state.goal = 800 + (state.level * 150);
    
    // Обновляем фон страницы под стиль уровня
    var hue = (getPaletteSet(state.level) * 72) % 360;
    document.getElementById('bg').style.background = `radial-gradient(circle, hsl(${hue},20%,15%) 0%, #050505 100%)`;
    
    document.getElementById('uTheme').innerText = "Уровень " + state.level;
    document.getElementById('uCircle').innerText = state.circle;
    
    // Заполняем поле
    for(var i=0; i<TOT; i++) state.board[i] = randChar();
    // Убираем начальные совпадения (упрощенно)
    calcSize(); render(); updateUI();
}

function randChar() {
    var set = LEVELS[(state.level - 1) % LEVELS.length];
    var idx = Math.floor(Math.random() * set.length);
    var c = set[idx];
    
    // ВАЖНО: Цвет зависит от индекса иероглифа в наборе (0-4) и текущего набора палитры уровня
    var palSet = getPaletteSet(state.level);
    var colorClass = 'pal-' + palSet + '-' + idx;
    
    return {h:c.h, p:c.p, r:c.r, colorClass:colorClass, sp:null};
}

// === РЕНДЕРИНГ ===
function render() {
    var b=document.getElementById('board');
    b.innerHTML='';
    var fsH = Math.max(20, cellPx * 0.45);
    
    for(var i=0; i<TOT; i++) {
        var d=state.board[i];
        var el=document.createElement('div');
        el.className='c ' + (d ? d.colorClass : '');
        el.dataset.i=i;
        el.style.width=cellPx+'px'; el.style.height=cellPx+'px';
        
        if(i===state.sel) el.classList.add('sel');
        if(d && d.sp) el.classList.add('sp-'+d.sp);
        
        if(d) {
            el.innerHTML = `
                <span class="hz" style="font-size:${fsH}px">${d.h}</span>
                <span class="py">${d.p}</span>
                <span class="ru">${d.r}</span>
            `;
        }
        b.appendChild(el);
    }
}

// === ИГРОВАЯ ЛОГИКА (Упрощенная для примера) ===
function onDown(e) {
    if(state.busy) return;
    var t = e.touches?e.touches[0]:e;
    var el = document.elementFromPoint(t.clientX, t.clientY);
    while(el && el.id!=='board') { if(el.dataset.i) break; el=el.parentElement; }
    if(!el || !el.dataset.i) return;
    
    var i = parseInt(el.dataset.i);
    if(state.sel < 0) { state.sel = i; render(); }
    else if(state.sel === i) { state.sel = -1; render(); }
    else {
        // Простая проверка соседства
        var r1=Math.floor(state.sel/NC), c1=state.sel%NC, r2=Math.floor(i/NC), c2=i%NC;
        if(Math.abs(r1-r2)+Math.abs(c1-c2)===1) {
            swapTiles(state.sel, i);
            state.sel = -1;
        } else {
            state.sel = i; render();
        }
    }
}

function swapTiles(a, b) {
    state.busy = true;
    var temp = state.board[a]; state.board[a] = state.board[b]; state.board[b] = temp;
    render();
    
    // Проверка совпадений (заглушка для демонстрации цветов)
    setTimeout(() => {
        // Здесь должна быть логика поиска match-3
        // Для теста просто сбрасываем busy
        state.busy = false;
    }, 300);
}

// === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===
var cellPx=0;
function calcSize() {
    var ba=document.querySelector('.ba');
    var w=ba.clientWidth-10, h=ba.clientHeight-10;
    cellPx=Math.min((w-(NC-1)*4)/NC, (h-(NR-1)*4)/NR);
    var b=document.getElementById('board');
    b.style.gridTemplateColumns=`repeat(${NC}, ${cellPx}px)`;
    b.style.gridTemplateRows=`repeat(${NR}, ${cellPx}px)`;
    b.style.gap='4px';
    render();
}

function updateUI() {
    document.getElementById('uSc').innerText = state.score;
    document.getElementById('uLv').innerText = state.level;
    document.getElementById('uCoin').innerText = state.coins;
    document.getElementById('uCry').innerText = state.crystals;
    document.getElementById('uGl').innerText = state.goal;
}

var G = {
    action: function(type) { 
        if(type==='bomb' && state.crystals>=5) {
            state.crystals-=5;
            // Ставим бомбу на случайную плитку
            var idx = Math.floor(Math.random()*TOT);
            if(state.board[idx]) { state.board[idx].sp = 'bomb'; render(); }
            updateUI();
        }
    },
    nextLevelFromModal: function() {
        document.getElementById('levelCompleteOverlay').classList.remove('show');
        state.level++;
        startLevel();
    },
    restart: function() { state.level=1; startLevel(); }
};

init();
</script>
</body>
