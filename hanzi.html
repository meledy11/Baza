<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🀄 Ханзи: Живые Иероглифы</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#1a1a1a;color:#fff;touch-action:none;}
body{display:flex;flex-direction:column;align-items:center;}

/* Фоны */
.bg{position:fixed;inset:0;z-index:0;transition:background 1s ease;}
.bg.t1{background:linear-gradient(to bottom, #2c3e50, #000000);}
.bg.t2{background:linear-gradient(to bottom, #3a1c71, #d76d77);}
.bg.t3{background:linear-gradient(to bottom, #134e5e, #71b280);}
.bg.t4{background:linear-gradient(to bottom, #232526, #414345);}
.bg.t5{background:linear-gradient(to bottom, #1f1c2c, #928dab);}
.bg.t6{background:linear-gradient(to bottom, #0f2027, #203a43);}
.bg.t7{background:linear-gradient(to bottom, #3e5151, #decba4);}
.bg.t8{background:linear-gradient(to bottom, #141e30, #243b55);}

.hdr{z-index:10;width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:10px 15px;}
.logo-box{display:flex;flex-direction:column;}
.logo{font-size:1.2rem;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);}
.rank{font-size:.65rem;color:rgba(255,255,255,.6);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}

.stats{display:flex;gap:8px;}
.stat{background:rgba(255,255,255,.1);border-radius:20px;padding:5px 12px;font-size:.7rem;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.05);}
.stat b{font-size:.9rem;}
.c-gold{color:#ffd700;} .c-grn{color:#4cd137;} .c-cyan{color:#00d2d3;} .c-pur{color:#be2edd;}

.pw{z-index:10;width:100%;max-width:600px;padding:0 15px 10px;}
.pt{height:8px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden;}
.pf{height:100%;background:linear-gradient(90deg,#e1b12c,#44bd32);transition:width .5s ease-out;}
.pl{display:flex;justify-content:space-between;font-size:.65rem;color:rgba(255,255,255,.5);margin-top:4px;}

.ba{z-index:5;flex:1;width:100%;max-width:600px;display:flex;align-items:center;justify-content:center;padding:5px;perspective:1000px;}
#board{
    display:grid;
    background:rgba(0,0,0,.2);
    border-radius:12px;
    padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    transform-style:preserve-3d;
}

/* Кубики */
.c{
    position:relative;
    border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.1);
    box-shadow: inset 2px 2px 4px rgba(255,255,255,.2), inset -2px -2px 4px rgba(0,0,0,.2), 2px 2px 5px rgba(0,0,0,.3);
    transition: transform 0.25s cubic-bezier(.4,1.8,.6,1);
}
.c::after{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(to bottom, rgba(255,255,255,.15), transparent);border-radius:12px 12px 50% 50%;pointer-events:none;}

/* Цвета */
.t1 .c0{background:#ff6b6b;} .t1 .c1{background:#feca57;} .t1 .c2{background:#48dbfb;} .t1 .c3{background:#1dd1a1;} .t1 .c4{background:#5f27cd;} .t1 .c5{background:#ff9ff3;}
.t2 .c0{background:#e17055;} .t2 .c1{background:#fdcb6e;} .t2 .c2{background:#00cec9;} .t2 .c3{background:#55efc4;} .t2 .c4{background:#6c5ce7;} .t2 .c5{background:#fab1a0;}
.t3 .c0{background:#ff7675;} .t3 .c1{background:#ffeaa7;} .t3 .c2{background:#74b9ff;} .t3 .c3{background:#a29bfe;} .t3 .c4{background:#fd79a8;} .t3 .c5{background:#81ecec;}
.t4 .c0{background:#ff6b6b;} .t4 .c1{background:#feca57;} .t4 .c2{background:#48dbfb;} .t4 .c3{background:#1dd1a1;} .t4 .c4{background:#5f27cd;} .t4 .c5{background:#ff9ff3;}
.t5 .c0{background:#e17055;} .t5 .c1{background:#fdcb6e;} .t5 .c2{background:#00cec9;} .t5 .c3{background:#55efc4;} .t5 .c4{background:#6c5ce7;} .t5 .c5{background:#fab1a0;}
.t6 .c0{background:#ff7675;} .t6 .c1{background:#ffeaa7;} .t6 .c2{background:#74b9ff;} .t6 .c3{background:#a29bfe;} .t6 .c4{background:#fd79a8;} .t6 .c5{background:#81ecec;}
.t7 .c0{background:#ff6b6b;} .t7 .c1{background:#feca57;} .t7 .c2{background:#48dbfb;} .t7 .c3{background:#1dd1a1;} .t7 .c4{background:#5f27cd;} .t7 .c5{background:#ff9ff3;}
.t8 .c0{background:#e17055;} .t8 .c1{background:#fdcb6e;} .t8 .c2{background:#00cec9;} .t8 .c3{background:#55efc4;} .t8 .c4{background:#6c5ce7;} .t8 .c5{background:#fab1a0;}

.c.sp-bomb{border:2px solid #fff;box-shadow:0 0 15px rgba(255,255,255,.5);}
.c.sp-laser{border:2px solid #fff;box-shadow:0 0 15px rgba(255,255,255,.5);}
.c.sp-star{border:2px solid #fff;box-shadow:0 0 15px rgba(255,255,255,.5);}
.c.sp-rainbow{background:conic-gradient(#ff6b6b,#feca57,#48dbfb,#1dd1a1,#5f27cd)!important;}

.c .hz{font-size:1.6rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4);z-index:2;line-height:1;}
.c .py{font-size:.6rem;color:rgba(255,255,255,.9);margin-top:2px;z-index:2;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.c .ru{font-size:.6rem;font-weight:700;color:#fff;background:rgba(0,0,0,.3);padding:2px 6px;border-radius:6px;margin-top:3px;z-index:3;max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c .emo{position:absolute;bottom:3px;left:3px;font-size:.6rem;opacity:.5;z-index:1;}
.c .badge{position:absolute;top:2px;right:3px;font-size:.8rem;z-index:4;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}

.c.sel{transform:scale(1.1);z-index:10;box-shadow:0 0 0 3px #fff, 0 10px 20px rgba(0,0,0,.4);}
.c.gone{animation:pop 0.3s forwards;}
@keyframes pop{to{transform:scale(0);opacity:0;}}
.c.drop{animation:drop 0.5s cubic-bezier(.175,.885,.32,1.275);}
@keyframes drop{from{transform:translateY(-60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.c.best{animation:pulse 1.5s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.4);}70%{box-shadow:0 0 0 10px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}

.bar{z-index:10;width:100%;max-width:600px;display:flex;gap:8px;justify-content:center;padding:10px;}
.btn{padding:10px 16px;border:none;border-radius:20px;font-weight:700;font-size:.75rem;cursor:pointer;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:6px;transition:.2s;}
.btn:active{transform:scale(.95);}
.btn.buy{border-color:rgba(255,215,0,.5);color:#ffd700;}
.btn small{font-size:.6rem;opacity:.8;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#2d3436;border-radius:20px;padding:30px;max-width:340px;width:90%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5);}
.modal h2{color:#fff;margin-bottom:10px;}
.modal p{font-size:.9rem;color:#b2bec3;margin-bottom:20px;line-height:1.5;}
.modal button{background:#0984e3;border:none;padding:12px 30px;border-radius:25px;font-weight:bold;color:#fff;cursor:pointer;font-size:1rem;}

.fpts{position:absolute;pointer-events:none;z-index:50;font-weight:bold;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);animation:floatUp 1s forwards;}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-40px) scale(1.2);opacity:0;}}

/* Частицы эмодзи */
.particle{position:fixed;pointer-events:none;z-index:200;font-size:1.5rem;animation:fly 1s ease-out forwards;}
@keyframes fly{
    0%{transform:translate(0,0) scale(0.5);opacity:1;}
    100%{transform:translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot));opacity:0;}
}

.shake{animation:shake 0.4s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes shake{10%,90%{transform:translate3d(-1px,0,0);}20%,80%{transform:translate3d(2px,0,0);}30%,50%,70%{transform:translate3d(-4px,0,0);}40%,60%{transform:translate3d(4px,0,0);}}
</style>
</head>
<body>

<div class="bg t1" id="bg"></div>

<div class="hdr">
  <div class="logo-box">
    <div class="logo">🀄 Ханзи</div>
    <div class="rank" id="uRank">Новичок</div>
  </div>
  <div class="stats">
    <div class="stat">⭐<b class="c-gold" id="uSc">0</b></div>
    <div class="stat">🎯<b class="c-grn" id="uLv">1</b></div>
    <div class="stat">🪙<b class="c-cyan" id="uCoin">100</b></div>
    <div class="stat">💎<b class="c-pur" id="uCry">5</b></div>
  </div>
</div>

<div class="pw">
  <div class="pt"><div class="pf" id="pFill" style="width:0%"></div></div>
  <div class="pl"><span>Цель: <b id="uGl">800</b></span><span id="uTheme">Уровень 1</span></div>
</div>

<div class="ba"><div id="board" class="t1"></div></div>

<div class="bar">
  <button class="btn" id="bSh" onclick="G.action('shuffle')">🔀<span id="cSh">3</span><small>Беспл.</small></button>
  <button class="btn" id="bHi" onclick="G.action('hint')">💡<span id="cHi">3</span><small>Беспл.</small></button>
  <button class="btn" id="bBm" onclick="G.action('bomb')">💥<small>5💎</small></button>
  <button class="btn" onclick="G.showTut()">❓</button>
</div>

<div class="overlay" id="tov">
  <div class="modal">
    <h2>Добро пожаловать!</h2>
    <p>Собирайте 3+ одинаковых иероглифа.<br>При совпадении вылетают ассоциации!<br><br>Нажмите кнопку ниже, чтобы включить звук.</p>
    <button onclick="G.closeTut()">Начать игру</button>
  </div>
</div>

<script src="app.js"></script>
<script>
// === ЗВУКОВОЙ ДВИЖОК ===
var audioCtx = null;
function initAudio() {
    if(!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type, comboCount) {
    if(!audioCtx) return;
    var now = audioCtx.currentTime;
    
    if(type === 'swap') {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(600, now+0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now+0.1);
        osc.start(now); osc.stop(now+0.1);
    } else if(type === 'match') {
        // Мажорная пентатоника, тон повышается с комбо
        var baseFreq = 440 + (comboCount * 50); 
        var freqs = [baseFreq, baseFreq*1.25, baseFreq*1.5]; // C, E, G
        var f = freqs[Math.floor(Math.random()*freqs.length)];
        
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now+0.3);
        osc.start(now); osc.stop(now+0.3);
    } else if(type === 'bad') {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(100, now+0.15);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.01, now+0.15);
        osc.start(now); osc.stop(now+0.15);
    } else if(type === 'bonus') {
        [800, 1200, 1600].forEach((f, i) => {
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = f;
            g.gain.setValueAtTime(0.05, now + i*0.05);
            g.gain.linearRampToValueAtTime(0, now + i*0.05 + 0.2);
            o.start(now + i*0.05); o.stop(now + i*0.05 + 0.2);
        });
    } else if(type === 'win') {
        [523, 659, 784, 1046].forEach((f, i) => {
            var o = audioCtx.createOscillator();
            var g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.value = f;
            g.gain.setValueAtTime(0.1, now + i*0.1);
            g.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.4);
            o.start(now + i*0.1); o.stop(now + i*0.1 + 0.4);
        });
    }
}

// === КОНФИГУРАЦИЯ ===
var RANKS = ["Новичок","Ученик","Мастер","Эксперт","Гуру","Магистр","Мудрец","Император"];
var NC=6, NR=8, TOT=NC*NR;
var DB_FALLBACK = [
    [{h:"人",p:"rén",r:"человек",e:"👤"},{h:"大",p:"dà",r:"большой",e:"📏"},{h:"小",p:"xiǎo",r:"маленький",e:"🔬"},{h:"好",p:"hǎo",r:"хороший",e:"👍"},{h:"水",p:"shuǐ",r:"вода",e:"💧"}],
    [{h:"火",p:"huǒ",r:"огонь",e:"🔥"},{h:"山",p:"shān",r:"гора",e:"⛰️"},{h:"月",p:"yuè",r:"луна",e:"🌙"},{h:"日",p:"rì",r:"солнце",e:"🌞"},{h:"花",p:"huā",r:"цветок",e:"🌸"}],
    [{h:"鱼",p:"yú",r:"рыба",e:"🐟"},{h:"鸟",p:"niǎo",r:"птица",e:"🐦"},{h:"马",p:"mǎ",r:"лошадь",e:"🐴"},{h:"龙",p:"lóng",r:"дракон",e:"🐉"},{h:"风",p:"fēng",r:"ветер",e:"🌬️"}],
    [{h:"雨",p:"yǔ",r:"дождь",e:"🌧️"},{h:"雪",p:"xuě",r:"снег",e:"❄️"},{h:"星",p:"xīng",r:"звезда",e:"⭐"},{h:"心",p:"xīn",r:"сердце",e:"💖"},{h:"手",p:"shǒu",r:"рука",e:"✋"}]
];

var LEVELS = [];
if(typeof DB !== 'undefined' && DB.length > 0) {
    for(var i=0; i<Math.ceil(DB.length/5); i++) {
        var set = [];
        for(var j=0; j<5; j++) {
            var d = DB[(i*5+j)%DB.length];
            set.push({h:d[0], p:d[1], r:d[2], e:d[3]||'🀄'});
        }
        LEVELS.push(set);
    }
} else { LEVELS = DB_FALLBACK; }

var state = {
    board: [], score: 0, level: 1, goal: 800, 
    coins: 100, crystals: 5, 
    shufFree: 3, hintFree: 3,
    busy: false, sel: -1, combo: 0
};

var PRICE_HINT = 50, PRICE_SHUF = 80, PRICE_BOMB = 5;

// === ЛОГИКА ИГРЫ ===
function init() {
    loadProgress();
    updateUI();
    startLevel();
    window.addEventListener('resize', calcSize);
    
    var b = document.getElementById('board');
    b.addEventListener('pointerdown', onDown);
    b.addEventListener('pointermove', onMove);
    b.addEventListener('pointerup', onUp);
    document.body.addEventListener('pointerdown', initAudio, {once:true});
    
    if(state.level === 1 && state.score === 0) G.showTut();
}

function startLevel() {
    state.score = 0;
    state.goal = Math.floor(800 + (state.level * 150)); 
    state.board = [];
    state.busy = false;
    state.sel = -1;
    
    var themeIdx = (state.level - 1) % 8;
    document.getElementById('bg').className = 'bg t' + (themeIdx+1);
    document.getElementById('board').className = 't' + (themeIdx+1);
    document.getElementById('uTheme').innerText = "Уровень " + state.level;
    
    for(var i=0; i<TOT; i++) {
        do { state.board[i] = randChar(); } while(hasMatch(i));
    }
    if(!anyMove()) reshuffleBoard(true);
    
    calcSize();
    render();
    updateUI();
}

function randChar() {
    var set = LEVELS[(state.level-1) % LEVELS.length];
    var c = set[Math.floor(Math.random()*set.length)];
    return {h:c.h, p:c.p, r:c.r, e:c.e, c:set.indexOf(c), sp:null};
}

function hasMatch(idx) {
    var r=Math.floor(idx/NC), c=idx%NC, ch=state.board[idx].h;
    if(c>=2 && state.board[idx-1].h==ch && state.board[idx-2].h==ch) return true;
    if(r>=2 && state.board[idx-NC].h==ch && state.board[idx-2*NC].h==ch) return true;
    return false;
}

function findMatches() {
    var matched = {}, shapes = [];
    for(var r=0;r<NR;r++) for(var c=0;c<NC-2;c++) {
        var i=r*NC+c, ch=state.board[i].h, len=1;
        while(c+len<NC && state.board[i+len].h==ch) len++;
        if(len>=3) {
            var ids=[]; for(var k=0;k<len;k++) ids.push(i+k);
            shapes.push({ids:ids, type:len>=5?'star':len==4?'laser':'line', orient:'h'});
            ids.forEach(x=>matched[x]=true);
            c+=len-1;
        }
    }
    for(var c=0;c<NC;c++) for(var r=0;r<NR-2;r++) {
        var i=r*NC+c, ch=state.board[i].h, len=1;
        while(r+len<NR && state.board[i+len*NC].h==ch) len++;
        if(len>=3) {
            var ids=[]; for(var k=0;k<len;k++) ids.push(i+k*NC);
            shapes.push({ids:ids, type:len>=5?'star':len==4?'laser':'line', orient:'v'});
            ids.forEach(x=>matched[x]=true);
            r+=len-1;
        }
    }
    return {matched:Object.keys(matched).map(Number), shapes:shapes};
}

async function resolve(matches, shapes) {
    if(matches.length===0) { state.combo=0; checkWin(); return; }
    state.combo++;
    state.busy = true;
    
    playSound('match', state.combo);
    
    var pts = matches.length * 10 * state.combo;
    var coinsEarned = Math.floor(matches.length / 3);
    var cryEarned = 0;
    
    shapes.forEach(s => {
        if(s.type !== 'line') {
            var mid = s.ids[Math.floor(s.ids.length/2)];
            if(state.board[mid]) {
                state.board[mid].sp = s.type;
                pts += 50;
                if(s.type==='star') cryEarned++;
                playSound('bonus', 0);
            }
        }
    });
    
    state.score += pts;
    state.coins += coinsEarned;
    state.crystals += cryEarned;
    
    render();
    floatText(pts, matches[0]);
    
    // Эффект тряски при большом комбо
    if(state.combo > 2 || matches.length > 4) {
        document.getElementById('board').classList.add('shake');
        setTimeout(()=>document.getElementById('board').classList.remove('shake'), 400);
    }

    // Запуск ассоциативных эмодзи
    spawnParticles(matches);

    await sleep(350);
    
    matches.forEach(i => state.board[i] = null);
    applyGravity();
    render();
    await sleep(350);
    
    var next = findMatches();
    await resolve(next.matched, next.shapes);
}

function spawnParticles(indices) {
    // Берем первый элемент из матча, чтобы узнать какой эмодзи спавнить
    var firstIdx = indices[0];
    var charData = state.board[firstIdx];
    if(!charData) return;
    
    var emoji = charData.e;
    var count = Math.min(indices.length * 2, 12); // Количество частиц
    
    indices.forEach(idx => {
        var el = document.querySelectorAll('.c')[idx];
        if(!el) return;
        var rect = el.getBoundingClientRect();
        var cx = rect.left + rect.width/2;
        var cy = rect.top + rect.height/2;
        
        // Спавним по несколько частиц на каждую клетку (но не слишком много)
        if(Math.random() > 0.5) {
            createParticle(cx, cy, emoji);
        }
    });
}

function createParticle(x, y, emoji) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.innerText = emoji;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    
    // Случайное направление разлета
    var angle = Math.random() * Math.PI * 2;
    var dist = 50 + Math.random() * 100;
    var tx = Math.cos(angle) * dist + 'px';
    var ty = Math.sin(angle) * dist + 'px';
    var rot = (Math.random() - 0.5) * 360 + 'deg';
    
    p.style.setProperty('--tx', tx);
    p.style.setProperty('--ty', ty);
    p.style.setProperty('--rot', rot);
    
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
}

function applyGravity() {
    for(var c=0;c<NC;c++) {
        var w=NR-1;
        for(var r=NR-1;r>=0;r--) {
            var i=r*NC+c;
            if(state.board[i]) {
                if(w!==r) { state.board[w*NC+c]=state.board[i]; state.board[i]=null; }
                w--;
            }
        }
        while(w>=0) { state.board[w*NC+c]=randChar(); w--; }
    }
}

function checkWin() {
    state.busy = false;
    if(state.score >= state.goal) {
        playSound('win', 0);
        state.level++;
        state.shufFree = Math.min(state.shufFree+1, 5);
        state.hintFree = Math.min(state.hintFree+1, 5);
        state.crystals += 2;
        saveProgress();
        alert("Уровень пройден! +2 💎");
        startLevel();
    } else if(!anyMove()) {
        reshuffleBoard();
    }
    updateUI();
}

// === УПРАВЛЕНИЕ ===
var dragStart = -1, isDrag = false, startX=0, startY=0;

function getIdx(e) {
    var t = e.touches?e.touches[0]:e;
    var el = document.elementFromPoint(t.clientX, t.clientY);
    while(el && el.id!=='board') {
        if(el.dataset.i) return parseInt(el.dataset.i);
        el = el.parentElement;
    }
    return -1;
}

function onDown(e) {
    if(state.busy) return;
    initAudio();
    var i = getIdx(e);
    if(i<0) return;
    dragStart = i;
    startX = e.clientX; startY = e.clientY;
    isDrag = false;
    if(state.sel<0) { state.sel=i; render(); }
    else if(state.sel===i) { state.sel=-1; render(); }
    else if(isNeigh(state.sel, i)) { 
        trySwap(state.sel, i); 
        state.sel=-1; 
    }
    else { state.sel=i; render(); }
}

function onMove(e) { 
    if(dragStart>=0 && !state.busy) {
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if(Math.abs(dx)>20 || Math.abs(dy)>20) isDrag = true;
    }
}

async function onUp(e) { 
    if(isDrag && dragStart>=0 && !state.busy) {
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        var target = -1;
        var r = Math.floor(dragStart/NC), c = dragStart%NC;
        
        if(Math.abs(dx) > Math.abs(dy)) {
            if(dx>0 && c<NC-1) target = dragStart+1;
            else if(dx<0 && c>0) target = dragStart-1;
        } else {
            if(dy>0 && r<NR-1) target = dragStart+NC;
            else if(dy<0 && r>0) target = dragStart-NC;
        }
        
        if(target>=0) {
            state.sel = -1;
            await trySwap(dragStart, target);
        }
    }
    dragStart=-1; 
    isDrag=false;
}

function isNeigh(a,b) {
    var ra=Math.floor(a/NC), ca=a%NC, rb=Math.floor(b/NC), cb=b%NC;
    return Math.abs(ra-rb)+Math.abs(ca-cb)===1;
}

async function trySwap(a,b) {
    state.busy=true;
    playSound('swap', 0);
    
    var els = document.querySelectorAll('.c');
    var elA = els[a], elB = els[b];
    var rectA = elA.getBoundingClientRect();
    var rectB = elB.getBoundingClientRect();
    var dx = rectB.left - rectA.left;
    var dy = rectB.top - rectA.top;
    
    elA.style.transform = `translate(${dx}px, ${dy}px)`;
    elB.style.transform = `translate(${-dx}px, ${-dy}px)`;
    elA.style.zIndex = 100; elB.style.zIndex = 100;
    
    await sleep(250);
    
    var t=state.board[a]; state.board[a]=state.board[b]; state.board[b]=t;
    render(); 
    
    var res = findMatches();
    if(res.matched.length>0) {
        await resolve(res.matched, res.shapes);
    } else {
        playSound('bad', 0);
        t=state.board[a]; state.board[a]=state.board[b]; state.board[b]=t;
        render();
        els = document.querySelectorAll('.c');
        elA = els[a]; elB = els[b];
        elA.style.transform = `translate(${dx}px, ${dy}px)`;
        elB.style.transform = `translate(${-dx}px, ${-dy}px)`;
        await sleep(50);
        elA.style.transition = 'transform 0.2s'; elB.style.transition = 'transform 0.2s';
        elA.style.transform = ''; elB.style.transform = '';
        await sleep(200);
        state.busy=false;
    }
}

// === МАГАЗИН И КНОПКИ ===
var G = {
    action: function(type) {
        if(state.busy) return;
        initAudio();
        if(type==='shuffle') {
            if(state.shufFree>0) { state.shufFree--; reshuffleBoard(); playSound('swap', 0); }
            else if(state.coins>=PRICE_SHUF) { 
                if(confirm("Купить перемешивание за "+PRICE_SHUF+" 🪙?")) {
                    state.coins-=PRICE_SHUF; reshuffleBoard(); playSound('bonus', 0);
                }
            } else { alert("Не хватает монет!"); }
        }
        else if(type==='hint') {
            if(state.hintFree>0) { state.hintFree--; showHint(); playSound('swap', 0); }
            else if(state.coins>=PRICE_HINT) {
                if(confirm("Купить подсказку за "+PRICE_HINT+" 🪙?")) {
                    state.coins-=PRICE_HINT; showHint(); playSound('bonus', 0);
                }
            } else { alert("Не хватает монет!"); }
        }
        else if(type==='bomb') {
            if(state.crystals>=PRICE_BOMB) {
                if(confirm("Установить бомбу за "+PRICE_BOMB+" 💎?")) {
                    state.crystals-=PRICE_BOMB; placeBomb(); playSound('bonus', 0);
                }
            } else { alert("Не хватает кристаллов!"); }
        }
        updateUI();
    },
    showTut: ()=>document.getElementById('tov').classList.add('show'),
    closeTut: ()=>{
        document.getElementById('tov').classList.remove('show');
        initAudio();
    }
};

function showHint() {
    for(var i=0;i<TOT;i++) {
        var ns = [[0,1],[1,0]];
        for(var n of ns) {
            var r=Math.floor(i/NC)+n[0], c=i%NC+n[1];
            if(r<NR && c<NC) {
                var j=r*NC+c;
                var t=state.board[i]; state.board[i]=state.board[j]; state.board[j]=t;
                if(findMatches().matched.length>0) {
                    state.board[j]=state.board[i]; state.board[i]=t;
                    var els = document.querySelectorAll('.c');
                    els[i].classList.add('best'); els[j].classList.add('best');
                    setTimeout(()=>{els[i].classList.remove('best');els[j].classList.remove('best');},1500);
                    return;
                }
                state.board[j]=state.board[i]; state.board[i]=t;
            }
        }
    }
}

function placeBomb() {
    var idx = Math.floor(Math.random()*TOT);
    state.board[idx].sp = 'bomb';
    render();
    setTimeout(()=>{
        var area = [];
        for(var r=-1;r<=1;r++) for(var c=-1;c<=1;c++) {
            var ni = (Math.floor(idx/NC)+r)*NC + (idx%NC+c);
            if(ni>=0 && ni<TOT) area.push(ni);
        }
        resolve(area, []);
    }, 500);
}

function reshuffleBoard(silent) {
    var items = state.board.filter(x=>x);
    items.sort(()=>Math.random()-.5);
    var k=0;
    for(var i=0;i<TOT;i++) if(state.board[i]) state.board[i]=items[k++];
    if(!anyMove() && !silent) reshuffleBoard(true);
    if(!silent) { render(); updateUI(); }
}

function anyMove() {
    for(var i=0;i<TOT;i++) {
        var ns=[[0,1],[1,0]];
        for(var n of ns) {
            var r=Math.floor(i/NC)+n[0], c=i%NC+n[1];
            if(r<NR && c<NC) {
                var j=r*NC+c;
                var t=state.board[i]; state.board[i]=state.board[j]; state.board[j]=t;
                var ok=findMatches().matched.length>0;
                state.board[j]=state.board[i]; state.board[i]=t;
                if(ok) return true;
            }
        }
    }
    return false;
}

// === ОТРИСОВКА ===
var cellPx=0;
function calcSize() {
    var ba=document.querySelector('.ba');
    var w=ba.clientWidth-10, h=ba.clientHeight-10;
    var cw=(w-(NC-1)*5)/NC, ch=(h-(NR-1)*5)/NR;
    cellPx=Math.min(cw,ch);
    var b=document.getElementById('board');
    b.style.width=(cellPx*NC+(NC-1)*5+12)+'px';
    b.style.height=(cellPx*NR+(NR-1)*5+12)+'px';
    b.style.gridTemplateColumns=`repeat(${NC},${cellPx}px)`;
    b.style.gridTemplateRows=`repeat(${NR},${cellPx}px)`;
    b.style.gap='5px';
    render();
}

function render() {
    var b=document.getElementById('board');
    b.innerHTML='';
    var fsH=Math.max(16,cellPx*.45);
    var fsP=Math.max(9,cellPx*.16);
    var fsR=Math.max(9,cellPx*.15);
    
    for(var i=0;i<TOT;i++) {
        var d=state.board[i];
        var el=document.createElement('div');
        el.className='c c'+(d?d.c:0);
        el.dataset.i=i;
        el.style.width=cellPx+'px'; el.style.height=cellPx+'px';
        if(i===state.sel) el.classList.add('sel');
        
        if(d) {
            if(d.sp) el.classList.add('sp-'+d.sp);
            el.innerHTML=`
                <span class="hz" style="font-size:${fsH}px">${d.h}</span>
                <span class="py" style="font-size:${fsP}px">${d.p}</span>
                <span class="ru" style="font-size:${fsR}px">${d.r}</span>
                <span class="emo">${d.e}</span>
                ${d.sp?'<span class="badge">'+(d.sp=='bomb'?'💥':d.sp=='laser'?'⚡':'⭐')+'</span>':''}
            `;
        }
        b.appendChild(el);
    }
}

function updateUI() {
    document.getElementById('uSc').innerText=state.score;
    document.getElementById('uLv').innerText=state.level;
    document.getElementById('uCoin').innerText=state.coins;
    document.getElementById('uCry').innerText=state.crystals;
    document.getElementById('uGl').innerText=state.goal;
    document.getElementById('pFill').style.width=Math.min(100,state.score/state.goal*100)+'%';
    
    var rIdx = Math.min(RANKS.length-1, Math.floor((state.level-1)/5));
    document.getElementById('uRank').innerText = RANKS[rIdx];
    
    var bSh=document.getElementById('bSh');
    var bHi=document.getElementById('bHi');
    
    if(state.shufFree>0) {
        bSh.innerHTML=`🔀<span>${state.shufFree}</span><small>Беспл.</small>`;
        bSh.classList.remove('buy');
    } else {
        bSh.innerHTML=`🔀<small>${PRICE_SHUF}🪙</small>`;
        bSh.classList.add('buy');
    }
    
    if(state.hintFree>0) {
        bHi.innerHTML=`💡<span>${state.hintFree}</span><small>Беспл.</small>`;
        bHi.classList.remove('buy');
    } else {
        bHi.innerHTML=`💡<small>${PRICE_HINT}🪙</small>`;
        bHi.classList.add('buy');
    }
}

function floatText(txt, idx) {
    var el=document.querySelectorAll('.c')[idx];
    if(!el) return;
    var f=document.createElement('div');
    f.className='fpts'; f.innerText='+'+txt;
    f.style.left=el.offsetLeft+'px'; f.style.top=el.offsetTop+'px';
    f.style.fontSize=(cellPx*.35)+'px';
    document.getElementById('board').appendChild(f);
    setTimeout(()=>f.remove(),1000);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function saveProgress() {
    localStorage.setItem('hanzi_save', JSON.stringify({
        lvl:state.level, coins:state.coins, cry:state.crystals, 
        sf:state.shufFree, hf:state.hintFree
    }));
}
function loadProgress() {
    var s=localStorage.getItem('hanzi_save');
    if(s) {
        var d=JSON.parse(s);
        state.level=d.lvl||1; state.coins=d.coins||0; state.crystals=d.cry||0;
        state.shufFree=d.sf||3; state.hintFree=d.hf||3;
    }
}

init();
</script>
