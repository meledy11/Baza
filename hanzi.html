<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🀄 Ханзи Match-3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0f;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
body{display:flex;flex-direction:column;align-items:center;}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1s ease;}
.bg.t1{background:linear-gradient(135deg,#0a0a0f,#1a0a2e,#0f0f1a);}
.bg.t2{background:linear-gradient(135deg,#0a0a0f,#0a1a2e,#0f0f1a);}
.bg.t3{background:linear-gradient(135deg,#0a0a0f,#0a1a0a,#0f1a0f);}
.bg.t4{background:linear-gradient(135deg,#0a0a0f,#1a0a1a,#1a0f1a);}
.bg.t5{background:linear-gradient(135deg,#0a0a0f,#0a0a2e,#0f0f2a);}

.hdr{position:relative;z-index:10;width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;flex-shrink:0;}
.logo{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#ffd700,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px;}
.pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:4px 12px;font-size:.6rem;font-weight:600;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:4px;}
.pill b{font-size:.8rem;}.pill .g{color:#ffd700;}.pill .r{color:#ff6b6b;}.pill .gr{color:#2ecc71;}.pill .p{color:#a855f7;}.pill .o{color:#f59e0b;}

.pw{position:relative;z-index:10;width:100%;max-width:560px;padding:0 16px 8px;flex-shrink:0;}
.pt{height:6px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;background:linear-gradient(90deg,#ff6b6b,#ffd700,#2ecc71,#a855f7);box-shadow:0 0 30px rgba(255,215,0,.15);transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.pl{display:flex;justify-content:space-between;font-size:.55rem;color:rgba(255,255,255,.25);margin-top:3px;}

.ba{position:relative;z-index:5;flex:1;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;padding:6px 10px;overflow:hidden;}
#board{display:grid;background:rgba(255,255,255,.03);border-radius:20px;position:relative;touch-action:none;border:1px solid rgba(255,255,255,.04);box-shadow:0 20px 60px rgba(0,0,0,.5);}

.c{position:relative;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.15);}
.c::after{content:'';position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.06),transparent 55%);pointer-events:none;z-index:0;}

/* Более контрастные цвета для кубиков */
.t1 .c0{background:linear-gradient(150deg,#ff8a5a,#c44a2a);}.t1 .c1{background:linear-gradient(150deg,#ffd94a,#c49a2a);}.t1 .c2{background:linear-gradient(150deg,#5aff5a,#2a8a3a);}.t1 .c3{background:linear-gradient(150deg,#5a8aff,#2a4a8a);}.t1 .c4{background:linear-gradient(150deg,#c08aff,#5a2a8a);}.t1 .c5{background:linear-gradient(150deg,#5acaca,#2a6a6a);}
.t2 .c0{background:linear-gradient(150deg,#aaaaff,#4a4a8a);}.t2 .c1{background:linear-gradient(150deg,#aaffaa,#4a7a4a);}.t2 .c2{background:linear-gradient(150deg,#7aaaff,#2a5a8a);}.t2 .c3{background:linear-gradient(150deg,#ffaaaa,#6a4a4a);}.t2 .c4{background:linear-gradient(150deg,#aa7aff,#4a2a7a);}.t2 .c5{background:linear-gradient(150deg,#7aaaaa,#2a5a5a);}
.t3 .c0{background:linear-gradient(150deg,#ff6b6b,#cc3333);}.t3 .c1{background:linear-gradient(150deg,#ffd93d,#cca800);}.t3 .c2{background:linear-gradient(150deg,#6bff6b,#33cc33);}.t3 .c3{background:linear-gradient(150deg,#6bb5ff,#3388cc);}.t3 .c4{background:linear-gradient(150deg,#c084fc,#8844cc);}.t3 .c5{background:linear-gradient(150deg,#ff6bff,#cc33cc);}
.t4 .c0{background:linear-gradient(150deg,#aa4a5a,#6a2a3a);}.t4 .c1{background:linear-gradient(150deg,#aa7a4a,#6a3a2a);}.t4 .c2{background:linear-gradient(150deg,#4a8a5a,#2a5a3a);}.t4 .c3{background:linear-gradient(150deg,#4a5a8a,#2a3a5a);}.t4 .c4{background:linear-gradient(150deg,#8a4a9a,#4a2a5a);}.t4 .c5{background:linear-gradient(150deg,#4a8a8a,#2a4a4a);}
.t5 .c0{background:linear-gradient(150deg,#f5b0b0,#d07070);}.t5 .c1{background:linear-gradient(150deg,#f5d0a0,#d0a070);}.t5 .c2{background:linear-gradient(150deg,#a0d0a0,#70a070);}.t5 .c3{background:linear-gradient(150deg,#a0b0d0,#7080a0);}.t5 .c4{background:linear-gradient(150deg,#c0a0d0,#9080a0);}.t5 .c5{background:linear-gradient(150deg,#a0d0d0,#70a0a0);}

.c.sp-bomb{background:radial-gradient(circle at 30% 30%,#ff4444,#aa1818)!important;border:2px solid #ffd700!important;animation:bPulse 1s ease infinite alternate;}
@keyframes bPulse{from{box-shadow:0 0 15px rgba(255,215,0,.1);}to{box-shadow:0 0 45px rgba(255,215,0,.4);}}
.c.sp-laser{background:radial-gradient(circle at 30% 30%,#9a5add,#5522aa)!important;border:2px solid #aa88ee!important;animation:lPulse 1s ease infinite alternate;}
@keyframes lPulse{from{box-shadow:0 0 15px rgba(170,136,238,.1);}to{box-shadow:0 0 45px rgba(170,136,238,.4);}}
.c.sp-star{background:radial-gradient(circle at 30% 30%,#44dd88,#118844)!important;border:2px solid #88eebb!important;animation:sPulse 1s ease infinite alternate;}
@keyframes sPulse{from{box-shadow:0 0 15px rgba(136,238,187,.1);}to{box-shadow:0 0 45px rgba(136,238,187,.4);}}
.c.sp-rainbow{background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bff6b,#6bb5ff,#c084fc)!important;border:2px solid #ffd700!important;animation:rPulse .8s ease infinite alternate;}
@keyframes rPulse{from{box-shadow:0 0 20px rgba(255,215,0,.1);}to{box-shadow:0 0 60px rgba(255,215,0,.5);}}

/* Увеличенный контрастный текст */
.c .hz{font-weight:900;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7),0 0 4px rgba(0,0,0,.3);z-index:1;pointer-events:none;}
.c .py{color:rgba(255,255,255,.7);font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6);z-index:1;pointer-events:none;margin-top:1px;font-size:.55rem;}
.c .ru{color:rgba(255,255,255,.8);font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6);background:rgba(0,0,0,.3);padding:0 6px;border-radius:4px;z-index:1;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;font-size:.5rem;}
.c .badge{position:absolute;top:2px;right:3px;z-index:2;pointer-events:none;text-shadow:0 0 12px rgba(0,0,0,.8);font-size:.65rem;}
.c .emo{position:absolute;bottom:2px;left:4px;opacity:.5;z-index:2;pointer-events:none;font-size:.55rem;}

.c.sel{transform:scale(1.12);z-index:6;box-shadow:0 0 0 3px #ffd700,0 0 40px rgba(255,215,0,.3);}
.c.drag{transform:scale(1.18)!important;z-index:20!important;box-shadow:0 0 0 4px #ffd700,0 12px 50px rgba(0,0,0,.4)!important;}
.c.best{z-index:8;animation:hintPulse .8s ease-in-out infinite alternate;border:2px solid #2ecc71!important;}
@keyframes hintPulse{from{box-shadow:0 0 10px rgba(46,204,113,.2);transform:scale(1);}to{box-shadow:0 0 35px rgba(46,204,113,.5);transform:scale(1.06);}}
.c.shape-hl{z-index:7;animation:shapeFlash .6s ease-out forwards;border:2px solid #fff!important;}
@keyframes shapeFlash{0%{box-shadow:0 0 0 0 rgba(255,255,255,0);transform:scale(1);}50%{box-shadow:0 0 40px 10px rgba(255,255,255,0.6);transform:scale(1.12);filter:brightness(1.5);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);transform:scale(1);}}

.c.gone{animation:popOut .45s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes popOut{0%{transform:scale(1);opacity:1;}30%{transform:scale(1.4) rotate(6deg);box-shadow:0 0 60px rgba(255,215,0,.6);}100%{transform:scale(0) rotate(20deg);opacity:0;}}
.c.boom{animation:boomAnim .5s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes boomAnim{0%{transform:scale(1);opacity:1;}30%{transform:scale(2.2) rotate(10deg);box-shadow:0 0 80px rgba(255,80,0,.7);}100%{transform:scale(0) rotate(30deg);opacity:0;}}
.c.lhit{animation:lHit .45s ease forwards;pointer-events:none;}
@keyframes lHit{0%{transform:scale(1);opacity:1;}100%{transform:scaleX(0) rotate(45deg);opacity:0;}}
.c.shit{animation:sHit .55s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes sHit{0%{transform:scale(1);opacity:1;}40%{transform:scale(2) rotate(180deg);opacity:1;}100%{transform:scale(0) rotate(360deg);opacity:0;}}
.c.rhit{animation:rHit .65s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes rHit{0%{transform:scale(1) rotate(0);opacity:1;}30%{transform:scale(1.6) rotate(60deg);}60%{transform:scale(1.9) rotate(-30deg);}100%{transform:scale(0) rotate(120deg);opacity:0;}}
.c.drop{animation:dropIn var(--dd,.3s) cubic-bezier(.22,1.4,.36,1) forwards;}
@keyframes dropIn{0%{transform:translateY(var(--dy,-70px)) scale(.4) rotate(-8deg);opacity:0;}65%{transform:translateY(8px) scale(1.06);opacity:1;}85%{transform:translateY(-3px) scale(.98);}100%{transform:translateY(0) scale(1);opacity:1;}}
.c.swp{transition:transform .28s cubic-bezier(.34,1.56,.64,1);z-index:12;}
.c.shk{animation:shkA .38s ease;}
@keyframes shkA{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px) rotate(-2deg);}40%{transform:translateX(7px) rotate(2deg);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.c.empty{visibility:hidden;pointer-events:none;}

.salute{position:fixed;pointer-events:none;z-index:200;animation:salFly var(--dur,1.2s) ease forwards;}
@keyframes salFly{0%{transform:translate(0,0) scale(0) rotate(0);opacity:0;}20%{opacity:1;transform:translate(var(--t1x,0),var(--t1y,-40px)) scale(1.3) rotate(60deg);}80%{opacity:.8;}100%{transform:translate(var(--t2x,0),var(--t2y,-100px)) scale(.4) rotate(360deg);opacity:0;}}
.rain{position:fixed;pointer-events:none;z-index:150;opacity:.35;animation:rainF var(--rd,2s) ease-in forwards;}
@keyframes rainF{0%{transform:translateY(-40px) rotate(0) scale(.5);opacity:0;}10%{opacity:.35;}100%{transform:translateY(105vh) rotate(360deg) scale(.4);opacity:0;}}
.fpts{position:absolute;font-weight:700;pointer-events:none;z-index:90;color:#ffd700;text-shadow:0 0 18px rgba(255,215,0,.8),0 2px 8px #000;animation:fpu .9s ease forwards;white-space:nowrap;}
@keyframes fpu{0%{transform:translateY(0) scale(.4);opacity:1;}60%{transform:translateY(-50px) scale(1.15);opacity:1;}100%{transform:translateY(-80px) scale(.9);opacity:0;}}
#cmb{position:fixed;top:20%;left:50%;transform:translateX(-50%);font-weight:700;pointer-events:none;z-index:300;color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,.7),0 3px 15px #000;display:none;white-space:nowrap;}
#cmb.show{display:block;animation:cmbF 1.15s ease forwards;}
@keyframes cmbF{0%{transform:translate(-50%,30px) scale(.3);opacity:0;}25%{transform:translate(-50%,-8px) scale(1.3);opacity:1;}100%{transform:translate(-50%,-75px) scale(.85);opacity:0;}}
#streak{position:fixed;top:14%;left:50%;transform:translateX(-50%);font-weight:700;pointer-events:none;z-index:280;padding:6px 20px;border-radius:14px;background:rgba(0,0,0,.8);border:1px solid rgba(255,215,0,.2);display:none;white-space:nowrap;}
#streak.show{display:block;animation:stF 1.4s ease forwards;}
@keyframes stF{0%{transform:translate(-50%,40px) scale(.5);opacity:0;}18%{transform:translate(-50%,0) scale(1.1);opacity:1;}75%{opacity:1;}100%{transform:translate(-50%,-90px) scale(1);opacity:0;}}

.bar{position:relative;z-index:10;width:100%;max-width:560px;display:flex;gap:6px;justify-content:center;padding:6px 12px 12px;flex-shrink:0;flex-wrap:wrap;}
.btn{padding:8px 14px;border:none;border-radius:12px;font-weight:700;font-size:.7rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;touch-action:manipulation;color:#f0e8d8;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.08);}
.btn:active{transform:scale(.92);}
.btn.bb{background:rgba(60,100,180,.2);border-color:rgba(60,100,180,.15);}
.btn.bb:hover{background:rgba(60,100,180,.3);}
.btn.bg{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.15);color:#ffd700;}
.btn.bg:hover{background:rgba(255,215,0,.2);}
.btn.br{background:rgba(180,80,60,.2);border-color:rgba(180,80,60,.15);}
.btn.br:hover{background:rgba(180,80,60,.3);}
.btn.bp{background:rgba(120,80,160,.2);border-color:rgba(120,80,160,.15);color:#c084fc;}
.btn.bp:hover{background:rgba(120,80,160,.3);}
.btn.bgr{background:rgba(80,160,120,.2);border-color:rgba(80,160,120,.15);color:#80ed99;}
.btn.bgr:hover{background:rgba(80,160,120,.3);}
.btn .cnt{background:rgba(0,0,0,.3);padding:0 6px;border-radius:6px;font-size:.6rem;}
.btn.off{opacity:.25;pointer-events:none;}

.tov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:450;padding:20px;}
.tov.show{display:flex;}
.tc{background:linear-gradient(150deg,rgba(26,20,46,.98),rgba(20,20,40,.98));border-radius:24px;padding:28px 24px;max-width:400px;width:100%;border:1px solid rgba(255,255,255,.06);color:#e8d5b7;box-shadow:0 30px 80px rgba(0,0,0,.8);}
.tc h2{font-size:1.3rem;margin-bottom:8px;text-align:center;font-weight:800;color:#ffd700;}
.tc .step{font-size:.85rem;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:5px;}
.tc .hl{color:#ffd700;font-weight:700;}
.tc .ebig{font-size:3rem;text-align:center;display:block;margin:6px 0;}
.tc .dots{display:flex;gap:8px;justify-content:center;margin:12px 0;}
.tc .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1);transition:background .3s;}
.tc .dot.on{background:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.3);}
.tc .demo{display:flex;gap:4px;justify-content:center;padding:8px 0;flex-wrap:wrap;}
.tc .dc{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);}
.tc .dc.on{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.25);}
.tc .dc.hl{background:rgba(255,215,0,.3);border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.2);}
.tc .bn{padding:12px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd700,#f59e0b);color:#1a1a2e;font-size:.9rem;cursor:pointer;width:100%;margin-top:12px;font-weight:800;transition:transform .2s;}
.tc .bn:active{transform:scale(.95);}
.tc .bn:hover{transform:scale(1.02);}
.tc .bsk{padding:8px;border:none;background:none;color:rgba(255,255,255,.2);font-size:.7rem;cursor:pointer;width:100%;margin-top:4px;}
.tc .bsk:hover{color:rgba(255,255,255,.4);}
@media(max-width:360px){.c{border-radius:10px;}}
</style>
</head>
<body>
<div class="bg t1" id="bg"></div>
<div class="hdr">
  <div class="logo">🀄 Ханзи</div>
  <div class="pills">
    <div class="pill">⭐<b class="g" id="uSc">0</b></div>
    <div class="pill">🔥<b class="r" id="uCo">0</b></div>
    <div class="pill">🎯<b class="gr" id="uLv">1</b></div>
    <div class="pill">💎<b class="p" id="uSp">0</b></div>
    <div class="pill">📦<b class="o" id="uSet">Набор 1/120</b></div>
  </div>
</div>
<div class="pw">
  <div class="pt"><div class="pf" id="pFill" style="width:0%"></div></div>
  <div class="pl"><span>🎯 <b id="uGl">200</b></span><span id="uHz">🔥 0</span></div>
</div>
<div class="ba"><div id="board" class="t1"></div></div>
<div class="bar">
  <button class="btn bb" id="bSh" onclick="G.shuffle()">🔀<span class="cnt" id="cSh">3</span></button>
  <button class="btn bg" id="bHi" onclick="G.hint()">💡<span class="cnt" id="cHi">5</span></button>
  <button class="btn bp" onclick="G.useBomb()">💥<span class="cnt" id="cBm">0</span></button>
  <button class="btn bgr" onclick="G.showTut()">📖</button>
  <button class="btn br" onclick="G.newGame()">🔄</button>
</div>
<div id="cmb"></div>
<div id="streak"></div>

<!-- Модальное окно обучения -->
<div class="tov" id="tov">
  <div class="tc">
    <span class="ebig" id="tEm">🎯</span>
    <h2 id="tTi">Как играть?</h2>
    <div id="tSt"></div>
    <div class="demo" id="tDemo"></div>
    <div class="dots" id="tDots"></div>
    <button class="bn" id="tBtn" onclick="G.tutNext()">Дальше ➡️</button>
    <button class="bsk" onclick="G.closeTut()">Пропустить</button>
  </div>
</div>

<script src="app.js"></script>
<script>
// ============================================================
//  ГЕНЕРАЦИЯ УРОВНЕЙ ИЗ app.js (по 5 иероглифов)
// ============================================================
if (typeof DB === 'undefined' || DB.length === 0) {
    console.error('❌ app.js не загружен! Используем встроенную базу.');
    var ALL_LEVELS = [
        [{h:"人",p:"rén",r:"человек",e:"👤"},{h:"大",p:"dà",r:"большой",e:"📏"},{h:"小",p:"xiǎo",r:"маленький",e:"🔬"},{h:"好",p:"hǎo",r:"хороший",e:"👍"},{h:"水",p:"shuǐ",r:"вода",e:"💧"}],
        [{h:"火",p:"huǒ",r:"огонь",e:"🔥"},{h:"山",p:"shān",r:"гора",e:"⛰️"},{h:"月",p:"yuè",r:"луна",e:"🌙"},{h:"日",p:"rì",r:"солнце",e:"🌞"},{h:"花",p:"huā",r:"цветок",e:"🌸"}],
        [{h:"鱼",p:"yú",r:"рыба",e:"🐟"},{h:"鸟",p:"niǎo",r:"птица",e:"🐦"},{h:"马",p:"mǎ",r:"лошадь",e:"🐴"},{h:"龙",p:"lóng",r:"дракон",e:"🐉"},{h:"风",p:"fēng",r:"ветер",e:"🌬️"}],
        [{h:"雨",p:"yǔ",r:"дождь",e:"🌧️"},{h:"雪",p:"xuě",r:"снег",e:"❄️"},{h:"星",p:"xīng",r:"звезда",e:"⭐"},{h:"心",p:"xīn",r:"сердце",e:"💖"},{h:"手",p:"shǒu",r:"рука",e:"✋"}],
        [{h:"口",p:"kǒu",r:"рот",e:"👄"},{h:"目",p:"mù",r:"глаз",e:"👁️"},{h:"耳",p:"ěr",r:"ухо",e:"👂"},{h:"金",p:"jīn",r:"золото",e:"🥇"},{h:"木",p:"mù",r:"дерево",e:"🌳"}]
    ];
} else {
    console.log('✅ Используем базу из app.js: ' + DB.length + ' иероглифов');
    var ALL_LEVELS = [];
    var CHARS_PER_SET = 5;
    var totalLevels = Math.floor(DB.length / CHARS_PER_SET);
    for (var setIdx = 0; setIdx < totalLevels; setIdx++) {
        var set = [];
        for (var i = 0; i < CHARS_PER_SET; i++) {
            var idx = (setIdx * CHARS_PER_SET + i) % DB.length;
            var item = DB[idx];
            set.push({
                h: item[0],
                p: item[1],
                r: item[2],
                e: item[3] || '🀄'
            });
        }
        ALL_LEVELS.push(set);
    }
    console.log('✅ Создано ' + ALL_LEVELS.length + ' уровней по ' + CHARS_PER_SET + ' иероглифов');
}

// ============================================================

function getCharsForLevel(lvl) {
    var idx = (lvl - 1) % ALL_LEVELS.length;
    return ALL_LEVELS[idx];
}

function getCurrentChars() {
    return getCharsForLevel(level);
}

function randomChar() {
    var chars = getCurrentChars();
    var idx = Math.floor(Math.random() * chars.length);
    var d = chars[idx];
    return { h: d.h, p: d.p, r: d.r, e: d.e, c: idx % NCOLORS, sp: null };
}

function sleep(ms) {
    return new Promise(function(ok) { setTimeout(ok, ms); });
}

function getNeighbors(idx) {
    var r = Math.floor(idx / NC);
    var c = idx % NC;
    var res = [];
    if (r > 0) res.push(idx - NC);
    if (r < NR - 1) res.push(idx + NC);
    if (c > 0) res.push(idx - 1);
    if (c < NC - 1) res.push(idx + 1);
    return res;
}

function getAllNeighbors(idx) {
    var r = Math.floor(idx / NC);
    var c = idx % NC;
    var res = [];
    for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            var nr = r + dr;
            var nc = c + dc;
            if (nr >= 0 && nr < NR && nc >= 0 && nc < NC) {
                res.push(nr * NC + nc);
            }
        }
    }
    return res;
}

function isNeighbor(a, b) {
    var n = getNeighbors(a);
    for (var i = 0; i < n.length; i++) {
        if (n[i] === b) return true;
    }
    return false;
}

// ============================================================
//  ПОИСК КОМБИНАЦИЙ (ВСЕ ФОРМЫ: L, T, квадраты, 4/5/6 в ряд)
// ============================================================
function findAllCombinations(bd) {
    var results = [];
    var used = {};
    
    // Горизонтальные (3+ в ряд)
    for (var r = 0; r < NR; r++) {
        for (var c = 0; c <= NC - 3; c++) {
            var i = r * NC + c;
            var ch = bd[i] ? bd[i].h : null;
            if (!ch) continue;
            var len = 1;
            while (c + len < NC && bd[i + len] && bd[i + len].h === ch) len++;
            if (len >= 3) {
                var ids = [];
                for (var k = 0; k < len; k++) ids.push(i + k);
                var key = ids.join('-');
                if (!used[key]) {
                    used[key] = true;
                    results.push({
                        ids: ids,
                        len: len,
                        type: len >= 6 ? '6line' : len >= 5 ? '5line' : len === 4 ? '4line' : '3line',
                        orient: 'h'
                    });
                }
            }
            c += len - 1;
        }
    }
    
    // Вертикальные (3+ в ряд)
    for (var c = 0; c < NC; c++) {
        for (var r = 0; r <= NR - 3; r++) {
            var i = r * NC + c;
            var ch = bd[i] ? bd[i].h : null;
            if (!ch) continue;
            var len = 1;
            while (r + len < NR && bd[i + len * NC] && bd[i + len * NC].h === ch) len++;
            if (len >= 3) {
                var ids = [];
                for (var k = 0; k < len; k++) ids.push(i + k * NC);
                var key = ids.join('-');
                if (!used[key]) {
                    used[key] = true;
                    results.push({
                        ids: ids,
                        len: len,
                        type: len >= 6 ? '6line' : len >= 5 ? '5line' : len === 4 ? '4line' : '3line',
                        orient: 'v'
                    });
                }
            }
            r += len - 1;
        }
    }
    
    // L и T формы (5 клеток)
    for (var r = 0; r < NR - 2; r++) {
        for (var c = 0; c < NC - 2; c++) {
            var patterns = [
                { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c, (r+2)*NC+c], t: 'L' },
                { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2], t: 'L' },
                { ids: [r*NC+c, (r+1)*NC+c, (r+2)*NC+c, (r+2)*NC+c+1, (r+2)*NC+c+2], t: 'L' },
                { ids: [r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2, (r+2)*NC+c, (r+2)*NC+c+1], t: 'L' },
                { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c+1, (r+2)*NC+c+1], t: 'T' },
                { ids: [(r+2)*NC+c, (r+2)*NC+c+1, (r+2)*NC+c+2, (r+1)*NC+c+1, r*NC+c+1], t: 'T' },
                { ids: [r*NC+c, (r+1)*NC+c, (r+2)*NC+c, (r+1)*NC+c+1, (r+1)*NC+c+2], t: 'T' },
                { ids: [r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2, (r+1)*NC+c+1, (r+1)*NC+c], t: 'T' }
            ];
            for (var p = 0; p < patterns.length; p++) {
                var ids = patterns[p].ids;
                var ch = bd[ids[0]] ? bd[ids[0]].h : null;
                if (!ch) continue;
                var ok = true;
                for (var j = 0; j < ids.length; j++) {
                    if (!bd[ids[j]] || bd[ids[j]].h !== ch) {
                        ok = false;
                        break;
                    }
                }
                if (ok) {
                    var key = ids.join('-');
                    if (!used[key]) {
                        used[key] = true;
                        results.push({ ids: ids, len: 5, type: patterns[p].t, orient: patterns[p].t });
                    }
                }
            }
        }
    }
    
    // Квадраты 2x2 (4 клетки)
    for (var r = 0; r < NR - 1; r++) {
        for (var c = 0; c < NC - 1; c++) {
            var ids = [r*NC+c, r*NC+c+1, (r+1)*NC+c, (r+1)*NC+c+1];
            var ch = bd[ids[0]] ? bd[ids[0]].h : null;
            if (!ch) continue;
            var ok = true;
            for (var j = 0; j < ids.length; j++) {
                if (!bd[ids[j]] || bd[ids[j]].h !== ch) {
                    ok = false;
                    break;
                }
            }
            if (ok) {
                var key = ids.join('-');
                if (!used[key]) {
                    used[key] = true;
                    results.push({ ids: ids, len: 4, type: 'square', orient: 'square' });
                }
            }
        }
    }
    
    return results;
}

function getBooster(shape) {
    var map = {
        '4line': { name: 'laser', emoji: '⚡', label: 'ЛАЗЕР' },
        '5line': { name: 'star', emoji: '⭐', label: 'ЗВЕЗДА' },
        '6line': { name: 'rainbow', emoji: '🌈', label: 'РАДУГА' },
        'L': { name: 'bomb', emoji: '💥', label: 'БОМБА' },
        'T': { name: 'laser', emoji: '⚡', label: 'ЛАЗЕР' },
        'square': { name: 'bomb', emoji: '💥', label: 'БОМБА' }
    };
    return map[shape.type] || null;
}

function findMatches(bd) {
    var allShapes = findAllCombinations(bd);
    var matched = {};
    var shapes = [];
    
    for (var i = 0; i < allShapes.length; i++) {
        var shape = allShapes[i];
        var ids = shape.ids;
        
        // Проверяем наличие бомбы в комбинации
        var hasBomb = false;
        for (var j = 0; j < ids.length; j++) {
            if (bd[ids[j]] && bd[ids[j]].sp === 'bomb') {
                hasBomb = true;
                break;
            }
        }
        
        if (hasBomb) {
            var bombIdx = -1;
            for (var j = 0; j < ids.length; j++) {
                if (bd[ids[j]] && bd[ids[j]].sp === 'bomb') {
                    bombIdx = ids[j];
                    break;
                }
            }
            if (bombIdx >= 0) {
                var neighbors = getAllNeighbors(bombIdx);
                for (var j = 0; j < neighbors.length; j++) {
                    matched[neighbors[j]] = true;
                }
                matched[bombIdx] = true;
            }
        } else {
            for (var j = 0; j < ids.length; j++) {
                matched[ids[j]] = true;
            }
            shapes.push(shape);
        }
    }
    
    var matchedArr = [];
    for (var key in matched) {
        matchedArr.push(parseInt(key));
    }
    return { matched: matchedArr, shapes: shapes };
}

function anyMove(bd) {
    for (var i = 0; i < TOT; i++) {
        if (!bd[i]) continue;
        var ns = getNeighbors(i);
        for (var j = 0; j < ns.length; j++) {
            var ni = ns[j];
            if (!bd[ni]) continue;
            var temp = bd[i];
            bd[i] = bd[ni];
            bd[ni] = temp;
            var result = findMatches(bd);
            var temp2 = bd[i];
            bd[i] = bd[ni];
            bd[ni] = temp2;
            if (result.matched.length > 0) return [i, ni];
        }
    }
    return null;
}

// Находит лучший ход (учитывает сложные формы)
function bestMove(bd) {
    var best = null;
    var bestScore = -1;
    for (var i = 0; i < TOT; i++) {
        if (!bd[i]) continue;
        var ns = getNeighbors(i);
        for (var j = 0; j < ns.length; j++) {
            var ni = ns[j];
            if (!bd[ni]) continue;
            var temp = bd[i];
            bd[i] = bd[ni];
            bd[ni] = temp;
            var result = findMatches(bd);
            var temp2 = bd[i];
            bd[i] = bd[ni];
            bd[ni] = temp2;
            if (result.matched.length > 0) {
                var sc = result.matched.length * 10;
                for (var k = 0; k < result.shapes.length; k++) {
                    var sh = result.shapes[k];
                    sc += sh.len * 20;
                    var booster = getBooster(sh);
                    if (booster) sc += 200;
                    if (sh.type === 'L' || sh.type === 'T') sc += 100;
                    if (sh.type === 'square') sc += 80;
                    if (sh.type === '5line') sc += 150;
                    if (sh.type === '6line') sc += 250;
                }
                if (sc > bestScore) {
                    bestScore = sc;
                    best = [i, ni];
                }
            }
        }
    }
    return best;
}

function hasMatchAt(bd, idx) {
    var r = Math.floor(idx / NC);
    var c = idx % NC;
    var ch = bd[idx] ? bd[idx].h : null;
    if (!ch) return false;
    if (c >= 2 && bd[idx-1] && bd[idx-2] && bd[idx-1].h === ch && bd[idx-2].h === ch) return true;
    if (r >= 2 && bd[idx-NC] && bd[idx-2*NC] && bd[idx-NC].h === ch && bd[idx-2*NC].h === ch) return true;
    return false;
}

function initBoard() {
    board = [];
    levelComplete = false;
    victoryShown = false;
    for (var i = 0; i < TOT; i++) {
        var att = 0;
        do {
            board[i] = randomChar();
            att++;
        } while (hasMatchAt(board, i) && att < 300);
    }
    reshuffleAttempts = 0;
    while (!anyMove(board) && reshuffleAttempts < 10) {
        reshuffleAttempts++;
        reshuffle(true);
    }
    if (!anyMove(board)) {
        for (var i = 0; i < TOT; i++) board[i] = randomChar();
        if (!anyMove(board)) {
            board = [];
            for (var i = 0; i < TOT; i++) {
                board[i] = randomChar();
                while (hasMatchAt(board, i)) board[i] = randomChar();
            }
        }
    }
    applyTheme();
    updateUI();
}

function reshuffle(skipCheck) {
    var items = [];
    for (var i = 0; i < TOT; i++) {
        if (board[i]) items.push(board[i]);
    }
    for (var i = items.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = items[i];
        items[i] = items[j];
        items[j] = t;
    }
    var k = 0;
    for (var i = 0; i < TOT; i++) {
        if (board[i]) {
            board[i] = items[k++];
            board[i].sp = null;
        }
    }
    for (var i = 0; i < TOT; i++) {
        if (!board[i]) board[i] = randomChar();
        var att = 0;
        while (hasMatchAt(board, i) && att < 300) {
            board[i] = randomChar();
            att++;
        }
    }
    if (!skipCheck && !anyMove(board)) {
        if (reshuffleAttempts < 10) {
            reshuffleAttempts++;
            reshuffle(false);
        } else {
            for (var i = 0; i < TOT; i++) board[i] = randomChar();
        }
    }
}

function calcSize() {

    var bh = bw * NR / NC;
    if (bh > wh) {
        bh = wh;
        bw = bh * NC / NR;
    }
    var cw = Math.floor((bw - PAD * 2 - GAP * (NC - 1)) / NC);
    var ch = Math.floor((bh - PAD * 2 - GAP * (NR - 1)) / NR);
    cellPx = Math.min(cw, ch);
    var bEl = document.getElementById('board');
    bEl.style.width = (cellPx * NC + GAP * (NC - 1) + PAD * 2) + 'px';
    bEl.style.height = (cellPx * NR + GAP * (NR - 1) + PAD * 2) + 'px';
    bEl.style.gridTemplateColumns = 'repeat(' + NC + ',' + cellPx + 'px)';
    bEl.style.gridTemplateRows = 'repeat(' + NR + ',' + cellPx + 'px)';
    bEl.style.gap = GAP + 'px';
    bEl.style.padding = PAD + 'px';
}

var actx = null;
function snd(f, d, tp, v, dl) {
    try {
        if (!actx) actx = new(window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        var t = actx.currentTime + (dl || 0);
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = tp || 'sine';
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(v || 0.06, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + (d || 0.1));
        o.connect(g);
        g.connect(actx.destination);
        o.start(t);
        o.stop(t + (d || 0.1));
    } catch (e) {}
}

function sndMatch(n) {
    for (var i = 0; i < Math.min(n, 7); i++) {
        snd(460 + i * 65, 0.09, i % 2 ? 'triangle' : 'sine', 0.06, i * 0.035);
    }
}

function activateBomb(idx) {
    sndBoom();
    var removed = {};
    removed[idx] = true;
    var neighbors = getAllNeighbors(idx);
    for (var i = 0; i < neighbors.length; i++) {
        removed[neighbors[i]] = true;
    }
    var cells = document.querySelectorAll('.c');
    for (var key in removed) {
        var ki = parseInt(key);
        if (cells[ki]) cells[ki].classList.add('boom');
    }
    salute(idx, ['💥', '🔥', '🌟', '✨']);
    var pts = Object.keys(removed).length * 15 + 50;
    score += pts;
    floatPts(idx, pts);
    showStreak('💥 БОМБА! +' + pts, '#ff6b6b');
    return removed;
}

function activateLaser(idx, orient) {
    sndSpec();
    var r = Math.floor(idx / NC);
    var c = idx % NC;
    var removed = {};
    removed[idx] = true;
    var cells = document.querySelectorAll('.c');
    if (orient === 'h' || !orient) {
        for (var i = 0; i < NC; i++) {
            var id = r * NC + i;
            removed[id] = true;
            if (cells[id]) cells[id].classList.add('lhit');
        }
    }
    if (orient === 'v' || !orient) {
        for (var i = 0; i < NR; i++) {
            var id = i * NC + c;
            removed[id] = true;
            if (cells[id]) cells[id].classList.add('lhit');
        }
    }
    salute(idx, ['⚡', '✨', '💥']);
    var pts = Object.keys(removed).length * 12 + 45;
    score += pts;
    floatPts(idx, pts);
    showStreak('⚡ ЛАЗЕР! +' + pts, '#aa88ee');
    return removed;
}

function activateStar(idx) {
    sndSpec();
    var ch = board[idx] ? board[idx].h : null;
    if (!ch) return {};
    var removed = {};
    removed[idx] = true;
    var cells = document.querySelectorAll('.c');
    for (var i = 0; i < TOT; i++) {
        if (i !== idx && board[i] && board[i].h === ch) {
            removed[i] = true;
            if (cells[i]) cells[i].classList.add('shit');
        }
    }
    if (cells[idx]) cells[idx].classList.add('shit');
    salute(idx, ['⭐', '🌟', '✨', '💫', '🌈']);
    var pts = Object.keys(removed).length * 18 + 65;
    score += pts;
    floatPts(idx, pts);
    showStreak('⭐ ЗВЕЗДА! +' + pts, '#88eebb');
    return removed;
}

function activateRainbow(idx) {
    sndSpec();
    var colors = {};
    for (var i = 0; i < TOT; i++) {
        if (i !== idx && board[i]) {
            var h = board[i].h;
            if (!colors[h]) colors[h] = [];
            colors[h].push(i);
        }
    }
    var best = null;
    var bestN = 0;
    for (var h in colors) {
        if (colors[h].length > bestN) {
            bestN = colors[h].length;
            best = h;
        }
    }
    var removed = {};
    removed[idx] = true;
    var cells = document.querySelectorAll('.c');
    if (best) {
        for (var j = 0; j < colors[best].length; j++) {
            var id = colors[best][j];
            removed[id] = true;
            if (cells[id]) cells[id].classList.add('rhit');
        }
    }
    if (cells[idx]) cells[idx].classList.add('rhit');
    salute(idx, ['🌈', '✨', '⭐', '💫', '🌟', '🎆']);
    rainEmojis(window.innerWidth / 2, window.innerHeight / 3, 25, ['🌈', '✨', '⭐', '💫']);
    var pts = Object.keys(removed).length * 20 + 90;
    score += pts;
    floatPts(idx, pts);
    showStreak('🌈 РАДУГА! +' + pts, '#ffd700');
    return removed;
}

function activateSpecial(idx, sp) {
    if (sp === 'bomb') return activateBomb(idx);
    if (sp === 'laser') return activateLaser(idx, board[idx] ? board[idx].lOrient || 'h' : 'h');
    if (sp === 'star') return activateStar(idx);
    if (sp === 'rainbow') return activateRainbow(idx);
    return null;
}

function activateCombo(idx1, idx2) {
    var sp1 = board[idx1] ? board[idx1].sp : null;
    var sp2 = board[idx2] ? board[idx2].sp : null;
    if (!sp1 || !sp2) return null;
    sndBoom();
    sndSpec();
    var removed = {};
    var cells = document.querySelectorAll('.c');
    
    if (sp1 === 'bomb' && sp2 === 'bomb') {
        for (var i = 0; i < TOT; i++) removed[i] = true;
        showStreak('💥💥 МЕГА ВЗРЫВ!', '#ff4444');
        rainEmojis(window.innerWidth / 2, window.innerHeight / 3, 45, ['💥', '🔥', '✨', '⭐']);
    } else if ((sp1 === 'bomb' && sp2 === 'laser') || (sp1 === 'laser' && sp2 === 'bomb')) {
        var bombIdx = sp1 === 'bomb' ? idx1 : idx2;
        var r = Math.floor(bombIdx / NC);
        var c = bombIdx % NC;
        for (var dr = -1; dr <= 1; dr++) {
            var rr = r + dr;
            if (rr >= 0 && rr < NR) {
                for (var i = 0; i < NC; i++) removed[rr * NC + i] = true;
            }
        }
        for (var dc = -1; dc <= 1; dc++) {
            var cc = c + dc;
            if (cc >= 0 && cc < NC) {
                for (var i = 0; i < NR; i++) removed[i * NC + cc] = true;
            }
        }
        showStreak('💥⚡ КРЕСТ ОГНЯ!', '#ff8800');
    } else if ((sp1 === 'bomb' && sp2 === 'star') || (sp1 === 'star' && sp2 === 'bomb')) {
        var starIdx = sp1 === 'star' ? idx1 : idx2;
        var ch = board[starIdx] ? board[starIdx].h : null;
        for (var i = 0; i < TOT; i++) {
            if (board[i] && board[i].h === ch) {
                removed[i] = true;
                var rr = Math.floor(i / NC);
                var cc = i % NC;
                for (var dr = -1; dr <= 1; dr++) {
                    for (var dc = -1; dc <= 1; dc++) {
                        var nr = rr + dr;
                        var nc = cc + dc;
                        if (nr >= 0 && nr < NR && nc >= 0 && nc < NC) {
                            removed[nr * NC + nc] = true;
                        }
                    }
                }
            }
        }
        showStreak('💥⭐ ЗВЁЗДНЫЙ ВЗРЫВ!', '#ffaa00');
    } else if (sp1 === 'laser' && sp2 === 'laser') {
        var r1 = Math.floor(idx1 / NC);
        var c1 = idx1 % NC;
        var r2 = Math.floor(idx2 / NC);
        var c2 = idx2 % NC;
        for (var i = 0; i < NC; i++) {
            removed[r1 * NC + i] = true;
            removed[r2 * NC + i] = true;
        }
        for (var i = 0; i < NR; i++) {
            removed[i * NC + c1] = true;
            removed[i * NC + c2] = true;
        }
        showStreak('⚡⚡ ДВОЙНОЙ ЛАЗЕР!', '#aa44ff');
    } else if ((sp1 === 'laser' && sp2 === 'star') || (sp1 === 'star' && sp2 === 'laser')) {
        var starIdx2 = sp1 === 'star' ? idx1 : idx2;
        var ch2 = board[starIdx2] ? board[starIdx2].h : null;
        for (var i = 0; i < TOT; i++) {
            if (board[i] && board[i].h === ch2) removed[i] = true;
        }
        var r3 = Math.floor(idx1 / NC);
        var c3 = idx1 % NC;
        for (var i = 0; i < NC; i++) removed[r3 * NC + i] = true;
        for (var i = 0; i < NR; i++) removed[i * NC + c3] = true;
        showStreak('⚡⭐ ЛАЗЕРНАЯ ЗВЕЗДА!', '#88ddff');
    } else if (sp1 === 'star' && sp2 === 'star') {
        var ch1 = board[idx1] ? board[idx1].h : null;
        var ch2 = board[idx2] ? board[idx2].h : null;
        for (var i = 0; i < TOT; i++) {
            if (board[i] && (board[i].h === ch1 || board[i].h === ch2)) {
                removed[i] = true;
            }
        }
        showStreak('⭐⭐ ДВОЙНАЯ ЗВЕЗДА!', '#44ffaa');
    } else if (sp1 === 'rainbow' || sp2 === 'rainbow') {
        var other = sp1 === 'rainbow' ? idx2 : idx1;
        var ch3 = board[other] ? board[other].h : null;
        if (ch3) {
            for (var i = 0; i < TOT; i++) {
                if (board[i] && board[i].h === ch3) removed[i] = true;
            }
        }
        showStreak('🌈 РАДУГА+!', '#ffd700');
    } else {
        var r4 = Math.floor(idx1 / NC);
        var c4 = idx1 % NC;
        var r5 = Math.floor(idx2 / NC);
        var c5 = idx2 % NC;
        for (var dr = -1; dr <= 1; dr++) {
            for (var dc = -1; dc <= 1; dc++) {
                var nr1 = r4 + dr;
                var nc1 = c4 + dc;
                if (nr1 >= 0 && nr1 < NR && nc1 >= 0 && nc1 < NC) {
                    removed[nr1 * NC + nc1] = true;
                }
                var nr2 = r5 + dr;
                var nc2 = c5 + dc;
                if (nr2 >= 0 && nr2 < NR && nc2 >= 0 && nc2 < NC) {
                    removed[nr2 * NC + nc2] = true;
                }
            }
        }
        showStreak('✨ КОМБО!', '#ffd700');
    }
    
    for (var key in removed) {

        if (cells[ki]) cells[ki].classList.add('boom');

    salute(idx1, ['💥', '⚡', '⭐', '🌈', '✨']);

    var pts = Object.keys(removed).length * 18 + 120;
    score += pts;
    floatPts(idx1, pts);

}

function updateStreak() {
    streak++;
    if (streak > maxStreak) maxStreak = streak;
    var mult = 1;
    var bonus = 0;
    var text = '';
    var color = '#ffd700';
    if (streak >= 7) {
        mult = 5;
        bonus = 80;
        text = '🔥 СУПЕР СТРЕЙК ×5!';
        color = '#ff4444';
        sndStreak();
        rainEmojis(window.innerWidth / 2, window.innerHeight / 3, 30, ['🔥', '⚡', '💥', '🌟']);
    } else if (streak >= 5) {
        mult = 3;
        bonus = 50;
        text = '🔥 СТРЕЙК ×3!';
        color = '#ff8800';
        sndStreak();
        rainEmojis(window.innerWidth / 2, window.innerHeight / 3, 15, ['🔥', '⚡', '✨']);
    } else if (streak >= 3) {
        mult = 2;
        bonus = 25;
        text = '🔥 СТРЕЙК ×2!';
        color = '#ffaa00';
        sndStreak();
    }
    if (text) showStreak(text, color);
    if (bonus > 0) {
        score += bonus;
        floatPts(Math.floor(Math.random() * TOT), bonus);
    }
    return mult;
}

function gravity() {
    var fall = {};
    for (var c = 0; c < NC; c++) {
        var w = NR - 1;
        for (var r = NR - 1; r >= 0; r--) {
            var i = r * NC + c;
            if (board[i] !== null) {
                var wi = w * NC + c;
                if (w !== r) {
                    board[wi] = board[i];
                    board[i] = null;
                    fall[wi] = true;
                }
                w--;
            }
        }
    }
    return fall;
}

function fillEmpty() {
    for (var i = 0; i < TOT; i++) {
        if (board[i] === null) {
            board[i] = randomChar();
        }
    }
}

async function animSwap(a, b) {
    var cells = document.querySelectorAll('.c');
    var ea = cells[a];
    var eb = cells[b];
    if (!ea || !eb) return;
    ea.classList.add('swp');
    eb.classList.add('swp');
    var ra = ea.getBoundingClientRect();
    var rb = eb.getBoundingClientRect();
    var dx = rb.left - ra.left;
    var dy = rb.top - ra.top;
    ea.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    eb.style.transform = 'translate(' + (-dx) + 'px,' + (-dy) + 'px)';
    await sleep(280);
    ea.style.transform = '';
    eb.style.transform = '';
    ea.classList.remove('swp');
    eb.classList.remove('swp');
}

function shakeCell(i) {
    var el = document.querySelectorAll('.c')[i];
    if (!el) return;
    el.classList.add('shk');
    setTimeout(function() { el.classList.remove('shk'); }, 400);
}

async function resolveWithShapes(initRes, mult) {
    await resolveLoop(initRes.matched, initRes.shapes, {}, mult);
}

async function resolveLoop(matched, shapes, newBoosters, mult) {
    mult = mult || 1;
    while (matched && matched.length > 0) {
        if (levelComplete || victoryShown) return;
        combo++;
        var n = matched.length;
        var cells = document.querySelectorAll('.c');
        var isComplexShape = false;
        if (shapes) {
            for (var si = 0; si < shapes.length; si++) {
                var t = shapes[si].type;
                if (t === 'L' || t === 'T' || t === 'square') {
                    isComplexShape = true;
                    for (var k = 0; k < shapes[si].ids.length; k++) {
                        var id = shapes[si].ids[k];
                        if (cells[id]) cells[id].classList.add('shape-hl');
                    }
                }
            }
        }
        var pts = (n * 10 + (combo - 1) * 15 + (n >= 5 ? 30 : n >= 4 ? 15 : 0)) * mult;
        if (shapes) {
            for (var si = 0; si < shapes.length; si++) {
                if (shapes[si].type === 'L' || shapes[si].type === 'T') pts += 25;
                if (shapes[si].len >= 5) pts += 30;
                if (shapes[si].type === 'square') pts += 20;
            }
        }
        pts = Math.floor(pts);
        score += pts;
        sndMatch(n);
        if (combo >= 2) {
            sndCombo(combo);
            showCombo(combo);
        }
        var mid = matched[Math.floor(matched.length / 2)];
        floatPts(mid, pts);
        var allRemoved = {};
        for (var mi = 0; mi < matched.length; mi++) {
            var idx = matched[mi];
            var d = board[idx];
            if (d && d.sp && !newBoosters[idx] && !allRemoved[idx]) {
                var rem = activateSpecial(idx, d.sp);
                if (rem) {
                    for (var key in rem) allRemoved[key] = true;
                }
            }
        }
        for (var mi = 0; mi < matched.length; mi++) {
            var idx = matched[mi];
            if (allRemoved[idx]) continue;
            var d = board[idx];
            if (!d) continue;
            if (!newBoosters[idx]) {
                allRemoved[idx] = true;
                if (cells[idx]) cells[idx].classList.add('gone');
                if (d.e && cells[idx]) {
                    var rect = cells[idx].getBoundingClientRect();
                    (function(em, x, y) {
                        setTimeout(function() {
                            var s = document.createElement('div');
                            s.className = 'salute';
                            s.textContent = em;
                            s.style.fontSize = '18px';
                            s.style.left = x + 'px';
                            s.style.top = y + 'px';
                            s.style.setProperty('--t1x', ((Math.random() - 0.5) * 80) + 'px');
                            s.style.setProperty('--t1y', (-40 - Math.random() * 60) + 'px');
                            s.style.setProperty('--t2x', ((Math.random() - 0.5) * 120) + 'px');
                            s.style.setProperty('--t2y', (-80 - Math.random() * 80) + 'px');
                            s.style.setProperty('--dur', (0.8 + Math.random() * 0.5) + 's');
                            document.body.appendChild(s);
                            setTimeout(function() { s.remove(); }, 1400);
                        }, 50);
                    })(d.e, rect.left + rect.width / 2 - 9, rect.top + rect.height / 2 - 9);
                }
            }
        }
        await sleep(isComplexShape ? 600 : 440);
        if (levelComplete || victoryShown) return;
        for (var key in allRemoved) board[parseInt(key)] = null;
        newBoosters = {};
        var fall = gravity();
        fillEmpty();
        render(fall);
        updateUI();
        await sleep(380);
        if (levelComplete || victoryShown) return;
        if (score >= goal) {
            checkWinCondition();
            return;
        }
        var newRes = findMatches(board);
        matched = newRes.matched;
        shapes = newRes.shapes;
        if (shapes && shapes.length > 0) {
            for (var si = 0; si < shapes.length; si++) {
                var sh = shapes[si];
                var booster = getBooster(sh);
                if (!booster) continue;
                var midIdx = sh.ids[Math.floor(sh.ids.length / 2)];
                if (board[midIdx] && !board[midIdx].sp) {
                    board[midIdx].sp = booster.name;
                    if (booster.name === 'laser') board[midIdx].lOrient = sh.orient;
                    newBoosters[midIdx] = true;
                    specials++;
                    sndSpec();
                    var emos = { bomb: ['💥', '🔥'], laser: ['⚡', '✨'], star: ['⭐', '🌟'], rainbow: ['🌈', '✨'] };
                    salute(midIdx, emos[booster.name] || ['✨']);
                    showStreak(booster.emoji + ' ' + booster.label + '!', '#ffd700');
                }
            }
            if (Object.keys(newBoosters).length > 0) {
                render();
                updateUI();
                await sleep(380);
            }
        }
    }
}

async function resolveAll(mult) {
    var result = findMatches(board);
    await resolveLoop(result.matched, result.shapes, {}, mult);
}

// ============================================================
//  ДЕЙСТВИЯ ПОЛЬЗОВАТЕЛЯ
// ============================================================
function doShuffle() {
    if (busy || levelComplete || nShuf <= 0) return;
    nShuf--;
    sndShuf();
    reshuffle();
    render();
    updateUI();
    showStreak('🔀 ПЕРЕМЕШАНО!', '#88aaff');
}

function doHint() {
    if (busy || levelComplete || nHint <= 0) return;
    
    // Сначала проверяем, есть ли сложные формы (L, T, квадраты)
    var currentShapes = findAllCombinations(board);
    var complexFound = false;
    var cells = document.querySelectorAll('.c');
    
    for (var i = 0; i < currentShapes.length; i++) {
        var t = currentShapes[i].type;
        if (t === 'L' || t === 'T' || t === 'square' || t === 'cross' || t === '5line' || t === '6line') {
            complexFound = true;
            for (var k = 0; k < currentShapes[i].ids.length; k++) {
                var id = currentShapes[i].ids[k];
                if (cells[id]) {
                    cells[id].classList.add('best');
                    (function(nd) {
                        setTimeout(function() { nd.classList.remove('best'); }, 2500);
                    })(cells[id]);
                }
            }
        }
    }
    
    if (complexFound) {
        nHint--;
        sndShuf();
        showStreak('💡 СМОТРИ ФОРМУ!', '#ffd700');
        updateUI();
        return;
    }
    
    // Иначе показываем лучший ход
    var mv = bestMove(board);
    if (!mv) {
        showStreak('😅 Нет доступных ходов!', '#ff6b6b');
        return;
    }
    
    nHint--;
    sndShuf();
    for (var i = 0; i < mv.length; i++) {
        var el = cells[mv[i]];
        if (el) {
            el.classList.add('best');
            (function(nd) {
                setTimeout(function() { nd.classList.remove('best'); }, 2500);
            })(el);
        }
    }
    showStreak('💡 ЛУЧШИЙ ХОД!', '#2ecc71');
    updateUI();
}

function doUseBomb() {
    if (busy || levelComplete || nBomb <= 0) return;
    nBomb--;
    var valid = [];
    for (var i = 0; i < TOT; i++) {
        if (board[i] && !board[i].sp) valid.push(i);
    }
    if (!valid.length) return;
    var idx = valid[Math.floor(Math.random() * valid.length)];
    board[idx].sp = 'bomb';
    specials++;
    salute(idx, ['💥', '🔥', '✨']);
    render();
    updateUI();
    showStreak('💥 БОМБА УСТАНОВЛЕНА!', '#ff6b6b');
}

// ============================================================
//  ОСНОВНАЯ ЛОГИКА ОБМЕНА
// ============================================================
async function trySwap(a, b) {
    if (busy || levelComplete || !isNeighbor(a, b)) return;
    busy = true;
    sel = -1;
    sndSwap();
    var spA = board[a] ? board[a].sp : null;
    var spB = board[b] ? board[b].sp : null;
    await animSwap(a, b);
    
    // Комбо спец-способностей
    if (spA && spB) {
        var removed = activateCombo(a, b);
        if (removed) {
            moves++;
            combo = 0;
            var mult = updateStreak();
            await sleep(480);
            for (var key in removed) board[parseInt(key)] = null;
            var fall = gravity();
            fillEmpty();
            render(fall);
            updateUI();
            await sleep(380);
            await resolveAll(mult);
            busy = false;
            updateUI();
            checkWinCondition();
            if (!levelComplete && !anyMove(board)) { reshuffle(); render(); }
            updateUI();
            return;
        }
    }
    
    // Спец-способность + обычный
    if (spA && !spB) {
        var removed = activateSpecial(a, spA);
        if (removed) {
            moves++;
            combo = 0;
            var mult = updateStreak();
            await sleep(450);
            for (var key in removed) board[parseInt(key)] = null;
            var fall = gravity();
            fillEmpty();
            render(fall);
            updateUI();
            await sleep(380);
            await resolveAll(mult);
            busy = false;
            updateUI();
            checkWinCondition();
            if (!levelComplete && !anyMove(board)) { reshuffle(); render(); }
            updateUI();
            return;
        }
    }
    
    if (spB && !spA) {
        var removed = activateSpecial(b, spB);
        if (removed) {
            moves++;
            combo = 0;
            var mult = updateStreak();
            await sleep(450);
            for (var key in removed) board[parseInt(key)] = null;
            var fall = gravity();
            fillEmpty();
            render(fall);
            updateUI();
            await sleep(380);
            await resolveAll(mult);
            busy = false;
            updateUI();
            checkWinCondition();
            if (!levelComplete && !anyMove(board)) { reshuffle(); render(); }
            updateUI();
            return;
        }
    }
    
    // Обычный обмен
    var temp = board[a];
    board[a] = board[b];
    board[b] = temp;
    var result = findMatches(board);
    
    if (result.matched.length === 0) {
        sndBad();
        var temp2 = board[a];
        board[a] = board[b];
        board[b] = temp2;
        await animSwap(a, b);
        render();
        shakeCell(a);
        shakeCell(b);
        busy = false;
        return;
    }
    
    moves++;
    combo = 0;
    var mult = updateStreak();
    render();
    await resolveWithShapes(result, mult);
    busy = false;
    updateUI();
    checkWinCondition();
    if (!levelComplete && !anyMove(board)) { reshuffle(); render(); }
    updateUI();
}

function onClick(i) {
    if (busy || levelComplete || !board[i]) return;
    if (sel < 0) {
        sel = i;
        render();
    } else if (sel === i) {
        sel = -1;
        render();
    } else if (isNeighbor(sel, i)) {
        var a = sel;
        trySwap(a, i);
    } else {
        sel = i;
        render();
    }
}

// ============================================================
//  ГЛОБАЛЬНЫЙ ОБЪЕКТ
// ============================================================
var G = {
    shuffle: doShuffle,
    hint: doHint,
    useBomb: doUseBomb,
    showTut: showTut,
    tutNext: doTutNext,
    closeTut: closeTut,
    newGame: doNewGame
};

// ============================================================
//  ИНИЦИАЛИЗАЦИЯ
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    var bEl = document.getElementById('board');
    var si = -1, sx = 0, sy = 0, mv = false;
    function getIdx(e) {
        var t = e.touches ? e.touches[0] : e;
        var el = document.elementFromPoint(t.clientX, t.clientY);
        while (el && el !== document.body) {
            if (el.getAttribute && el.getAttribute('data-i') !== null) {
                return parseInt(el.getAttribute('data-i'));
            }
            el = el.parentElement;
        }
        return -1;
    }
    bEl.addEventListener('pointerdown', function(e) {
        if (busy || levelComplete) return;
        var i = getIdx(e);
        if (i < 0 || !board[i]) return;
        si = i;
        sx = e.clientX;
        sy = e.clientY;
        mv = false;
        var el = document.querySelectorAll('.c')[i];
        if (el) el.classList.add('drag');
        try { bEl.setPointerCapture(e.pointerId); } catch (ex) {}
        e.preventDefault();
    });
    bEl.addEventListener('pointermove', function(e) {
        if (si < 0 || busy || levelComplete) return;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return;
        mv = true;
        var tgt = -1;
        if (Math.abs(dx) > Math.abs(dy)) {
            var c = si % NC;
            if (dx > 0 && c < NC - 1) tgt = si + 1;
            else if (dx < 0 && c > 0) tgt = si - 1;
        } else {
            var r = Math.floor(si / NC);
            if (dy > 0 && r < NR - 1) tgt = si + NC;
            else if (dy < 0 && r > 0) tgt = si - NC;
        }
        var se = document.querySelectorAll('.c')[si];
        if (se) se.classList.remove('drag');
        if (tgt >= 0 && board[tgt]) {
            var a = si;
            si = -1;
            sel = -1;
            trySwap(a, tgt);
        }
        e.preventDefault();
    });
    bEl.addEventListener('pointerup', function(e) {
        if (si >= 0) {
            var el = document.querySelectorAll('.c')[si];
            if (el) el.classList.remove('drag');
        }
        if (!mv && si >= 0 && !busy && !levelComplete) onClick(si);
        si = -1;
        mv = false;
        e.preventDefault();
    });
    bEl.addEventListener('pointercancel', function() {
        if (si >= 0) {
            var el = document.querySelectorAll('.c')[si];
            if (el) el.classList.remove('drag');
        }
        si = -1;
        mv = false;
    });
    bEl.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    initBoard();
    calcSize();
    render();
    updateUI();
    window.addEventListener('resize', function() {
        calcSize();
        render();
    });
});
</script>
