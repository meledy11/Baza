<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🀄 Ханзи Match-3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0f;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
body{display:flex;flex-direction:column;align-items:center;}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1s ease;}
.bg.t1{background:linear-gradient(135deg,#0a0a0f,#1a0a2e,#0f0f1a);}
.bg.t2{background:linear-gradient(135deg,#0a0a0f,#0a1a2e,#0f0f1a);}
.bg.t3{background:linear-gradient(135deg,#0a0a0f,#0a1a0a,#0f1a0f);}
.bg.t4{background:linear-gradient(135deg,#0a0a0f,#1a0a1a,#1a0f1a);}
.bg.t5{background:linear-gradient(135deg,#0a0a0f,#0a0a2e,#0f0f2a);}

.hdr{position:relative;z-index:10;width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;flex-shrink:0;}
.logo{font-size:1rem;font-weight:800;background:linear-gradient(135deg,#ffd700,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px;}
.pills{display:flex;gap:4px;flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:3px 10px;font-size:.55rem;font-weight:600;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:3px;}
.pill b{font-size:.7rem;}.pill .g{color:#ffd700;}.pill .r{color:#ff6b6b;}.pill .gr{color:#2ecc71;}.pill .p{color:#a855f7;}.pill .o{color:#f59e0b;}

.pw{position:relative;z-index:10;width:100%;max-width:560px;padding:0 12px 4px;flex-shrink:0;}
.pt{height:4px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.pf{height:100%;border-radius:3px;background:linear-gradient(90deg,#ff6b6b,#ffd700,#2ecc71,#a855f7);box-shadow:0 0 20px rgba(255,215,0,.1);transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.pl{display:flex;justify-content:space-between;font-size:.5rem;color:rgba(255,255,255,.25);margin-top:2px;}

.ba{position:relative;z-index:5;flex:1;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;padding:4px 8px;overflow:hidden;}
#board{display:grid;background:rgba(255,255,255,.03);border-radius:16px;position:relative;touch-action:none;border:1px solid rgba(255,255,255,.04);box-shadow:0 16px 50px rgba(0,0,0,.5);}

.c{position:relative;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;border:1px solid rgba(255,255,255,.08);box-shadow:0 3px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.15);}
.c::after{content:'';position:absolute;inset:0;border-radius:10px;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.06),transparent 55%);pointer-events:none;z-index:0;}

.t1 .c0{background:linear-gradient(150deg,#c47a5a,#8a4a2a);}.t1 .c1{background:linear-gradient(150deg,#c4a84a,#8a7a2a);}.t1 .c2{background:linear-gradient(150deg,#4a9a5a,#2a6a3a);}.t1 .c3{background:linear-gradient(150deg,#4a6a9a,#2a3a6a);}.t1 .c4{background:linear-gradient(150deg,#8a5a9a,#4a2a6a);}.t1 .c5{background:linear-gradient(150deg,#5a8a8a,#2a5a5a);}
.t2 .c0{background:linear-gradient(150deg,#8a8aaa,#4a4a6a);}.t2 .c1{background:linear-gradient(150deg,#8aaa8a,#4a6a4a);}.t2 .c2{background:linear-gradient(150deg,#6a8aaa,#2a4a6a);}.t2 .c3{background:linear-gradient(150deg,#aa8a8a,#6a4a4a);}.t2 .c4{background:linear-gradient(150deg,#8a6aaa,#4a2a6a);}.t2 .c5{background:linear-gradient(150deg,#6a8a8a,#2a4a4a);}
.t3 .c0{background:linear-gradient(150deg,#ff6b6b,#cc3333);}.t3 .c1{background:linear-gradient(150deg,#ffd93d,#cca800);}.t3 .c2{background:linear-gradient(150deg,#6bff6b,#33cc33);}.t3 .c3{background:linear-gradient(150deg,#6bb5ff,#3388cc);}.t3 .c4{background:linear-gradient(150deg,#c084fc,#8844cc);}.t3 .c5{background:linear-gradient(150deg,#ff6bff,#cc33cc);}
.t4 .c0{background:linear-gradient(150deg,#8a3a4a,#5a1a2a);}.t4 .c1{background:linear-gradient(150deg,#8a5a3a,#5a2a1a);}.t4 .c2{background:linear-gradient(150deg,#3a7a4a,#1a4a2a);}.t4 .c3{background:linear-gradient(150deg,#3a4a7a,#1a2a4a);}.t4 .c4{background:linear-gradient(150deg,#6a3a7a,#3a1a4a);}.t4 .c5{background:linear-gradient(150deg,#3a6a6a,#1a3a3a);}
.t5 .c0{background:linear-gradient(150deg,#f5b0b0,#d07070);}.t5 .c1{background:linear-gradient(150deg,#f5d0a0,#d0a070);}.t5 .c2{background:linear-gradient(150deg,#a0d0a0,#70a070);}.t5 .c3{background:linear-gradient(150deg,#a0b0d0,#7080a0);}.t5 .c4{background:linear-gradient(150deg,#c0a0d0,#9080a0);}.t5 .c5{background:linear-gradient(150deg,#a0d0d0,#70a0a0);}

/* ... остальные стили такие же, но с уменьшенными размерами */
.c .hz{font-weight:800;line-height:1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);z-index:1;pointer-events:none;}
.c .py{color:rgba(255,255,255,.5);font-weight:500;text-shadow:0 1px 5px rgba(0,0,0,.5);z-index:1;pointer-events:none;margin-top:1px;font-size:.5rem;}
.c .ru{color:rgba(255,255,255,.7);font-weight:500;text-shadow:0 1px 5px rgba(0,0,0,.5);background:rgba(0,0,0,.2);padding:0 4px;border-radius:3px;z-index:1;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%;font-size:.45rem;}
.c .badge{position:absolute;top:1px;right:2px;z-index:2;pointer-events:none;text-shadow:0 0 10px rgba(0,0,0,.6);font-size:.55rem;}
.c .emo{position:absolute;bottom:1px;left:3px;opacity:.3;z-index:2;pointer-events:none;font-size:.5rem;}

/* ... остальные стили такие же как в вашем примере, но адаптированные под маленький экран */

.bar{position:relative;z-index:10;width:100%;max-width:560px;display:flex;gap:4px;justify-content:center;padding:4px 10px 8px;flex-shrink:0;flex-wrap:wrap;}
.btn{padding:6px 10px;border:none;border-radius:10px;font-weight:700;font-size:.6rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:3px;touch-action:manipulation;color:#f0e8d8;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.08);}
.btn:active{transform:scale(.92);}
.btn .cnt{background:rgba(0,0,0,.3);padding:0 5px;border-radius:5px;font-size:.5rem;}
.btn.off{opacity:.25;pointer-events:none;}

/* Модалки такие же */
</style>
</head>
<body>
<!-- Тот же HTML что и раньше -->
<div class="bg t1" id="bg"></div>
<div class="hdr">
  <div class="logo">🀄 Ханзи</div>
  <div class="pills">
    <div class="pill">⭐<b class="g" id="uSc">0</b></div>
    <div class="pill">🔥<b class="r" id="uCo">0</b></div>
    <div class="pill">🎯<b class="gr" id="uLv">1</b></div>
    <div class="pill">💎<b class="p" id="uSp">0</b></div>
    <div class="pill">📦<b class="o" id="uSet">Набор 1</b></div>
  </div>
</div>
<div class="pw">
  <div class="pt"><div class="pf" id="pFill" style="width:0%"></div></div>
  <div class="pl"><span>🎯 <b id="uGl">200</b></span><span id="uHz">🔥 0</span></div>
</div>
<div class="ba"><div id="board" class="t1"></div></div>
<div class="bar">
  <button class="btn bb" id="bSh" onclick="G.shuffle()">🔀<span class="cnt" id="cSh">3</span></button>
  <button class="btn bg" id="bHi" onclick="G.hint()">💡<span class="cnt" id="cHi">5</span></button>
  <button class="btn bp" onclick="G.useBomb()">💥<span class="cnt" id="cBm">0</span></button>
  <button class="btn bgr" onclick="G.showTut()">📖</button>
  <button class="btn br" onclick="G.newGame()">🔄</button>
</div>
<div id="cmb"></div>
<div id="streak"></div>

<div class="tov" id="tov">
  <div class="tc">
    <span class="ebig" id="tEm">🎯</span>
    <h2 id="tTi">Как играть?</h2>
    <div id="tSt"></div>
    <div class="demo" id="tDemo"></div>
    <div class="dots" id="tDots"></div>
    <button class="bn" id="tBtn" onclick="G.tutNext()">Дальше ➡️</button>
    <button class="bsk" onclick="G.closeTut()">Пропустить</button>
  </div>
</div>

<script src="app.js"></script>
<script src="hanzi-game.js"></script>
</body>
</html>
