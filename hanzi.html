<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🀄 Ханзи Match-3</title>
<style>
/* ===== ВСЕ СТИЛИ ОСТАЮТСЯ БЕЗ ИЗМЕНЕНИЙ (как в вашем примере) ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0f;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
body{display:flex;flex-direction:column;align-items:center;}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1s ease;}
.bg.t1{background:linear-gradient(135deg,#0a0a0f,#1a0a2e,#0f0f1a);}
.bg.t2{background:linear-gradient(135deg,#0a0a0f,#0a1a2e,#0f0f1a);}
.bg.t3{background:linear-gradient(135deg,#0a0a0f,#0a1a0a,#0f1a0f);}
.bg.t4{background:linear-gradient(135deg,#0a0a0f,#1a0a1a,#1a0f1a);}
.bg.t5{background:linear-gradient(135deg,#0a0a0f,#0a0a2e,#0f0f2a);}

.hdr{position:relative;z-index:10;width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;flex-shrink:0;}
.logo{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#ffd700,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px;}
.pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:4px 12px;font-size:.6rem;font-weight:600;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:4px;}
.pill b{font-size:.8rem;}.pill .g{color:#ffd700;}.pill .r{color:#ff6b6b;}.pill .gr{color:#2ecc71;}.pill .p{color:#a855f7;}.pill .o{color:#f59e0b;}

.pw{position:relative;z-index:10;width:100%;max-width:560px;padding:0 16px 8px;flex-shrink:0;}
.pt{height:6px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;background:linear-gradient(90deg,#ff6b6b,#ffd700,#2ecc71,#a855f7);box-shadow:0 0 30px rgba(255,215,0,.15);transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.pl{display:flex;justify-content:space-between;font-size:.55rem;color:rgba(255,255,255,.25);margin-top:3px;}

.ba{position:relative;z-index:5;flex:1;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;padding:6px 10px;overflow:hidden;}
#board{display:grid;background:rgba(255,255,255,.03);border-radius:20px;position:relative;touch-action:none;border:1px solid rgba(255,255,255,.04);box-shadow:0 20px 60px rgba(0,0,0,.5);}

.c{position:relative;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;border:1px solid rgba(255,255,255,.08);box-shadow:0 4px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.15);}
.c::after{content:'';position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.06),transparent 55%);pointer-events:none;z-index:0;}

.t1 .c0{background:linear-gradient(150deg,#c47a5a,#8a4a2a);}.t1 .c1{background:linear-gradient(150deg,#c4a84a,#8a7a2a);}.t1 .c2{background:linear-gradient(150deg,#4a9a5a,#2a6a3a);}.t1 .c3{background:linear-gradient(150deg,#4a6a9a,#2a3a6a);}.t1 .c4{background:linear-gradient(150deg,#8a5a9a,#4a2a6a);}.t1 .c5{background:linear-gradient(150deg,#5a8a8a,#2a5a5a);}
.t2 .c0{background:linear-gradient(150deg,#8a8aaa,#4a4a6a);}.t2 .c1{background:linear-gradient(150deg,#8aaa8a,#4a6a4a);}.t2 .c2{background:linear-gradient(150deg,#6a8aaa,#2a4a6a);}.t2 .c3{background:linear-gradient(150deg,#aa8a8a,#6a4a4a);}.t2 .c4{background:linear-gradient(150deg,#8a6aaa,#4a2a6a);}.t2 .c5{background:linear-gradient(150deg,#6a8a8a,#2a4a4a);}
.t3 .c0{background:linear-gradient(150deg,#ff6b6b,#cc3333);}.t3 .c1{background:linear-gradient(150deg,#ffd93d,#cca800);}.t3 .c2{background:linear-gradient(150deg,#6bff6b,#33cc33);}.t3 .c3{background:linear-gradient(150deg,#6bb5ff,#3388cc);}.t3 .c4{background:linear-gradient(150deg,#c084fc,#8844cc);}.t3 .c5{background:linear-gradient(150deg,#ff6bff,#cc33cc);}
.t4 .c0{background:linear-gradient(150deg,#8a3a4a,#5a1a2a);}.t4 .c1{background:linear-gradient(150deg,#8a5a3a,#5a2a1a);}.t4 .c2{background:linear-gradient(150deg,#3a7a4a,#1a4a2a);}.t4 .c3{background:linear-gradient(150deg,#3a4a7a,#1a2a4a);}.t4 .c4{background:linear-gradient(150deg,#6a3a7a,#3a1a4a);}.t4 .c5{background:linear-gradient(150deg,#3a6a6a,#1a3a3a);}
.t5 .c0{background:linear-gradient(150deg,#f5b0b0,#d07070);}.t5 .c1{background:linear-gradient(150deg,#f5d0a0,#d0a070);}.t5 .c2{background:linear-gradient(150deg,#a0d0a0,#70a070);}.t5 .c3{background:linear-gradient(150deg,#a0b0d0,#7080a0);}.t5 .c4{background:linear-gradient(150deg,#c0a0d0,#9080a0);}.t5 .c5{background:linear-gradient(150deg,#a0d0d0,#70a0a0);}

.c.sp-bomb{background:radial-gradient(circle at 30% 30%,#dd4444,#881818)!important;border:2px solid #ffd700!important;animation:bPulse 1s ease infinite alternate;}
@keyframes bPulse{from{box-shadow:0 0 15px rgba(255,215,0,.1);}to{box-shadow:0 0 45px rgba(255,215,0,.4);}}
.c.sp-laser{background:radial-gradient(circle at 30% 30%,#7a5add,#4422aa)!important;border:2px solid #aa88ee!important;animation:lPulse 1s ease infinite alternate;}
@keyframes lPulse{from{box-shadow:0 0 15px rgba(170,136,238,.1);}to{box-shadow:0 0 45px rgba(170,136,238,.4);}}
.c.sp-star{background:radial-gradient(circle at 30% 30%,#44dd88,#118844)!important;border:2px solid #88eebb!important;animation:sPulse 1s ease infinite alternate;}
@keyframes sPulse{from{box-shadow:0 0 15px rgba(136,238,187,.1);}to{box-shadow:0 0 45px rgba(136,238,187,.4);}}
.c.sp-rainbow{background:linear-gradient(135deg,#ff6b6b,#ffd93d,#6bff6b,#6bb5ff,#c084fc)!important;border:2px solid #ffd700!important;animation:rPulse .8s ease infinite alternate;}
@keyframes rPulse{from{box-shadow:0 0 20px rgba(255,215,0,.1);}to{box-shadow:0 0 60px rgba(255,215,0,.5);}}

.c .hz{font-weight:800;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);z-index:1;pointer-events:none;}
.c .py{color:rgba(255,255,255,.5);font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:1;pointer-events:none;margin-top:1px;font-size:.55rem;}
.c .ru{color:rgba(255,255,255,.7);font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.5);background:rgba(0,0,0,.2);padding:0 6px;border-radius:4px;z-index:1;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;font-size:.5rem;}
.c .badge{position:absolute;top:2px;right:3px;z-index:2;pointer-events:none;text-shadow:0 0 12px rgba(0,0,0,.6);font-size:.65rem;}
.c .emo{position:absolute;bottom:2px;left:4px;opacity:.3;z-index:2;pointer-events:none;font-size:.55rem;}

.c.sel{transform:scale(1.12);z-index:6;box-shadow:0 0 0 3px #ffd700,0 0 40px rgba(255,215,0,.3);}
.c.drag{transform:scale(1.18)!important;z-index:20!important;box-shadow:0 0 0 4px #ffd700,0 12px 50px rgba(0,0,0,.4)!important;}
.c.best{z-index:8;animation:hintPulse .8s ease-in-out infinite alternate;border:2px solid #2ecc71!important;}
@keyframes hintPulse{from{box-shadow:0 0 10px rgba(46,204,113,.2);transform:scale(1);}to{box-shadow:0 0 35px rgba(46,204,113,.5);transform:scale(1.06);}}
.c.shape-hl{z-index:7;animation:shapeFlash .6s ease-out forwards;border:2px solid #fff!important;}
@keyframes shapeFlash{0%{box-shadow:0 0 0 0 rgba(255,255,255,0);transform:scale(1);}50%{box-shadow:0 0 40px 10px rgba(255,255,255,0.6);transform:scale(1.12);filter:brightness(1.5);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);transform:scale(1);}}

.c.gone{animation:popOut .45s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes popOut{0%{transform:scale(1);opacity:1;}30%{transform:scale(1.4) rotate(6deg);box-shadow:0 0 60px rgba(255,215,0,.6);}100%{transform:scale(0) rotate(20deg);opacity:0;}}
.c.boom{animation:boomAnim .5s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes boomAnim{0%{transform:scale(1);opacity:1;}30%{transform:scale(2.2) rotate(10deg);box-shadow:0 0 80px rgba(255,80,0,.7);}100%{transform:scale(0) rotate(30deg);opacity:0;}}
.c.lhit{animation:lHit .45s ease forwards;pointer-events:none;}
@keyframes lHit{0%{transform:scale(1);opacity:1;}100%{transform:scaleX(0) rotate(45deg);opacity:0;}}
.c.shit{animation:sHit .55s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes sHit{0%{transform:scale(1);opacity:1;}40%{transform:scale(2) rotate(180deg);opacity:1;}100%{transform:scale(0) rotate(360deg);opacity:0;}}
.c.rhit{animation:rHit .65s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes rHit{0%{transform:scale(1) rotate(0);opacity:1;}30%{transform:scale(1.6) rotate(60deg);}60%{transform:scale(1.9) rotate(-30deg);}100%{transform:scale(0) rotate(120deg);opacity:0;}}
.c.drop{animation:dropIn var(--dd,.3s) cubic-bezier(.22,1.4,.36,1) forwards;}
@keyframes dropIn{0%{transform:translateY(var(--dy,-70px)) scale(.4) rotate(-8deg);opacity:0;}65%{transform:translateY(8px) scale(1.06);opacity:1;}85%{transform:translateY(-3px) scale(.98);}100%{transform:translateY(0) scale(1);opacity:1;}}
.c.swp{transition:transform .28s cubic-bezier(.34,1.56,.64,1);z-index:12;}
.c.shk{animation:shkA .38s ease;}
@keyframes shkA{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px) rotate(-2deg);}40%{transform:translateX(7px) rotate(2deg);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.c.empty{visibility:hidden;pointer-events:none;}

.salute{position:fixed;pointer-events:none;z-index:200;animation:salFly var(--dur,1.2s) ease forwards;}
@keyframes salFly{0%{transform:translate(0,0) scale(0) rotate(0);opacity:0;}20%{opacity:1;transform:translate(var(--t1x,0),var(--t1y,-40px)) scale(1.3) rotate(60deg);}80%{opacity:.8;}100%{transform:translate(var(--t2x,0),var(--t2y,-100px)) scale(.4) rotate(360deg);opacity:0;}}
.rain{position:fixed;pointer-events:none;z-index:150;opacity:.35;animation:rainF var(--rd,2s) ease-in forwards;}
@keyframes rainF{0%{transform:translateY(-40px) rotate(0) scale(.5);opacity:0;}10%{opacity:.35;}100%{transform:translateY(105vh) rotate(360deg) scale(.4);opacity:0;}}
.fpts{position:absolute;font-weight:700;pointer-events:none;z-index:90;color:#ffd700;text-shadow:0 0 18px rgba(255,215,0,.8),0 2px 8px #000;animation:fpu .9s ease forwards;white-space:nowrap;}
@keyframes fpu{0%{transform:translateY(0) scale(.4);opacity:1;}60%{transform:translateY(-50px) scale(1.15);opacity:1;}100%{transform:translateY(-80px) scale(.9);opacity:0;}}
#cmb{position:fixed;top:20%;left:50%;transform:translateX(-50%);font-weight:700;pointer-events:none;z-index:300;color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,.7),0 3px 15px #000;display:none;white-space:nowrap;}
#cmb.show{display:block;animation:cmbF 1.15s ease forwards;}
@keyframes cmbF{0%{transform:translate(-50%,30px) scale(.3);opacity:0;}25%{transform:translate(-50%,-8px) scale(1.3);opacity:1;}100%{transform:translate(-50%,-75px) scale(.85);opacity:0;}}
#streak{position:fixed;top:14%;left:50%;transform:translateX(-50%);font-weight:700;pointer-events:none;z-index:280;padding:6px 20px;border-radius:14px;background:rgba(0,0,0,.8);border:1px solid rgba(255,215,0,.2);display:none;white-space:nowrap;}
#streak.show{display:block;animation:stF 1.4s ease forwards;}
@keyframes stF{0%{transform:translate(-50%,40px) scale(.5);opacity:0;}18%{transform:translate(-50%,0) scale(1.1);opacity:1;}75%{opacity:1;}100%{transform:translate(-50%,-90px) scale(1);opacity:0;}}

.bar{position:relative;z-index:10;width:100%;max-width:560px;display:flex;gap:6px;justify-content:center;padding:6px 12px 12px;flex-shrink:0;flex-wrap:wrap;}
.btn{padding:8px 14px;border:none;border-radius:12px;font-weight:700;font-size:.7rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;touch-action:manipulation;color:#f0e8d8;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.08);}
.btn:active{transform:scale(.92);}
.btn.bb{background:rgba(60,100,180,.2);border-color:rgba(60,100,180,.15);}
.btn.bb:hover{background:rgba(60,100,180,.3);}
.btn.bg{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.15);color:#ffd700;}
.btn.bg:hover{background:rgba(255,215,0,.2);}
.btn.br{background:rgba(180,80,60,.2);border-color:rgba(180,80,60,.15);}
.btn.br:hover{background:rgba(180,80,60,.3);}
.btn.bp{background:rgba(120,80,160,.2);border-color:rgba(120,80,160,.15);color:#c084fc;}
.btn.bp:hover{background:rgba(120,80,160,.3);}
.btn.bgr{background:rgba(80,160,120,.2);border-color:rgba(80,160,120,.15);color:#80ed99;}
.btn.bgr:hover{background:rgba(80,160,120,.3);}
.btn .cnt{background:rgba(0,0,0,.3);padding:0 6px;border-radius:6px;font-size:.6rem;}
.btn.off{opacity:.25;pointer-events:none;}

.tov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:450;padding:20px;}
.tov.show{display:flex;}
.tc{background:linear-gradient(150deg,rgba(26,20,46,.98),rgba(20,20,40,.98));border-radius:24px;padding:28px 24px;max-width:400px;width:100%;border:1px solid rgba(255,255,255,.06);color:#e8d5b7;box-shadow:0 30px 80px rgba(0,0,0,.8);}
.tc h2{font-size:1.3rem;margin-bottom:8px;text-align:center;font-weight:800;color:#ffd700;}
.tc .step{font-size:.85rem;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:5px;}
.tc .hl{color:#ffd700;font-weight:700;}
.tc .ebig{font-size:3rem;text-align:center;display:block;margin:6px 0;}
.tc .dots{display:flex;gap:8px;justify-content:center;margin:12px 0;}
.tc .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1);transition:background .3s;}
.tc .dot.on{background:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.3);}
.tc .demo{display:flex;gap:4px;justify-content:center;padding:8px 0;flex-wrap:wrap;}
.tc .dc{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);}
.tc .dc.on{background:rgba(255,215,0,.15);border-color:rgba(255,215,0,.25);}
.tc .dc.hl{background:rgba(255,215,0,.3);border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.2);}
.tc .bn{padding:12px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd700,#f59e0b);color:#1a1a2e;font-size:.9rem;cursor:pointer;width:100%;margin-top:12px;font-weight:800;transition:transform .2s;}
.tc .bn:active{transform:scale(.95);}
.tc .bn:hover{transform:scale(1.02);}
.tc .bsk{padding:8px;border:none;background:none;color:rgba(255,255,255,.2);font-size:.7rem;cursor:pointer;width:100%;margin-top:4px;}
.tc .bsk:hover{color:rgba(255,255,255,.4);}
@media(max-width:360px){.c{border-radius:10px;}}
</style>
</head>
<body>
<div class="bg t1" id="bg"></div>
<div class="hdr">
  <div class="logo">🀄 Ханзи</div>
  <div class="pills">
    <div class="pill">⭐<b class="g" id="uSc">0</b></div>
    <div class="pill">🔥<b class="r" id="uCo">0</b></div>
    <div class="pill">🎯<b class="gr" id="uLv">1</b></div>
    <div class="pill">💎<b class="p" id="uSp">0</b></div>
    <div class="pill">📦<b class="o" id="uSet">Набор 1</b></div>
  </div>
</div>
<div class="pw">
  <div class="pt"><div class="pf" id="pFill" style="width:0%"></div></div>
  <div class="pl"><span>🎯 <b id="uGl">200</b></span><span id="uHz">🔥 0</span></div>
</div>
<div class="ba"><div id="board" class="t1"></div></div>
<div class="bar">
  <button class="btn bb" id="bSh" onclick="G.shuffle()">🔀<span class="cnt" id="cSh">3</span></button>
  <button class="btn bg" id="bHi" onclick="G.hint()">💡<span class="cnt" id="cHi">5</span></button>
  <button class="btn bp" onclick="G.useBomb()">💥<span class="cnt" id="cBm">0</span></button>
  <button class="btn bgr" onclick="G.showTut()">📖</button>
  <button class="btn br" onclick="G.newGame()">🔄</button>
</div>
<div id="cmb"></div>
<div id="streak"></div>

<!-- Модальное окно обучения -->
<div class="tov" id="tov">
  <div class="tc">
    <span class="ebig" id="tEm">🎯</span>
    <h2 id="tTi">Как играть?</h2>
    <div id="tSt"></div>
    <div class="demo" id="tDemo"></div>
    <div class="dots" id="tDots"></div>
    <button class="bn" id="tBtn" onclick="G.tutNext()">Дальше ➡️</button>
    <button class="bsk" onclick="G.closeTut()">Пропустить</button>
  </div>
</div>

<script src="app.js"></script>
<script>
// ============================================================
//  ГЕНЕРАЦИЯ УРОВНЕЙ ИЗ app.js (600 иероглифов)
// ============================================================
if (typeof DB === 'undefined' || DB.length === 0) {
    console.error('❌ app.js не загружен! Используем встроенную базу (30 иероглифов).');
    // Запасная база на 5 уровней
    var ALL_LEVELS = [
        [{h:"人",p:"rén",r:"человек",e:"👤"},{h:"大",p:"dà",r:"большой",e:"📏"},{h:"小",p:"xiǎo",r:"маленький",e:"🔬"},{h:"好",p:"hǎo",r:"хороший",e:"👍"},{h:"水",p:"shuǐ",r:"вода",e:"💧"},{h:"火",p:"huǒ",r:"огонь",e:"🔥"}],
        [{h:"山",p:"shān",r:"гора",e:"⛰️"},{h:"月",p:"yuè",r:"луна",e:"🌙"},{h:"日",p:"rì",r:"солнце",e:"🌞"},{h:"花",p:"huā",r:"цветок",e:"🌸"},{h:"鱼",p:"yú",r:"рыба",e:"🐟"},{h:"鸟",p:"niǎo",r:"птица",e:"🐦"}],
        [{h:"马",p:"mǎ",r:"лошадь",e:"🐴"},{h:"龙",p:"lóng",r:"дракон",e:"🐉"},{h:"风",p:"fēng",r:"ветер",e:"🌬️"},{h:"雨",p:"yǔ",r:"дождь",e:"🌧️"},{h:"雪",p:"xuě",r:"снег",e:"❄️"},{h:"星",p:"xīng",r:"звезда",e:"⭐"}],
        [{h:"心",p:"xīn",r:"сердце",e:"💖"},{h:"手",p:"shǒu",r:"рука",e:"✋"},{h:"口",p:"kǒu",r:"рот",e:"👄"},{h:"目",p:"mù",r:"глаз",e:"👁️"},{h:"耳",p:"ěr",r:"ухо",e:"👂"},{h:"金",p:"jīn",r:"золото",e:"🥇"}],
        [{h:"木",p:"mù",r:"дерево",e:"🌳"},{h:"土",p:"tǔ",r:"земля",e:"🌍"},{h:"石",p:"shí",r:"камень",e:"🪨"},{h:"云",p:"yún",r:"облако",e:"☁️"},{h:"爱",p:"ài",r:"любовь",e:"❤️"},{h:"天",p:"tiān",r:"небо",e:"☀️"}]
    ];
} else {
    console.log('✅ Используем базу из app.js: ' + DB.length + ' иероглифов');
    var ALL_LEVELS = [];
    var CHARS_PER_SET = 6;
    var totalLevels = Math.floor(DB.length / CHARS_PER_SET); // 100 уровней
    
    for (var setIdx = 0; setIdx < totalLevels; setIdx++) {
        var set = [];
        for (var i = 0; i < CHARS_PER_SET; i++) {
            var idx = (setIdx * CHARS_PER_SET + i) % DB.length;
            var item = DB[idx];
            set.push({
                h: item[0],
                p: item[1],
                r: item[2],
                e: item[3] || '🀄'

        ALL_LEVELS.push(set);
    }
    console.log('✅ Создано ' + ALL_LEVELS.length + ' уровней по ' + CHARS_PER_SET + ' иероглифов');
}

// ============================================================
//  ВСЯ ОСТАЛЬНАЯ ЛОГИКА ИГРЫ (БЕЗ ИЗМЕНЕНИЙ)
// ============================================================
var NR = 8, NC = 6, TOT = NR * NC, NCOLORS = 6;
var GAP = 5, PAD = 5;
var board = [], sel = -1, score = 0, combo = 0, moves = 0, level = 1, goal = 200;
var nShuf = 3, nHint = 5, nBomb = 0, specials = 0, streak = 0, maxStreak = 0, busy = false, cellPx = 0;
var levelComplete = false;
var reshuffleAttempts = 0;
var victoryShown = false;

function getCharsForLevel(lvl) {
  var idx = (lvl - 1) % ALL_LEVELS.length;
  return ALL_LEVELS[idx];
}
function getCurrentChars() { return getCharsForLevel(level); }
function randomChar() {
  var chars = getCurrentChars();
  var idx = Math.floor(Math.random() * chars.length);
  var d = chars[idx];
  return { h: d.h, p: d.p, r: d.r, e: d.e, c: idx % NCOLORS, sp: null };
}

function sleep(ms) { return new Promise(function(ok) { setTimeout(ok, ms); }); }
function getNeighbors(idx) {
  var r = Math.floor(idx / NC), c = idx % NC, res = [];
  if (r > 0) res.push(idx - NC); if (r < NR - 1) res.push(idx + NC);
  if (c > 0) res.push(idx - 1); if (c < NC - 1) res.push(idx + 1);
  return res;
}
function getAllNeighbors(idx) {
  var r = Math.floor(idx / NC), c = idx % NC, res = [];
  for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
    if (dr === 0 && dc === 0) continue;
    var nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < NR && nc >= 0 && nc < NC) res.push(nr * NC + nc);
  }
  return res;
}
function isNeighbor(a, b) { var n = getNeighbors(a); for (var i = 0; i < n.length; i++) if (n[i] === b) return true; return false; }

function findAllCombinations(bd) {
  var results = [], used = {};
  for (var r = 0; r < NR; r++) for (var c = 0; c <= NC - 3; c++) {
    var i = r * NC + c, ch = bd[i] ? bd[i].h : null; if (!ch) continue;
    var len = 1; while (c + len < NC && bd[i + len] && bd[i + len].h === ch) len++;
    if (len >= 3) { var ids = []; for (var k = 0; k < len; k++) ids.push(i + k); var key = ids.join('-');
      if (!used[key]) { used[key] = true; results.push({ ids: ids, len: len, type: len>=6?'6line':len>=5?'5line':len===4?'4line':'3line', orient: 'h' }); } }
    c += len - 1;
  }
  for (var c = 0; c < NC; c++) for (var r = 0; r <= NR - 3; r++) {
    var i = r * NC + c, ch = bd[i] ? bd[i].h : null; if (!ch) continue;
    var len = 1; while (r + len < NR && bd[i + len * NC] && bd[i + len * NC].h === ch) len++;
    if (len >= 3) { var ids = []; for (var k = 0; k < len; k++) ids.push(i + k * NC); var key = ids.join('-');
      if (!used[key]) { used[key] = true; results.push({ ids: ids, len: len, type: len>=6?'6line':len>=5?'5line':len===4?'4line':'3line', orient: 'v' }); } }
    r += len - 1;
  }
  for (var r = 0; r < NR - 2; r++) for (var c = 0; c < NC - 2; c++) {
    var patterns = [
      { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c, (r+2)*NC+c], t:'L' },
      { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2], t:'L' },
      { ids: [r*NC+c, (r+1)*NC+c, (r+2)*NC+c, (r+2)*NC+c+1, (r+2)*NC+c+2], t:'L' },
      { ids: [r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2, (r+2)*NC+c, (r+2)*NC+c+1], t:'L' },
      { ids: [r*NC+c, r*NC+c+1, r*NC+c+2, (r+1)*NC+c+1, (r+2)*NC+c+1], t:'T' },
      { ids: [(r+2)*NC+c, (r+2)*NC+c+1, (r+2)*NC+c+2, (r+1)*NC+c+1, r*NC+c+1], t:'T' },
      { ids: [r*NC+c, (r+1)*NC+c, (r+2)*NC+c, (r+1)*NC+c+1, (r+1)*NC+c+2], t:'T' },
      { ids: [r*NC+c+2, (r+1)*NC+c+2, (r+2)*NC+c+2, (r+1)*NC+c+1, (r+1)*NC+c], t:'T' }
    ];
    for (var p = 0; p < patterns.length; p++) {
      var ids = patterns[p].ids, ch = bd[ids[0]] ? bd[ids[0]].h : null; if (!ch) continue;
      var ok = true; for (var j = 0; j < ids.length; j++) if (!bd[ids[j]] || bd[ids[j]].h !== ch) { ok = false; break; }
      if (ok) { var key = ids.join('-'); if (!used[key]) { used[key] = true; results.push({ ids: ids, len: 5, type: patterns[p].t, orient: patterns[p].t }); } }
    }
  }
  for (var r = 0; r < NR - 1; r++) for (var c = 0; c < NC - 1; c++) {
    var ids = [r*NC+c, r*NC+c+1, (r+1)*NC+c, (r+1)*NC+c+1], ch = bd[ids[0]] ? bd[ids[0]].h : null; if (!ch) continue;
    var ok = true; for (var j = 0; j < ids.length; j++) if (!bd[ids[j]] || bd[ids[j]].h !== ch) { ok = false; break; }
    if (ok) { var key = ids.join('-'); if (!used[key]) { used[key] = true; results.push({ ids: ids, len: 4, type: 'square', orient: 'square' }); } }
  }
  return results;
}

function getBooster(shape) {
  var map = { '4line': { name: 'laser', emoji: '⚡', label: 'ЛАЗЕР' }, '5line': { name: 'star', emoji: '⭐', label: 'ЗВЕЗДА' }, '6line': { name: 'rainbow', emoji: '🌈', label: 'РАДУГА' }, 'L': { name: 'bomb', emoji: '💥', label: 'БОМБА' }, 'T': { name: 'laser', emoji: '⚡', label: 'ЛАЗЕР' }, 'square': { name: 'bomb', emoji: '💥', label: 'БОМБА' } };
  return map[shape.type] || null;
}

function findMatches(bd) {
  var allShapes = findAllCombinations(bd), matched = {}, shapes = [];
  for (var i = 0; i < allShapes.length; i++) {
    var shape = allShapes[i], ids = shape.ids, hasBomb = false;
    for (var j = 0; j < ids.length; j++) if (bd[ids[j]] && bd[ids[j]].sp === 'bomb') { hasBomb = true; break; }
    if (hasBomb) {
      var bombIdx = -1; for (var j = 0; j < ids.length; j++) if (bd[ids[j]] && bd[ids[j]].sp === 'bomb') { bombIdx = ids[j]; break; }
      if (bombIdx >= 0) { var neighbors = getAllNeighbors(bombIdx); for (var j = 0; j < neighbors.length; j++) matched[neighbors[j]] = true; matched[bombIdx] = true; }
    } else { for (var j = 0; j < ids.length; j++) matched[ids[j]] = true; shapes.push(shape); }
  }
  var matchedArr = []; for (var key in matched) matchedArr.push(parseInt(key));
  return { matched: matchedArr, shapes: shapes };
}

function anyMove(bd) {
  for (var i = 0; i < TOT; i++) { if (!bd[i]) continue; var ns = getNeighbors(i);
    for (var j = 0; j < ns.length; j++) { var ni = ns[j]; if (!bd[ni]) continue;
      var temp = bd[i]; bd[i] = bd[ni]; bd[ni] = temp; var result = findMatches(bd); var temp2 = bd[i]; bd[i] = bd[ni]; bd[ni] = temp2;
      if (result.matched.length > 0) return [i, ni]; } } return null;
}

function bestMove(bd) {
  var best = null, bestScore = -1;
  for (var i = 0; i < TOT; i++) { if (!bd[i]) continue; var ns = getNeighbors(i);
    for (var j = 0; j < ns.length; j++) { var ni = ns[j]; if (!bd[ni]) continue;
      var temp = bd[i]; bd[i] = bd[ni]; bd[ni] = temp; var result = findMatches(bd); var temp2 = bd[i]; bd[i] = bd[ni]; bd[ni] = temp2;
      if (result.matched.length > 0) {
        var sc = result.matched.length * 10;
        for (var k = 0; k < result.shapes.length; k++) { var sh = result.shapes[k]; sc += sh.len * 20; var booster = getBooster(sh); if (booster) sc += 200; if (sh.type === 'L' || sh.type === 'T') sc += 100; }
        if (sc > bestScore) { bestScore = sc; best = [i, ni]; } } } } return best;
}

function hasMatchAt(bd, idx) {
  var r = Math.floor(idx / NC), c = idx % NC, ch = bd[idx] ? bd[idx].h : null; if (!ch) return false;
  if (c >= 2 && bd[idx-1] && bd[idx-2] && bd[idx-1].h === ch && bd[idx-2].h === ch) return true;
  if (r >= 2 && bd[idx-NC] && bd[idx-2*NC] && bd[idx-NC].h === ch && bd[idx-2*NC].h === ch) return true; return false;
}

function initBoard() {
  board = []; levelComplete = false; victoryShown = false;
  for (var i = 0; i < TOT; i++) { var att = 0; do { board[i] = randomChar(); att++; } while (hasMatchAt(board, i) && att < 300); }
  reshuffleAttempts = 0;
  while (!anyMove(board) && reshuffleAttempts < 10) {
    reshuffleAttempts++;
    reshuffle(true);
  }
  if (!anyMove(board)) {
    for (var i = 0; i < TOT; i++) board[i] = randomChar();
    if (!anyMove(board)) {
      board = [];
      for (var i = 0; i < TOT; i++) { board[i] = randomChar(); while (hasMatchAt(board, i)) board[i] = randomChar(); }
    }
  }
  applyTheme(); updateUI();
}

function reshuffle(skipCheck) {
  var items = []; for (var i = 0; i < TOT; i++) if (board[i]) items.push(board[i]);
  for (var i = items.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = items[i]; items[i] = items[j]; items[j] = t; }
  var k = 0; for (var i = 0; i < TOT; i++) if (board[i]) { board[i] = items[k++]; board[i].sp = null; }
  for (var i = 0; i < TOT; i++) { if (!board[i]) board[i] = randomChar(); var att = 0; while (hasMatchAt(board, i) && att < 300) { board[i] = randomChar(); att++; } }
  if (!skipCheck && !anyMove(board)) {
    if (reshuffleAttempts < 10) {
      reshuffleAttempts++;
      reshuffle(false);
    } else {
      for (var i = 0; i < TOT; i++) board[i] = randomChar();
    }
  }
}

var THEMES = [{ id: 't1', name: '🌳 Дерево', bg: 't1' }, { id: 't2', name: '⚙️ Металл', bg: 't2' }, { id: 't3', name: '💡 Неон', bg: 't3' }, { id: 't4', name: '🧶 Бархат', bg: 't4' }, { id: 't5', name: '🎨 Пастель', bg: 't5' }];
function getTheme() { return THEMES[(level - 1) % THEMES.length]; }
function applyTheme() { var theme = getTheme(); document.getElementById('board').className = theme.id; document.getElementById('bg').className = 'bg ' + theme.bg; document.getElementById('uHz').textContent = theme.name; }

function calcSize() {
  var wrap = document.querySelector('.ba'), ww = wrap.clientWidth - 12, wh = wrap.clientHeight - 8;
  var bw = ww, bh = bw * NR / NC; if (bh > wh) { bh = wh; bw = bh * NC / NR; }
  var cw = Math.floor((bw - PAD * 2 - GAP * (NC - 1)) / NC), ch = Math.floor((bh - PAD * 2 - GAP * (NR - 1)) / NR);
  cellPx = Math.min(cw, ch); var bEl = document.getElementById('board');
  bEl.style.width = (cellPx * NC + GAP * (NC - 1) + PAD * 2) + 'px'; bEl.style.height = (cellPx * NR + GAP * (NR - 1) + PAD * 2) + 'px';
  bEl.style.gridTemplateColumns = 'repeat(' + NC + ',' + cellPx + 'px)'; bEl.style.gridTemplateRows = 'repeat(' + NR + ',' + cellPx + 'px)';
  bEl.style.gap = GAP + 'px'; bEl.style.padding = PAD + 'px';
}

function render(fallSet) {
  fallSet = fallSet || {}; var b = document.getElementById('board'); b.innerHTML = '';
  var hzPx = Math.max(16, Math.floor(cellPx * .44)), pyPx = Math.max(8, Math.floor(cellPx * .13)), ruPx = Math.max(8, Math.floor(cellPx * .12)), emPx = Math.max(8, Math.floor(cellPx * .12)), bdPx = Math.max(8, Math.floor(cellPx * .16));
  for (var i = 0; i < TOT; i++) {
    var el = document.createElement('div'); el.setAttribute('data-i', String(i)); var d = board[i];
    if (!d) { el.className = 'c empty'; } else {
      var cls = 'c c' + d.c; if (d.sp === 'bomb') cls += ' sp-bomb'; else if (d.sp === 'laser') cls += ' sp-laser'; else if (d.sp === 'star') cls += ' sp-star'; else if (d.sp === 'rainbow') cls += ' sp-rainbow';
      el.className = cls; el.style.width = cellPx + 'px'; el.style.height = cellPx + 'px';
      var badges = { bomb: '💥', laser: '⚡', star: '⭐', rainbow: '🌈' };
      el.innerHTML = '<span class="hz" style="font-size:' + hzPx + 'px">' + d.h + '</span><span class="py" style="font-size:' + pyPx + 'px">' + d.p + '</span><span class="ru" style="font-size:' + ruPx + 'px">' + d.r + '</span>' + (d.e ? '<span class="emo" style="font-size:' + emPx + 'px">' + d.e + '</span>' : '') + (d.sp ? '<span class="badge" style="font-size:' + bdPx + 'px">' + (badges[d.sp] || '✨') + '</span>' : '');
      if (sel === i) el.classList.add('sel');
      if (fallSet[i]) { el.classList.add('drop'); var row = Math.floor(i / NC); el.style.setProperty('--dy', (-(row + 1) * 68) + 'px'); el.style.setProperty('--dd', (0.2 + row * 0.04) + 's'); }
    } b.appendChild(el);
  }
}

function updateUI() {
  document.getElementById('uSc').textContent = score;
  document.getElementById('uCo').textContent = combo;
  document.getElementById('uLv').textContent = level;

document.addEventListener('DOMContentLoaded', function() {
  var bEl = document.getElementById('board'), si = -1, sx = 0, sy = 0, mv = false;
  function getIdx(e) { var t = e.touches ? e.touches[0] : e, el = document.elementFromPoint(t.clientX, t.clientY); while (el && el !== document.body) { if (el.getAttribute && el.getAttribute('data-i') !== null) return parseInt(el.getAttribute('data-i')); el = el.parentElement; } return -1; }
  bEl.addEventListener('pointerdown', function(e) { if (busy || levelComplete) return; var i = getIdx(e); if (i < 0 || !board[i]) return; si = i; sx = e.clientX; sy = e.clientY; mv = false; var el = document.querySelectorAll('.c')[i]; if (el) el.classList.add('drag'); try { bEl.setPointerCapture(e.pointerId); } catch (ex) {} e.preventDefault(); });
  bEl.addEventListener('pointermove', function(e) { if (si < 0 || busy || levelComplete) return; var dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) < 16 && Math.abs(dy) < 16) return; mv = true; var tgt = -1; if (Math.abs(dx) > Math.abs(dy)) { var c = si % NC; if (dx > 0 && c < NC - 1) tgt = si + 1; else if (dx < 0 && c > 0) tgt = si - 1; } else { var r = Math.floor(si / NC); if (dy > 0 && r < NR - 1) tgt = si + NC; else if (dy < 0 && r > 0) tgt = si - NC; } var se = document.querySelectorAll('.c')[si]; if (se) se.classList.remove('drag'); if (tgt >= 0 && board[tgt]) { var a = si; si = -1; sel = -1; trySwap(a, tgt); } e.preventDefault(); });
  bEl.addEventListener('pointerup', function(e) { if (si >= 0) { var el = document.querySelectorAll('.c')[si]; if (el) el.classList.remove('drag'); } if (!mv && si >= 0 && !busy && !levelComplete) onClick(si); si = -1; mv = false; e.preventDefault(); });
  bEl.addEventListener('pointercancel', function() { if (si >= 0) { var el = document.querySelectorAll('.c')[si]; if (el) el.classList.remove('drag'); } si = -1; mv = false; });
  bEl.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  initBoard(); calcSize(); render(); updateUI();

});
