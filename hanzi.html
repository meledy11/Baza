<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🀄 Ханзи: Путь Мастера</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0f;color:#fff;}
body{display:flex;flex-direction:column;align-items:center;}

/* Фоны (8 тем) */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 1s ease;}
.bg.t1{background:linear-gradient(135deg,#0a0a0f,#1a0a2e);} /* Ночь */
.bg.t2{background:linear-gradient(135deg,#05101a,#0a2030);} /* Глубина */
.bg.t3{background:linear-gradient(135deg,#0a1a0a,#0f2a0f);} /* Бамбук */
.bg.t4{background:linear-gradient(135deg,#1a0505,#2e0a0a);} /* Лава */
.bg.t5{background:linear-gradient(135deg,#100520,#200a30);} /* Мистика */
.bg.t6{background:linear-gradient(135deg,#1c1c1c,#2b1d0e);} /* Золото */
.bg.t7{background:linear-gradient(135deg,#000000,#1a1a1a);} /* Обсидиан */
.bg.t8{background:linear-gradient(135deg,#0f0f1a,#1a2a3a);} /* Сталь */

.hdr{position:relative;z-index:10;width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;flex-shrink:0;}
.logo-box{display:flex;flex-direction:column;}
.logo{font-size:1rem;font-weight:900;background:linear-gradient(to right,#ffd700,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.rank{font-size:.6rem;color:#aaa;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}

.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:2px 8px;font-size:.65rem;display:flex;align-items:center;gap:4px;}
.stat b{font-size:.8rem;}
.c-gold{color:#ffd700;} .c-red{color:#ff6b6b;} .c-grn{color:#2ecc71;} .c-pur{color:#a855f7;} .c-cyan{color:#22d3ee;} .c-blue{color:#3b82f6;}

.pw{position:relative;z-index:10;width:100%;max-width:600px;padding:0 12px 6px;flex-shrink:0;}
.pt{height:6px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;}
.pf{height:100%;background:linear-gradient(90deg,#ff6b6b,#ffd700,#2ecc71);transition:width .4s ease-out;}
.pl{display:flex;justify-content:space-between;font-size:.6rem;color:rgba(255,255,255,.4);margin-top:2px;}

.ba{position:relative;z-index:5;flex:1;width:100%;max-width:600px;display:flex;align-items:center;justify-content:center;padding:4px;}
#board{display:grid;background:rgba(0,0,0,.2);border-radius:12px;border:1px solid rgba(255,255,255,.05);box-shadow:0 10px 40px rgba(0,0,0,.5);}

.c{position:relative;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.05);transition:transform .12s;}
.c::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.1),transparent 60%);pointer-events:none;}

/* Цвета плиток (зависят от темы .t1-.t8) */
.t1 .c0{background:#c44a2a;} .t1 .c1{background:#c49a2a;} .t1 .c2{background:#2a8a3a;} .t1 .c3{background:#2a4a8a;} .t1 .c4{background:#5a2a8a;} .t1 .c5{background:#2a6a6a;}
.t2 .c0{background:#4a4a8a;} .t2 .c1{background:#4a7a4a;} .t2 .c2{background:#2a5a8a;} .t2 .c3{background:#6a4a4a;} .t2 .c4{background:#4a2a7a;} .t2 .c5{background:#2a5a5a;}
.t3 .c0{background:#cc3333;} .t3 .c1{background:#cca800;} .t3 .c2{background:#33cc33;} .t3 .c3{background:#3388cc;} .t3 .c4{background:#8844cc;} .t3 .c5{background:#cc33cc;}
.t4 .c0{background:#8b0000;} .t4 .c1{background:#8b4500;} .t4 .c2{background:#006400;} .t4 .c3{background:#00008b;} .t4 .c4{background:#4b0082;} .t4 .c5{background:#2f4f4f;}
.t5 .c0{background:#800080;} .t5 .c1{background:#daa520;} .t5 .c2{background:#008000;} .t5 .c3{background:#0000ff;} .t5 .c4{background:#ff1493;} .t5 .c5{background:#00ced1;}
.t6 .c0{background:#b8860b;} .t6 .c1{background:#cd853f;} .t6 .c2{background:#556b2f;} .t6 .c3{background:#483d8b;} .t6 .c4{background:#8b0000;} .t6 .c5{background:#2e8b57;}
.t7 .c0{background:#333;} .t7 .c1{background:#555;} .t7 .c2{background:#777;} .t7 .c3{background:#444;} .t7 .c4{background:#666;} .t7 .c5{background:#222;}
.t8 .c0{background:#4682b4;} .t8 .c1{background:#5f9ea0;} .t8 .c2{background:#708090;} .t8 .c3{background:#6a5acd;} .t8 .c4{background:#20b2aa;} .t8 .c5{background:#778899;}

/* Спец-эффекты */
.c.sp-bomb{border:2px solid #ff4444!important;box-shadow:0 0 15px #ff4444;}
.c.sp-laser{border:2px solid #aa88ee!important;box-shadow:0 0 15px #aa88ee;}
.c.sp-star{border:2px solid #88eebb!important;box-shadow:0 0 15px #88eebb;}
.c.sp-rainbow{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)!important;border:2px solid #fff!important;}

/* Текст внутри плитки */
.c .hz{font-size:1.4rem;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8);z-index:2;line-height:1;}
.c .py{font-size:.5rem;color:rgba(255,255,255,.8);margin-top:1px;z-index:2;}
.c .ru{
    font-size:.5rem; font-weight:700; color:#fff; 
    background:rgba(0,0,0,.6); padding:1px 4px; border-radius:4px; 
    margin-top:2px; z-index:3; max-width:95%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.c .emo{position:absolute;bottom:2px;left:2px;font-size:.6rem;opacity:.3;z-index:1;}
.c .badge{position:absolute;top:1px;right:2px;font-size:.7rem;z-index:4;text-shadow:0 0 5px #000;}

/* Анимации и состояния */
.c.sel{transform:scale(1.1);z-index:10;box-shadow:0 0 0 2px #ffd700;}
.c.gone{animation:pop .3s forwards;}
@keyframes pop{to{transform:scale(0);opacity:0;}}
.c.drop{animation:drop .4s cubic-bezier(.175,.885,.32,1.275);}
@keyframes drop{from{transform:translateY(-50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.c.best{animation:pulse 1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.4);}70%{box-shadow:0 0 0 10px rgba(46,204,113,0);}100%{box-shadow:0 0 0 0 rgba(46,204,113,0);}}

.bar{position:relative;z-index:10;width:100%;max-width:600px;display:flex;gap:6px;justify-content:center;padding:8px;flex-shrink:0;}
.btn{padding:8px 12px;border:none;border-radius:10px;font-weight:700;font-size:.7rem;cursor:pointer;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:4px;transition:.2s;}
.btn:active{transform:scale(.95);}
.btn.buy{border-color:rgba(255,215,0,.3);color:#ffd700;}
.btn small{font-size:.55rem;opacity:.7;display:block;line-height:1;}
.btn.off{opacity:.3;pointer-events:none;}

/* Всплывающие окна */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#1a1a2e;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:24px;max-width:340px;width:90%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.8);}
.modal h2{color:#ffd700;margin-bottom:10px;}
.modal p{font-size:.85rem;color:#ccc;margin-bottom:15px;line-height:1.5;}
.modal button{background:linear-gradient(45deg,#ffd700,#ff6b6b);border:none;padding:10px 24px;border-radius:20px;font-weight:bold;color:#000;cursor:pointer;font-size:.9rem;}

.fpts{position:absolute;pointer-events:none;z-index:50;font-weight:bold;color:#ffd700;text-shadow:0 0 5px #000;animation:floatUp 1s forwards;}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-40px) scale(1.2);opacity:0;}}
</style>
</head>
<body>

<div class="bg t1" id="bg"></div>

<div class="hdr">
  <div class="logo-box">
    <div class="logo">🀄 Ханзи</div>
    <div class="rank" id="uRank">Новичок</div>
  </div>
  <div class="stats">
    <div class="stat">⭐<b class="c-gold" id="uSc">0</b></div>
    <div class="stat">🎯<b class="c-grn" id="uLv">1</b></div>
    <div class="stat">🪙<b class="c-cyan" id="uCoin">100</b></div>
    <div class="stat">💎<b class="c-pur" id="uCry">5</b></div>
  </div>
</div>

<div class="pw">
  <div class="pt"><div class="pf" id="pFill" style="width:0%"></div></div>
  <div class="pl"><span>Цель: <b id="uGl">500</b></span><span id="uTheme">Тема: Ночь</span></div>
</div>

<div class="ba"><div id="board" class="t1"></div></div>

<div class="bar">
  <button class="btn" id="bSh" onclick="G.action('shuffle')">🔀<span id="cSh">3</span><small>Беспл.</small></button>
  <button class="btn" id="bHi" onclick="G.action('hint')">💡<span id="cHi">3</span><small>Беспл.</small></button>
  <button class="btn" id="bBm" onclick="G.action('bomb')">💥<small>5💎</small></button>
  <button class="btn" onclick="G.showTut()">❓</button>
</div>

<!-- Туториал / Модалки -->
<div class="overlay" id="tov">
  <div class="modal">
    <h2 id="tTi">Как играть?</h2>
    <p id="tSt">Собирайте 3+ одинаковых иероглифа.<br>4 в ряд = Лазер ⚡<br>L/T форма = Бомба 💥<br>5 в ряд = Звезда ⭐</p>
    <button onclick="G.closeTut()">Понятно</button>
  </div>
</div>

<script src="app.js"></script>
<script>
// === КОНФИГУРАЦИЯ И ДАННЫЕ ===
var RANKS = ["Новичок","Ученик","Мастер","Эксперт","Гуру","Магистр","Мудрец","Император"];
var NC=6, NR=8, TOT=NC*NR;
var DB_FALLBACK = [
    [{h:"人",p:"rén",r:"человек",e:"👤"},{h:"大",p:"dà",r:"большой",e:"📏"},{h:"小",p:"xiǎo",r:"маленький",e:"🔬"},{h:"好",p:"hǎo",r:"хороший",e:"👍"},{h:"水",p:"shuǐ",r:"вода",e:"💧"}],
    [{h:"火",p:"huǒ",r:"огонь",e:"🔥"},{h:"山",p:"shān",r:"гора",e:"⛰️"},{h:"月",p:"yuè",r:"луна",e:"🌙"},{h:"日",p:"rì",r:"солнце",e:"🌞"},{h:"花",p:"huā",r:"цветок",e:"🌸"}],
    [{h:"鱼",p:"yú",r:"рыба",e:"🐟"},{h:"鸟",p:"niǎo",r:"птица",e:"🐦"},{h:"马",p:"mǎ",r:"лошадь",e:"🐴"},{h:"龙",p:"lóng",r:"дракон",e:"🐉"},{h:"风",p:"fēng",r:"ветер",e:"🌬️"}],
    [{h:"雨",p:"yǔ",r:"дождь",e:"🌧️"},{h:"雪",p:"xuě",r:"снег",e:"❄️"},{h:"星",p:"xīng",r:"звезда",e:"⭐"},{h:"心",p:"xīn",r:"сердце",e:"💖"},{h:"手",p:"shǒu",r:"рука",e:"✋"}]
];

// Генерация уровней из DB или fallback
var LEVELS = [];
if(typeof DB !== 'undefined' && DB.length > 0) {
    for(var i=0; i<Math.ceil(DB.length/5); i++) {
        var set = [];
        for(var j=0; j<5; j++) {
            var d = DB[(i*5+j)%DB.length];
            set.push({h:d[0], p:d[1], r:d[2], e:d[3]||'🀄'});
        }
        LEVELS.push(set);
    }
} else { LEVELS = DB_FALLBACK; }

// === СОСТОЯНИЕ ИГРЫ ===
var state = {
    board: [], score: 0, level: 1, goal: 500, 
    coins: 100, crystals: 5, 
    shufFree: 3, hintFree: 3,
    busy: false, sel: -1, combo: 0
};

// Цены магазина
var PRICE_HINT = 50;
var PRICE_SHUF = 80;
var PRICE_BOMB = 5; // В кристаллах

// === ОСНОВНАЯ ЛОГИКА (MATCH-3 ENGINE) ===
function init() {
    loadProgress();
    updateUI();
    startLevel();
    window.addEventListener('resize', calcSize);
    
    // Pointer events
    var b = document.getElementById('board');
    b.addEventListener('pointerdown', onDown);
    b.addEventListener('pointermove', onMove);
    b.addEventListener('pointerup', onUp);
}

function startLevel() {
    state.score = 0;
    // Формула сложности: растет с уровнем
    state.goal = Math.floor(500 * state.level * 1.2); 
    state.board = [];
    state.busy = false;
    state.sel = -1;
    
    // Выбор темы фона
    var themeIdx = (state.level - 1) % 8;
    document.getElementById('bg').className = 'bg t' + (themeIdx+1);
    document.getElementById('board').className = 't' + (themeIdx+1);
    document.getElementById('uTheme').innerText = "Тема: " + ["Ночь","Глубина","Бамбук","Лава","Мистика","Золото","Обсидиан","Сталь"][themeIdx];
    
    // Генерация поля без готовых матчей
    for(var i=0; i<TOT; i++) {
        do { state.board[i] = randChar(); } while(hasMatch(i));
    }
    if(!anyMove()) reshuffleBoard(true);
    
    calcSize();
    render();
    updateUI();
}

function randChar() {
    var set = LEVELS[(state.level-1) % LEVELS.length];
    var c = set[Math.floor(Math.random()*set.length)];
    return {h:c.h, p:c.p, r:c.r, e:c.e, c:set.indexOf(c), sp:null};
}

function hasMatch(idx) {
    var r=Math.floor(idx/NC), c=idx%NC, ch=state.board[idx].h;
    if(c>=2 && state.board[idx-1].h==ch && state.board[idx-2].h==ch) return true;
    if(r>=2 && state.board[idx-NC].h==ch && state.board[idx-2*NC].h==ch) return true;
    return false;
}

function findMatches() {
    var matched = {}, shapes = [];
    // Горизонталь
    for(var r=0;r<NR;r++) for(var c=0;c<NC-2;c++) {
        var i=r*NC+c, ch=state.board[i].h, len=1;
        while(c+len<NC && state.board[i+len].h==ch) len++;
        if(len>=3) {
            var ids=[]; for(var k=0;k<len;k++) ids.push(i+k);
            shapes.push({ids:ids, type:len>=5?'star':len==4?'laser':'line', orient:'h'});
            ids.forEach(x=>matched[x]=true);
            c+=len-1;
        }
    }
    // Вертикаль
    for(var c=0;c<NC;c++) for(var r=0;r<NR-2;r++) {
        var i=r*NC+c, ch=state.board[i].h, len=1;
        while(r+len<NR && state.board[i+len*NC].h==ch) len++;
        if(len>=3) {
            var ids=[]; for(var k=0;k<len;k++) ids.push(i+k*NC);
            shapes.push({ids:ids, type:len>=5?'star':len==4?'laser':'line', orient:'v'});
            ids.forEach(x=>matched[x]=true);
            r+=len-1;
        }
    }
    // L/T формы (упрощенно проверяем пересечения в shapes)
    // Для простоты в этом коде: если линия > 3, это уже бонус. 
    // Полная проверка L/T форм требует сложного перебора, здесь оставлена базовая логика линий.
    
    return {matched:Object.keys(matched).map(Number), shapes:shapes};
}

async function resolve(matches, shapes) {
    if(matches.length===0) { state.combo=0; checkWin(); return; }
    state.combo++;
    state.busy = true;
    
    // Начисление очков и валюты
    var pts = matches.length * 10 * state.combo;
    var coinsEarned = Math.floor(matches.length / 3);
    var cryEarned = 0;
    
    // Создание бонусов
    shapes.forEach(s => {
        if(s.type !== 'line') {
            var mid = s.ids[Math.floor(s.ids.length/2)];
            if(state.board[mid]) {
                state.board[mid].sp = s.type; // laser или star
                pts += 50;
                if(s.type==='star') cryEarned++; // За звезду даем кристалл
            }
        }
    });
    
    state.score += pts;
    state.coins += coinsEarned;
    state.crystals += cryEarned;
    
    // Анимация удаления
    render();
    floatText(pts, matches[0]);
    await sleep(300);
    
    // Удаление и гравитация
    matches.forEach(i => state.board[i] = null);
    applyGravity();
    render();
    await sleep(300);
    
    // Рекурсия
    var next = findMatches();
    await resolve(next.matched, next.shapes);
}

function applyGravity() {
    for(var c=0;c<NC;c++) {
        var w=NR-1;
        for(var r=NR-1;r>=0;r--) {
            var i=r*NC+c;
            if(state.board[i]) {
                if(w!==r) { state.board[w*NC+c]=state.board[i]; state.board[i]=null; }
                w--;
            }
        }
        while(w>=0) { state.board[w*NC+c]=randChar(); w--; }
    }
}

function checkWin() {
    state.busy = false;
    if(state.score >= state.goal) {
        state.level++;
        state.shufFree = Math.min(state.shufFree+1, 5);
        state.hintFree = Math.min(state.hintFree+1, 5);
        state.crystals += 2; // Бонус за уровень
        saveProgress();
        alert("Уровень пройден! +2 💎");
        startLevel();
    } else if(!anyMove()) {
        reshuffleBoard();
    }
    updateUI();
}

// === ВЗАИМОДЕЙСТВИЕ ===
var dragStart = -1, isDrag = false;

function getIdx(e) {
    var t = e.touches?e.touches[0]:e;
    var el = document.elementFromPoint(t.clientX, t.clientY);
    while(el && el.id!=='board') {
        if(el.dataset.i) return parseInt(el.dataset.i);
        el = el.parentElement;
    }
    return -1;
}

function onDown(e) {
    if(state.busy) return;
    var i = getIdx(e);
    if(i<0) return;
    dragStart = i;
    isDrag = false;
    if(state.sel<0) { state.sel=i; render(); }
    else if(state.sel===i) { state.sel=-1; render(); }
    else if(isNeigh(state.sel, i)) { trySwap(state.sel, i); state.sel=-1; }
    else { state.sel=i; render(); }
}
function onMove(e) { if(dragStart>=0) isDrag=true; }
function onUp(e) { dragStart=-1; }

function isNeigh(a,b) {
    var ra=Math.floor(a/NC), ca=a%NC, rb=Math.floor(b/NC), cb=b%NC;
    return Math.abs(ra-rb)+Math.abs(ca-cb)===1;
}

async function trySwap(a,b) {
    state.busy=true;
    // Swap data
    var t=state.board[a]; state.board[a]=state.board[b]; state.board[b]=t;
    render();
    await sleep(200);
    
    var res = findMatches();
    if(res.matched.length>0) {
        await resolve(res.matched, res.shapes);
    } else {
        // Swap back
        t=state.board[a]; state.board[a]=state.board[b]; state.board[b]=t;
        render();
        state.busy=false;
    }
}

// === МАГАЗИН И КНОПКИ ===
var G = {
    action: function(type) {
        if(state.busy) return;
        
        if(type==='shuffle') {
            if(state.shufFree>0) { state.shufFree--; reshuffleBoard(); }
            else if(state.coins>=PRICE_SHUF) { 
                if(confirm("Купить перемешивание за "+PRICE_SHUF+" 🪙?")) {
                    state.coins-=PRICE_SHUF; reshuffleBoard(); 
                }
            } else { alert("Не хватает монет!"); }
        }
        else if(type==='hint') {
            if(state.hintFree>0) { state.hintFree--; showHint(); }
            else if(state.coins>=PRICE_HINT) {
                if(confirm("Купить подсказку за "+PRICE_HINT+" 🪙?")) {
                    state.coins-=PRICE_HINT; showHint();
                }
            } else { alert("Не хватает монет!"); }
        }
        else if(type==='bomb') {
            if(state.crystals>=PRICE_BOMB) {
                if(confirm("Установить бомбу за "+PRICE_BOMB+" 💎?")) {
                    state.crystals-=PRICE_BOMB; placeBomb();
                }
            } else { alert("Не хватает кристаллов!"); }
        }
        updateUI();
    },
    showTut: ()=>document.getElementById('tov').classList.add('show'),
    closeTut: ()=>document.getElementById('tov').classList.remove('show')
};

function showHint() {
    // Простой поиск хода
    for(var i=0;i<TOT;i++) {
        var ns = [[0,1],[1,0]];
        for(var n of ns) {
            var r=Math.floor(i/NC)+n[0], c=i%NC+n[1];
            if(r<NR && c<NC) {
                var j=r*NC+c;
                var t=state.board[i]; state.board[i]=state.board[j]; state.board[j]=t;
                if(findMatches().matched.length>0) {
                    state.board[j]=state.board[i]; state.board[i]=t;
                    // Подсветка
                    var els = document.querySelectorAll('.c');
                    els[i].classList.add('best'); els[j].classList.add('best');
                    setTimeout(()=>{els[i].classList.remove('best');els[j].classList.remove('best');},1500);
                    return;
                }
                state.board[j]=state.board[i]; state.board[i]=t;
            }
        }
    }
}

function placeBomb() {
    // Ставим бомбу в случайное место
    var idx = Math.floor(Math.random()*TOT);
    state.board[idx].sp = 'bomb';
    render();
    // Сразу активируем её для эффекта
    setTimeout(()=>{
        var area = [];
        for(var r=-1;r<=1;r++) for(var c=-1;c<=1;c++) {
            var ni = (Math.floor(idx/NC)+r)*NC + (idx%NC+c);
            if(ni>=0 && ni<TOT) area.push(ni);
        }
        resolve(area, []);
    }, 500);
}

function reshuffleBoard(silent) {
    var items = state.board.filter(x=>x);
    items.sort(()=>Math.random()-.5);
    var k=0;
    for(var i=0;i<TOT;i++) if(state.board[i]) state.board[i]=items[k++];
    if(!anyMove() && !silent) reshuffleBoard(true);
    if(!silent) { render(); updateUI(); }
}

function anyMove() {
    for(var i=0;i<TOT;i++) {
        var ns=[[0,1],[1,0]];
        for(var n of ns) {
            var r=Math.floor(i/NC)+n[0], c=i%NC+n[1];
            if(r<NR && c<NC) {
                var j=r*NC+c;
                var t=state.board[i]; state.board[i]=state.board[j]; state.board[j]=t;
                var ok=findMatches().matched.length>0;
                state.board[j]=state.board[i]; state.board[i]=t;
                if(ok) return true;
            }
        }
    }
    return false;
}

// === ОТРИСОВКА И UI ===
var cellPx=0;
function calcSize() {
    var ba=document.querySelector('.ba');
    var w=ba.clientWidth-8, h=ba.clientHeight-8;
    var cw=(w-(NC-1)*4)/NC, ch=(h-(NR-1)*4)/NR;
    cellPx=Math.min(cw,ch);
    var b=document.getElementById('board');
    b.style.width=(cellPx*NC+(NC-1)*4)+'px';
    b.style.height=(cellPx*NR+(NR-1)*4)+'px';
    b.style.gridTemplateColumns=`repeat(${NC},${cellPx}px)`;
    b.style.gridTemplateRows=`repeat(${NR},${cellPx}px)`;
    b.style.gap='4px';
    render();
}

function render() {
    var b=document.getElementById('board');
    b.innerHTML='';
    var fsH=Math.max(14,cellPx*.45);
    var fsP=Math.max(8,cellPx*.15);
    var fsR=Math.max(8,cellPx*.14);
    
    for(var i=0;i<TOT;i++) {
        var d=state.board[i];
        var el=document.createElement('div');
        el.className='c c'+(d?d.c:0);
        el.dataset.i=i;
        el.style.width=cellPx+'px'; el.style.height=cellPx+'px';
        if(i===state.sel) el.classList.add('sel');
        
        if(d) {
            if(d.sp) el.classList.add('sp-'+d.sp);
            el.innerHTML=`
                <span class="hz" style="font-size:${fsH}px">${d.h}</span>
                <span class="py" style="font-size:${fsP}px">${d.p}</span>
                <span class="ru" style="font-size:${fsR}px">${d.r}</span>
                <span class="emo">${d.e}</span>
                ${d.sp?'<span class="badge">'+(d.sp=='bomb'?'💥':d.sp=='laser'?'⚡':'⭐')+'</span>':''}
            `;
        }
        b.appendChild(el);
    }
}

function updateUI() {
    document.getElementById('uSc').innerText=state.score;
    document.getElementById('uLv').innerText=state.level;
    document.getElementById('uCoin').innerText=state.coins;
    document.getElementById('uCry').innerText=state.crystals;
    document.getElementById('uGl').innerText=state.goal;
    document.getElementById('pFill').style.width=Math.min(100,state.score/state.goal*100)+'%';
    
    // Ранг
    var rIdx = Math.min(RANKS.length-1, Math.floor((state.level-1)/5));
    document.getElementById('uRank').innerText = RANKS[rIdx];
    
    // Кнопки
    var bSh=document.getElementById('bSh');
    var bHi=document.getElementById('bHi');
    
    if(state.shufFree>0) {
        bSh.innerHTML=`🔀<span>${state.shufFree}</span><small>Беспл.</small>`;
        bSh.classList.remove('buy');
    } else {
        bSh.innerHTML=`🔀<small>${PRICE_SHUF}🪙</small>`;
        bSh.classList.add('buy');
    }
    
    if(state.hintFree>0) {
        bHi.innerHTML=`💡<span>${state.hintFree}</span><small>Беспл.</small>`;
        bHi.classList.remove('buy');
    } else {
        bHi.innerHTML=`💡<small>${PRICE_HINT}🪙</small>`;
        bHi.classList.add('buy');
    }
}

function floatText(txt, idx) {
    var el=document.querySelectorAll('.c')[idx];
    if(!el) return;
    var f=document.createElement('div');
    f.className='fpts'; f.innerText='+'+txt;
    f.style.left=el.offsetLeft+'px'; f.style.top=el.offsetTop+'px';
    f.style.fontSize=(cellPx*.3)+'px';
    document.getElementById('board').appendChild(f);
    setTimeout(()=>f.remove(),1000);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function saveProgress() {
    localStorage.setItem('hanzi_save', JSON.stringify({
        lvl:state.level, coins:state.coins, cry:state.crystals, 
        sf:state.shufFree, hf:state.hintFree
    }));
}
function loadProgress() {
    var s=localStorage.getItem('hanzi_save');
    if(s) {
        var d=JSON.parse(s);
        state.level=d.lvl||1; state.coins=d.coins||0; state.crystals=d.cry||0;
        state.shufFree=d.sf||3; state.hintFree=d.hf||3;
    }
}

init();
</script>
