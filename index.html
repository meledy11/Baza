<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>🀄 Ханзи · HanMap 600</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0a0a0f;
    }
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      z-index: 100;
      position: relative;
      flex-wrap: wrap;
    }
    .nav-bar .logo {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffd700, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-right: auto;
    }
    .nav-btn {
      padding: 10px 22px;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }
    .nav-btn:active {
      transform: scale(0.95);
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #ffd700, #f59e0b);
      color: #1a1a2e;
      border-color: #ffd700;
      box-shadow: 0 4px 30px rgba(255, 215, 0, 0.3);
    }
    .nav-btn .icon {
      margin-right: 6px;
    }
    .nav-btn .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ff6b6b;
      color: #fff;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }
    .iframe-wrapper {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0a0a0f;
    }
    .iframe-wrapper iframe.hidden {
      display: none;
    }
    @media (max-width: 600px) {
      .nav-bar {
        padding: 8px 12px;
        gap: 6px;
      }
      .nav-bar .logo {
        font-size: 16px;
        margin-right: 4px;
      }
      .nav-btn {
        padding: 8px 14px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="nav-bar">
      <div class="logo">🀄 Ханзи</div>
      <button class="nav-btn active" data-app="hanzi" id="btnHanzi">
        <span class="icon">🎮</span> Игра
      </button>
      <button class="nav-btn" data-app="hanmap" id="btnHanmap">
        <span class="icon">📚</span> Словарь
        <span class="badge">600</span>
      </button>
    </div>
    <div class="iframe-wrapper">
      <iframe id="frameHanzi" src="hanzi.html"></iframe>
      <iframe id="frameHanmap" src="hanmap.html" class="hidden"></iframe>
    </div>
  </div>
  <script>
    const btnHanzi = document.getElementById('btnHanzi');
    const btnHanmap = document.getElementById('btnHanmap');
    const frameHanzi = document.getElementById('frameHanzi');
    const frameHanmap = document.getElementById('frameHanmap');
    let currentApp = localStorage.getItem('hanzi_app') || 'hanzi';
    function switchApp(app) {
      currentApp = app;
      localStorage.setItem('hanzi_app', app);
      btnHanzi.classList.toggle('active', app === 'hanzi');
      btnHanmap.classList.toggle('active', app === 'hanmap');
      frameHanzi.classList.toggle('hidden', app !== 'hanzi');
      frameHanmap.classList.toggle('hidden', app !== 'hanmap');
      setTimeout(() => {
        const frame = app === 'hanzi' ? frameHanzi : frameHanmap;
        if (frame) frame.style.height = '100%';
      }, 100);
    }
    btnHanzi.addEventListener('click', () => switchApp('hanzi'));
    btnHanmap.addEventListener('click', () => switchApp('hanmap'));
    document.addEventListener('keydown', (e) => {
      if (e.key === '1') switchApp('hanzi');
      if (e.key === '2') switchApp('hanmap');
    });
    switchApp(currentApp);
    window.addEventListener('resize', () => {
      const frame = currentApp === 'hanzi' ? frameHanzi : frameHanmap;
      if (frame) frame.style.height = '100%';
    });
  </script>
</body>
</html>
